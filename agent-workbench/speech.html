<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!--
  =========================================================================
  业务场景：南京江北新区政务 AI 智能体平台 · 发言稿智能生成智能体
  端类型：PC 端（Naive UI）
  研发对接说明：
    1. CDN → npm 包：vue@3 → npm i vue；naive-ui → npm i naive-ui；用 Vite 脚手架。
    2. template → .vue SFC：将下方 template 字符串内容迁入 <template>，setup() 逻辑迁入 <script setup>。
    3. 主题配置（themeOverrides）与 AI 动效 CSS（:root 变量、keyframes、prefers-reduced-motion）原样保留。
    4. 组件全部使用 Naive UI 真实组件，AI 对话/流式区为基础元素 + 自定义 CSS。
  =========================================================================
-->
<title>发言稿智能生成智能体 - 江北新区智能体平台</title>
<script src="https://unpkg.com/vue@3"></script>
<script src="https://unpkg.com/naive-ui/dist/index.prod.js"></script>
<style>
  :root{
    --ai-navy:#0A3573; --ai-blue:#0E4C92; --ai-cyan:#13A8A8; --ai-green:#43A047;
    --ai-glow:0 0 16px rgba(19,168,168,.35);
    --bg:#F4F6F9; --card:#ffffff; --text:#333639; --text-2:#5a6b85; --text-3:#909aad;
    --border:#e4e7ed; --border-2:#eef2f7;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);}
  .icon{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;vertical-align:-0.125em;}

  /* AI 动效 */
  @keyframes blink{50%{opacity:0}}
  .typing-cursor::after{content:'▍';margin-left:2px;color:var(--ai-cyan);animation:blink 1s steps(1) infinite}
  @keyframes dot-bounce{0%,80%,100%{transform:scale(.5);opacity:.3}40%{transform:scale(1);opacity:1}}
  .thinking-dot{width:6px;height:6px;border-radius:50%;background:var(--ai-cyan);display:inline-block;animation:dot-bounce 1.2s infinite ease-in-out}
  .thinking-dot:nth-child(2){animation-delay:.15s}.thinking-dot:nth-child(3){animation-delay:.3s}
  .agent-card{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
  .agent-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(14,76,146,.15);border-color:var(--ai-cyan)}
  .agent-avatar{background:linear-gradient(135deg,var(--ai-blue),var(--ai-cyan));box-shadow:var(--ai-glow)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .bubble{animation:fadeUp .3s ease}
  .ai-gradient-text{background:linear-gradient(90deg,#0E4C92,#13A8A8,#43A047);-webkit-background-clip:text;background-clip:text;color:transparent}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spinner{width:40px;height:40px;border:3px solid #eef2f7;border-top-color:var(--ai-blue);border-radius:50%;animation:spin .8s linear infinite}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

  /* 布局 */
  .app-container{display:flex;height:100vh;width:100vw;overflow:hidden;}

  /* 侧边栏 */
  .sidebar{width:248px;background:linear-gradient(180deg,#0A3573 0%,#0E4C92 100%);color:#fff;display:flex;flex-direction:column;flex-shrink:0;position:relative;transition:width .3s ease;}
  .sidebar.collapsed{width:60px;}
  .sidebar.collapsed .sidebar-header,.sidebar.collapsed .sidebar-section-title,.sidebar.collapsed .history-filter,.sidebar.collapsed .history-list,.sidebar.collapsed .sidebar-footer .user-info{display:none;}
  .sidebar.collapsed .sidebar-collapsed-logo{display:flex;}
  .sidebar-collapsed-logo{display:none;justify-content:center;padding:18px 0;}
  .sidebar-toggle{position:absolute;top:22px;right:-12px;width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--border);color:var(--text-2);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .sidebar-toggle:hover{background:var(--ai-blue);color:#fff;border-color:var(--ai-blue);}
  .sidebar-header{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.12);}
  .sidebar-logo{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px;}
  .logo-icon{width:30px;height:30px;background:linear-gradient(135deg,var(--ai-cyan),#2BBDBD);border-radius:6px;color:#fff;font-weight:700;text-align:center;line-height:30px;font-size:15px;flex-shrink:0;}
  .sidebar-section-title{padding:14px 16px 6px;font-size:12px;color:rgba(255,255,255,.55);}
  .history-filter{padding:0 12px 8px;display:flex;flex-direction:column;gap:6px;}
  .history-list{flex:1;overflow-y:auto;padding:0 8px;}
  .history-list::-webkit-scrollbar{width:4px;}.history-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px;}
  .history-item{padding:10px 12px;margin-bottom:4px;border-radius:6px;cursor:pointer;transition:background .2s;font-size:13px;color:rgba(255,255,255,.85);display:flex;flex-direction:column;gap:4px;}
  .history-item:hover{background:rgba(255,255,255,.08);}
  .history-item.active{background:rgba(19,168,168,.22);border-left:3px solid var(--ai-cyan);}
  .history-item-title{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .history-item-time{font-size:11px;color:rgba(255,255,255,.45);}
  .history-status{display:inline-block;align-self:flex-start;padding:1px 7px;font-size:10px;border-radius:9px;line-height:16px;margin-top:2px;font-weight:500;}
  .st-draft{background:rgba(255,255,255,.15);color:#cfd8e6;}
  .st-outline{background:rgba(19,168,168,.3);color:#9fe9e9;}
  .st-speech{background:rgba(67,160,71,.3);color:#bfe9c1;}
  .st-edited{background:rgba(240,173,78,.3);color:#ffe2b0;}
  .st-exported{background:rgba(156,120,216,.35);color:#dcc8ff;}
  .history-empty{padding:30px 12px;text-align:center;color:rgba(255,255,255,.4);font-size:12px;}
  .sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:rgba(255,255,255,.6);display:flex;align-items:center;gap:8px;}
  .user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--ai-cyan),var(--ai-green));color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;flex-shrink:0;}

  /* 主区 */
  .main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
  .top-bar{height:60px;background:linear-gradient(90deg,#0A3573,#0E4C92 60%,#13A8A8);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;color:#fff;}
  .top-bar-left{display:flex;align-items:center;gap:12px;}
  .top-bar-icon{width:36px;height:36px;background:rgba(255,255,255,.15);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;}
  .top-bar-title{font-size:17px;font-weight:600;}
  .top-bar-desc{font-size:12px;color:rgba(255,255,255,.7);margin-top:2px;}
  .top-bar-right{display:flex;align-items:center;gap:14px;}
  .view-switcher{display:inline-flex;background:rgba(255,255,255,.15);border-radius:6px;padding:3px;gap:2px;}
  .view-switcher-item{padding:6px 18px;font-size:13px;color:rgba(255,255,255,.8);cursor:pointer;border-radius:4px;transition:all .2s;user-select:none;}
  .view-switcher-item:hover{color:#fff;}
  .view-switcher-item.active{background:#fff;color:var(--ai-blue);font-weight:600;}
  .help-entry{display:inline-flex;align-items:center;gap:4px;color:#fff;cursor:pointer;font-size:13px;padding:6px 10px;border-radius:4px;transition:background .2s;}
  .help-entry:hover{background:rgba(255,255,255,.15);}

  .content-wrap{flex:1;display:flex;overflow:hidden;background:#fff;}

  /* 使用视图 */
  .use-view{display:flex;flex:1;min-width:0;overflow:hidden;}
  .operation-area{flex:1;display:flex;flex-direction:column;min-width:0;transition:all .4s ease;border-right:1px solid var(--border);background:#fff;}
  .operation-area.shrunk{flex:0 0 470px;}
  .form-container{flex:1;overflow-y:auto;padding:20px 28px;}
  .form-container::-webkit-scrollbar{width:6px;}.form-container::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

  .smart-input-box{background:linear-gradient(135deg,#e8f4fd 0%,#e8f8f8 100%);border:1px solid #b8dde0;border-radius:8px;padding:14px;margin-bottom:18px;}
  .smart-input-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .smart-input-title{font-size:13px;font-weight:600;color:var(--ai-blue);display:flex;align-items:center;gap:6px;}
  .smart-tag{display:inline-block;padding:1px 6px;background:linear-gradient(90deg,var(--ai-blue),var(--ai-cyan));color:#fff;font-size:10px;border-radius:3px;margin-left:4px;}
  .smart-input-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
  .smart-input-tip{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:4px;}
  .smart-input-example{color:var(--ai-blue);cursor:pointer;margin-left:4px;}
  .smart-input-example:hover{text-decoration:underline;}

  .form-section{margin-bottom:18px;}
  .form-row{display:flex;gap:14px;margin-bottom:14px;}
  .form-row:last-child{margin-bottom:0;}
  .form-item{flex:1;min-width:0;}
  .form-item.full{width:100%;}
  .form-label{font-size:13px;color:var(--text-2);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;}
  .form-label-left{display:flex;align-items:center;gap:4px;}
  .required::before{content:"*";color:#D9534F;margin-right:2px;}
  .label-action{font-size:12px;color:var(--ai-blue);cursor:pointer;display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:4px;background:#e8f0fc;transition:all .2s;}
  .label-action:hover{background:#d3e0f2;}
  .label-action.loading{opacity:.7;pointer-events:none;}

  .radio-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .radio-item{padding:6px 14px;border:1px solid var(--border);border-radius:6px;font-size:13px;color:var(--text-2);cursor:pointer;transition:all .2s;background:#fff;user-select:none;}
  .radio-item:hover{border-color:var(--ai-blue);color:var(--ai-blue);}
  .radio-item.selected{border-color:var(--ai-blue);background:var(--ai-blue);color:#fff;}
  .duration-custom{display:flex;align-items:center;gap:4px;}
  .duration-custom-input{width:60px;}
  .duration-custom-label{font-size:12px;color:var(--text-2);}

  .autocomplete-wrap{position:relative;}
  .autocomplete-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(14,76,146,.12);max-height:220px;overflow-y:auto;z-index:100;}
  .autocomplete-item{padding:8px 12px;cursor:pointer;transition:background .15s;border-bottom:1px solid #f4f7fb;}
  .autocomplete-item:last-child{border-bottom:none;}
  .autocomplete-item:hover{background:#f4f8fd;}
  .autocomplete-name{font-size:13px;color:var(--text);font-weight:500;}
  .autocomplete-name .match{color:var(--ai-blue);font-weight:700;}
  .autocomplete-title{font-size:11px;color:var(--text-3);margin-top:2px;}
  .autocomplete-empty{padding:12px;text-align:center;color:var(--text-3);font-size:12px;}

  .style-prompt-box{border:1px solid #b8dde0;background:#e8f8f8;border-radius:6px;padding:12px;margin-top:8px;}
  .style-prompt-header{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;color:var(--ai-cyan);font-weight:600;}
  .style-prompt-badge{display:inline-block;width:6px;height:6px;background:var(--ai-green);border-radius:50%;animation:dot-bounce 1.5s infinite;}
  .style-prompt-cards{display:flex;flex-direction:column;gap:6px;}
  .style-prompt-card{display:flex;align-items:flex-start;background:#fff;border:1px solid var(--border-2);border-radius:6px;padding:8px 10px;gap:8px;}
  .style-prompt-card-label{display:inline-block;padding:2px 8px;background:#e8f0fc;color:var(--ai-blue);border-radius:3px;font-size:11px;font-weight:600;flex-shrink:0;min-width:64px;text-align:center;}
  .style-prompt-card-content{flex:1;font-size:12px;color:var(--text-2);line-height:1.7;min-width:0;word-wrap:break-word;}
  .style-prompt-summary{margin-top:8px;font-size:11px;color:var(--text-3);}
  .style-prompt-empty{font-size:12px;color:var(--text-3);text-align:center;padding:16px 0;}
  .style-prompt-loading{text-align:center;padding:16px 0;color:var(--ai-blue);font-size:12px;}
  .style-prompt-note{margin-top:8px;font-size:11px;color:var(--text-3);line-height:1.6;}

  .upload-area{border:1px dashed var(--border);border-radius:6px;padding:16px;text-align:center;cursor:pointer;transition:all .2s;background:#fff;}
  .upload-area:hover{border-color:var(--ai-blue);background:#f4f8fd;}
  .upload-icon{font-size:24px;color:#b3c3dc;margin-bottom:4px;}
  .upload-text{font-size:12px;color:var(--text-3);}
  .upload-text strong{color:var(--ai-blue);}
  .upload-file-list{margin-top:8px;}
  .upload-file-item{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#f4f7fb;border-radius:4px;margin-bottom:4px;font-size:12px;}
  .file-remove{color:#D9534F;cursor:pointer;padding:2px 6px;}

  .action-bar{padding:14px 28px;border-top:1px solid var(--border-2);background:#fff;display:flex;gap:10px;justify-content:space-between;align-items:center;}
  .auto-save-indicator{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);}
  .auto-save-dot{width:8px;height:8px;border-radius:50%;background:var(--ai-green);}
  .auto-save-indicator.saving .auto-save-dot{background:#F0AD4E;animation:dot-bounce 1s infinite;}
  .auto-save-indicator.saving{color:#b7791f;}

  /* 预览区 */
  .preview-area{flex:1;display:none;flex-direction:column;min-width:0;background:var(--bg);position:relative;transition:all .4s ease;}
  .preview-area.show{display:flex;}
  .preview-area.collapsed{flex:0 0 40px;}
  .preview-area.collapsed .preview-header,.preview-area.collapsed .preview-body{display:none;}
  .preview-area.collapsed .preview-collapse-strip{display:flex;}
  .preview-collapse-strip{display:none;width:40px;height:100%;background:#fff;border-left:1px solid var(--border);flex-direction:column;align-items:center;padding-top:20px;cursor:pointer;}
  .preview-collapse-strip:hover{background:#f4f8fd;}
  .preview-collapse-strip-icon{color:var(--ai-blue);font-size:16px;margin-bottom:12px;}
  .preview-collapse-strip-text{writing-mode:vertical-rl;color:var(--ai-blue);font-size:12px;letter-spacing:4px;}
  .preview-toggle-btn{width:24px;height:24px;border-radius:4px;background:#fff;border:1px solid var(--border);color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;margin-right:4px;}
  .preview-toggle-btn:hover{border-color:var(--ai-blue);color:var(--ai-blue);}
  .preview-header{padding:14px 24px;background:#fff;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  .preview-title{font-size:15px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:10px;}
  .preview-stat{font-size:12px;color:var(--ai-blue);font-weight:600;padding:3px 10px;background:#e8f0fc;border-radius:12px;display:none;white-space:nowrap;}
  .preview-stat.show{display:inline-block;}
  .step-indicator{display:flex;align-items:center;gap:6px;font-size:12px;}
  .step-item{display:flex;align-items:center;gap:4px;color:var(--text-3);}
  .step-num{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--border);color:var(--text-3);font-size:11px;}
  .step-item.active{color:var(--ai-blue);font-weight:600;}
  .step-item.active .step-num{background:var(--ai-blue);color:#fff;}
  .step-item.done{color:var(--ai-green);}
  .step-item.done .step-num{background:var(--ai-green);color:#fff;}
  .step-arrow{color:#b3c3dc;font-size:12px;}
  .preview-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .preview-body{flex:1;overflow-y:auto;padding:24px;display:flex;justify-content:center;position:relative;}
  .preview-body::-webkit-scrollbar{width:6px;}.preview-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

  /* 提纲 */
  .outline-container{width:100%;max-width:820px;background:#fff;padding:40px 60px;box-shadow:0 2px 12px rgba(14,76,146,.06);border-radius:8px;height:fit-content;}
  .outline-header{border-bottom:2px solid var(--ai-blue);padding-bottom:12px;margin-bottom:20px;}
  .outline-title-main{font-size:18px;font-weight:600;color:var(--text);}
  .outline-title-sub{font-size:12px;color:var(--text-3);margin-top:4px;}
  .outline-meta{background:#f4f8fd;border-left:3px solid var(--ai-blue);padding:10px 14px;margin-bottom:20px;font-size:12px;color:var(--text-2);line-height:1.8;}
  .outline-meta strong{color:var(--ai-blue);}
  .outline-section{margin-bottom:16px;border:1px solid var(--border-2);border-radius:6px;background:#fff;}
  .outline-section-header{padding:10px 14px;background:#f4f8fd;border-bottom:1px solid var(--border-2);display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .outline-section-title-input{flex:1;border:none;background:transparent;font-size:14px;font-weight:600;color:var(--text);padding:4px 6px;border-radius:3px;font-family:inherit;}
  .outline-section-title-input:focus{outline:none;background:#fff;box-shadow:0 0 0 1px var(--ai-blue);}
  .outline-icon-btn{width:24px;height:24px;border:none;background:transparent;border-radius:3px;cursor:pointer;color:var(--text-3);font-size:14px;display:inline-flex;align-items:center;justify-content:center;}
  .outline-icon-btn:hover{background:rgba(14,76,146,.1);color:var(--ai-blue);}
  .outline-icon-btn.danger:hover{background:rgba(217,83,79,.1);color:#D9534F;}
  .outline-section-body{padding:12px 14px;}
  .outline-point-item{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px;}
  .outline-point-bullet{width:18px;height:18px;background:var(--ai-blue);color:#fff;border-radius:50%;font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:4px;}
  .outline-point-input{flex:1;border:1px solid transparent;background:transparent;font-size:13px;color:var(--text);padding:4px 6px;border-radius:3px;font-family:inherit;line-height:1.6;min-height:26px;resize:none;overflow:hidden;}
  .outline-point-input:focus{outline:none;border-color:var(--ai-blue);background:#fff;}
  .outline-point-remove{color:#b3c3dc;cursor:pointer;padding:4px;font-size:14px;margin-top:2px;}
  .outline-point-remove:hover{color:#D9534F;}
  .outline-add-point{font-size:12px;color:var(--ai-blue);cursor:pointer;display:inline-flex;align-items:center;gap:3px;padding:4px 8px;border-radius:3px;}
  .outline-add-point:hover{background:rgba(14,76,146,.08);}
  .outline-guide{margin-top:8px;padding:8px 10px;background:#f4f8fd;border-radius:3px;font-size:12px;color:var(--text-2);line-height:1.6;}
  .outline-guide-label{color:var(--ai-blue);font-weight:600;margin-right:4px;}
  .outline-add-section{text-align:center;padding:12px;border:1px dashed var(--border);border-radius:6px;color:var(--text-3);cursor:pointer;font-size:13px;transition:all .2s;}
  .outline-add-section:hover{border-color:var(--ai-blue);color:var(--ai-blue);background:#f4f8fd;}
  .outline-footer-bar{position:sticky;bottom:0;margin-top:16px;padding:12px 16px;background:#fff;border:1px solid var(--border-2);border-radius:6px;box-shadow:0 -2px 8px rgba(0,0,0,.04);display:flex;justify-content:space-between;align-items:center;}
  .outline-footer-tip{font-size:12px;color:var(--text-3);}

  /* 发言稿文档 */
  .preview-doc{width:100%;max-width:820px;background:#fff;padding:60px 80px;box-shadow:0 2px 12px rgba(14,76,146,.06);min-height:calc(100vh - 200px);font-family:"SimSun","宋体",serif;color:#000;height:fit-content;border-radius:8px;}
  .preview-doc h1.doc-title{text-align:center;font-family:"SimHei","黑体",sans-serif;font-size:22pt;font-weight:700;margin-bottom:30px;line-height:1.4;}
  .preview-doc h2.doc-subtitle{text-align:center;font-size:16pt;font-weight:normal;margin-bottom:40px;color:#333;}
  .preview-doc .doc-meta{text-align:right;font-size:12pt;color:#333;margin-bottom:24px;}
  .preview-doc h3.doc-section{font-family:"SimHei","黑体",sans-serif;font-size:16pt;font-weight:700;margin:24px 0 16px;}
  .preview-doc p{font-size:14pt;line-height:2;text-indent:2em;margin-bottom:12px;}
  .preview-doc .policy-ref{color:#c62828;font-weight:500;text-decoration:underline;text-decoration-color:#c62828;text-decoration-style:dotted;cursor:pointer;position:relative;}

      else if(historyFilter.timePreset==='custom'){startStr=historyFilter.dateStart||null;endStr=historyFilter.dateEnd||null;if(startStr&&endStr&&startStr>endStr){const t=startStr;startStr=endStr;endStr=t;}}

        return kwMatch&&dateMatch;
      });
    });

    function smartParse(text){
      const r={filledCount:0,audienceList:[]};
      const tm=text.match(/(?:关于|在|为|开|做|写)([^的，,。的]{4,30}?)(?:上的|的讲话|的发言|讲话稿|发言稿|大会|会议|专题)/);
      if(tm){r.theme=tm[1].trim()+(text.indexOf('大会')>-1?'大会讲话':(text.indexOf('会议')>-1?'会议讲话':'讲话'));r.filledCount++;}
      else if(text.indexOf('数字经济')>-1){r.theme='全市数字经济发展大会讲话';r.filledCount++;}
      for(let i=0;i<SPEAKER_DB.length;i++){if(text.indexOf(SPEAKER_DB[i].name)>-1){r.speakerName=SPEAKER_DB[i].name;r.speakerTitle=SPEAKER_DB[i].title;r.filledCount+=2;break;}}
      if(/汇报|专题/.test(text)){r.occasion='向上汇报';r.filledCount++;}else if(/动员|部署|推进/.test(text)){r.occasion='内部动员';r.filledCount++;}else if(/宣传|发布/.test(text)){r.occasion='对外宣传';r.filledCount++;}else if(/调研|座谈/.test(text)){r.occasion='调研交流';r.filledCount++;}else if(/致辞|开幕|大会/.test(text)){r.occasion='活动致辞';r.filledCount++;}else if(/表彰|颁奖/.test(text)){r.occasion='表彰讲话';r.filledCount++;}
      if(/上级|领导审议/.test(text))r.audienceList.push('上级领导');
      if(/干部|党政/.test(text))r.audienceList.push('党政干部');
      if(/企业|企业家|商家/.test(text))r.audienceList.push('企业代表');
      if(/群众|市民/.test(text))r.audienceList.push('群众代表');
      if(/媒体|记者/.test(text))r.audienceList.push('媒体记者');
      if(/基层/.test(text))r.audienceList.push('基层工作人员');
      if(r.audienceList.length)r.filledCount++;
      if(/30分钟|半小时|长|6000|8000/.test(text)){r.duration='long';r.filledCount++;}else if(/20分钟|4000/.test(text)){r.duration='medium';r.filledCount++;}else if(/10分钟|简短|短|2000/.test(text)){r.duration='short';r.filledCount++;}
      const pm=text.match(/(?:重点|主要|包含|包括|讲|说)([^。]*)/);
      if(pm){const raw=pm[1].replace(/^讲/,'').replace(/^说/,'').trim();const pts=raw.split(/[、,，和以及]/).filter(function(p){return p.trim().length>=2;});if(pts.length>=2){r.keyPoints=pts.map(function(p,i){return (i+1)+'、'+p.trim();}).join('；\n');r.filledCount++;}}
      return r;
    }

      const t={'向上汇报':[{key:'成效',text:'总结阶段性工作成效，突出重点亮点'},{key:'形势',text:'分析当前面临的形势与主要问题'},{key:'思路',text:'汇报下阶段工作思路与重点举措'},{key:'请示',text:'请示领导关注支持的具体事项'}],'内部动员':[{key:'认识',text:'深刻认识本次工作的重大意义'},{key:'任务',text:'明确重点任务与时间节点要求'},{key:'责任',text:'压实各方责任，形成推进合力'},{key:'督查',text:'强化督查考核，确保落地见效'}],'对外宣传':[{key:'介绍',text:'介绍本地区/领域发展基本情况'},{key:'成果',text:'展示重点成果与特色亮点'},{key:'政策',text:'发布最新政策与开放合作机遇'},{key:'合作',text:'诚邀各方共谋发展、共创未来'}],'调研交流':[{key:'了解',text:'了解基层实际情况和一线声音'},{key:'梳理',text:'听取意见建议，梳理突出问题'},{key:'研究',text:'共同研究破解难题的思路办法'},{key:'推进',text:'明确下步推进方向与协作机制'}],'活动致辞':[{key:'欢迎',text:'代表主办方向来宾表示热烈欢迎'},{key:'意义',text:'介绍本次活动的背景与重要意义'},{key:'展望',text:'展望合作前景，寄语与会各方'},{key:'祝愿',text:'预祝活动圆满成功'}],'表彰讲话':[{key:'肯定',text:'宣读表彰决定，充分肯定先进事迹'},{key:'经验',text:'总结先进典型的经验与精神内涵'},{key:'号召',text:'号召全体人员向先进学习'},{key:'部署',text:'部署下阶段争先创优工作'}]}[formData.occasion]||[];
      const lines=formData.keyPoints.trim()?formData.keyPoints.trim().split(/\n+/).map(function(l){return l.replace(/^[\d一二三四五六七八九十]+[、.．)]\s*/,'').replace(/[；;。]$/,'').trim();}).filter(function(l){return l.length>0;}):[];
      function exists(sug){for(let i=0;i<lines.length;i++){if(lines[i].indexOf(sug.key)>-1||lines[i].indexOf(sug.text.substring(0,3))>-1)return true;}return false;}
      const merged=lines.slice();

    function runGeneratingSteps(type){
      const steps=type==='outline'?[
        '解析发言要素并结构化','检索政务政策知识库','匹配讲话人语料风格特征','自适应规划结构框架','输出详细提纲'
      ]:[

      ];
      generatingSteps.value=steps.map(function(s,i){return {label:s,state:i===0?'active':'pending'};});
      let i=0;
      function next(){
        if(i<steps.length){
          if(i>0){generatingSteps.value[i-1].state='done';}
          generatingSteps.value[i].state='active';
          i++;setTimeout(next,600);
        } else {
          generatingSteps.value[steps.length-1].state='done';
          setTimeout(function(){if(type==='outline')renderOutline(false);else renderSpeechResult();},400);
        }
      }
      next();
    }

      const rec=getRecord(currentHistoryId.value);if(!rec)return;

      if(rec.formData.theme)rec.title=rec.formData.theme;
      if(rec.formData.occasion)rec.occasion=rec.formData.occasion;
      if(updates){
        if(updates.outlineData!==undefined)rec.outlineData=updates.outlineData;
        if(updates.speechHtml!==undefined)rec.speechHtml=updates.speechHtml;
        if(updates.step!==undefined)rec.step=updates.step;
        if(updates.status!==undefined)rec.status=updates.status;
        if(updates.policyList!==undefined)rec.policyList=updates.policyList;
      }
    }
    function markAutoSave(){
      autoSaveText.value='保存中…';autoSaveSaving.value=true;
      clearTimeout(autoSaveTimer);
      autoSaveTimer=setTimeout(function(){persistRecord();autoSaveText.value='已自动保存';autoSaveSaving.value=false;},700);
    }

    /* ========== 配置 ========== */
    function onRoleChange(){/* 触发 configEditable 重算 */}
    function switchScope(s){configState.scope=s;}
    function switchCategory(c){configState.category=c;}
    function toggleConfigItem(cat,idx,val){
      const item=CONFIG_DATA[cat][configState.scope][idx];item.enabled=val;
      showToast((val?'已启用':'已停用')+'：'+(item.name||item.title),'success');
    }
    function editConfigItem(cat,idx){showToast('编辑功能演示：'+CONFIG_DATA[cat][configState.scope][idx].name,'info');}
    function deleteConfigItem(cat,idx){
      const item=CONFIG_DATA[cat][configState.scope][idx];
      openConfirm({title:'删除',content:'确定要删除「'+esc(item.name)+'」吗？',okText:'确定删除',okType:'error',onOk:function(){CONFIG_DATA[cat][configState.scope].splice(idx,1);showToast('已删除','success');}});
    }
    function addConfigItem(){
      if(!configEditable.value){showToast('当前作用域不可编辑','error');return;}
      showToast('新增功能演示（研发接入编辑弹窗）','info');
    }
    function privateNoticeHtml(){
      const cat=configState.category;
      if(cat==='field')return '您自定义的字段值仅保存于本人账户，不会进入部门或全局共用池。';
      if(cat==='template')return '您上传或创建的私有模板，仅本人在生成发言稿时可选用，不与同部门或其他用户共享。';
      if(cat==='knowledge')return '<ul><li>您上传的参考资料（DOCX/PDF/TXT），解析学习后形成的知识片段仅本人可用；</li><li>输入特定讲话人后提取的"风格提示词"默认本次会话私有，可另存为部门/全局风格档案以共享；</li><li>个人语料不用于训练共享模型，不泄露给其他用户。</li></ul>';
      if(cat==='rule')return '您个人偏好规则仅影响您本人生成的发言稿，不影响部门或全局生成结果。';
      return '';
    }
    function getCatTitle(c){return {field:'字段配置',template:'模板配置',knowledge:'知识配置',rule:'规则配置'}[c];}
    function getCatSub(c){
      const sn={global:'全局通用',dept:'我的部门',private:'我的私有'}[configState.scope];
      const sub={field:'管理发言稿生成时收集的要素字段',template:'管理发言稿结构模板',knowledge:'管理政策法规、权威表述等知识资源',rule:'管理场景语气、措辞约束等生成规则'}[c];
      return '作用域：'+sn+' · '+sub;
    }

    /* ========== Toast ========== */
    const toastData=reactive({show:false,msg:'',type:'info'});
    let toastTimer=null;
    function showToast(msg,type){toastData.msg=msg;toastData.type=type||'info';toastData.show=true;clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastData.show=false;},2500);}

    /* ========== 初始化 ========== */
    onMounted(function(){
      initHistoryData();
      currentHistoryId.value='h1';
      loadHistory('h1');
    });

    return {
      themeOverrides, viewMode, switchView, sidebarCollapsed, toggleSidebar,
      previewShown, previewCollapsed, togglePreviewCollapse, currentStep,
      formData, errors, clearErrors, validateForm, durationText,
      OCCASION_OPTIONS, AUDIENCE_OPTIONS, DURATION_PRESETS,
      styleData, styleLoading, speakerDropdownShow, speakerMatches,
      onSpeakerInput, onSpeakerFocus, hideSpeakerDropdown, selectSpeaker,
      supplementKeyPoints, smartInput, fillExample, clearSmartInput, parseSmartInput,
      fileList, triggerUpload, handleUpload, removeFile, formatFileSize,
      generateOutline, previewMode, generatingSteps,
      outlineData, policyList, speechHtml, speechEdited, inEditMode, editSnapshot,
      renderOutline, updateOutlineTitle, updateOutlinePoint, addOutlinePoint, removeOutlinePoint,
      moveSection, removeSection, addOutlineSection, regenerateOutline, confirmOutlineAndGenerate,
      renderSpeechResult, enterEditMode, cancelEditMode, saveEditMode, editReadOnlyHtml, editEditableHtml,
      togglePolicyPanel, policyPanelShow, policyDetailShow, policyDetailItem, showPolicyDetail, onPreviewClick,
      backToForm, backToOutline, printSpeech, exportFile,
      historyFilter, showDateRange, onHistoryTimePresetChange, filteredHistory, STATUS_MAP,
      loadHistory, newDraft, currentHistoryId,
      autoSaveText, autoSaveSaving, markAutoSave,
      configState, configEditable, onRoleChange, switchScope, switchCategory, SCOPE_TIPS, scopeTip,
      configList, CONFIG_DATA, toggleConfigItem, editConfigItem, deleteConfigItem, addConfigItem,
      privateNoticeHtml, getCatTitle, getCatSub,
      helpShow, confirmModal, doConfirm,
      toastData,
      wordCount
    };
  },
  template: `
  <n-config-provider :theme-overrides="themeOverrides">
    <div class="app-container">
      <!-- 侧边栏 -->
      <aside class="sidebar" :class="{collapsed:sidebarCollapsed}">
        <div class="sidebar-collapsed-logo"><span class="logo-icon">发</span></div>
        <div class="sidebar-toggle" @click="toggleSidebar"><span>{{ sidebarCollapsed ? '›' : '‹' }}</span></div>
        <div class="sidebar-header">
          <div class="sidebar-logo"><span class="logo-icon">发</span><span>发言稿智能体</span></div>
          <n-button block type="primary" @click="newDraft">
            <template #icon><span class="icon">＋</span></template>新建发言稿
          </n-button>
        </div>
        <div class="sidebar-section-title">历史生成记录</div>
        <div class="history-filter">
          <n-input v-model:value="historyFilter.keyword" placeholder="搜索关键词..." size="small" clearable>
            <template #prefix><span style="font-size:12px;color:#909aad">🔍</span></template>
          </n-input>
          <n-select v-model:value="historyFilter.timePreset" size="small" :options="[{label:'全部时间',value:'all'},{label:'今天',value:'today'},{label:'近7天',value:'7d'},{label:'近30天',value:'30d'},{label:'自定义',value:'custom'}]" @update:value="onHistoryTimePresetChange" />

            <div class="history-item-time">{{ rec.timeDisplay }}</div>

          <div class="user-info"><div style="color:#fff;font-size:13px;">张秘书</div><div style="font-size:11px;">江北新区教育局</div></div>

            <span class="top-bar-icon">📝</span>

          <div v-if="viewMode==='use'" class="use-view" style="flex:1;display:flex;min-width:0;overflow:hidden;">
            <section class="operation-area" :class="{shrunk:previewShown && !previewCollapsed}">
              <div class="form-container">
                <!-- 一句话生成 -->
                <div class="smart-input-box">

                    <div class="smart-input-title"><span>✦</span><span>一句话生成</span><span class="smart-tag">AI 解析</span></div>

                  </div>
                  <n-input v-model:value="smartInput" type="textarea" :autosize="{minRows:2,maxRows:5}" placeholder="示例：帮我写一份市长李强在明天全市数字经济发展大会上的讲话稿，面向企业代表和党政干部，时长约20分钟，重点讲上半年成绩、下阶段部署和政策支持。" />
                  <div class="smart-input-actions">
                    <div class="smart-input-tip"><span>💡 用自然语言描述需求，系统自动解析并填充下方表单</span><span class="smart-input-example" @click="fillExample">试用示例</span></div>
                    <n-button size="small" type="primary" @click="parseSmartInput"><span>✨</span>&nbsp;智能解析并填单</n-button>
                  </div>
                </div>

                <!-- 基本要素 -->
                <n-card class="form-section" :bordered="false" size="small">
                  <template #header><span style="font-size:14px;font-weight:600;color:#333639">基本要素</span></template>
                  <div class="form-row">
                    <div class="form-item full">
                      <div class="form-label"><span class="form-label-left"><span class="required">讲话主题</span></span></div>

                  </div>
                  <div class="form-row">
                    <div class="form-item">
                      <div class="form-label"><span class="form-label-left"><span class="required">会议场合</span></span></div>

                    <div class="form-item">
                      <div class="form-label"><span class="form-label-left"><span class="required">听众类型</span><span style="font-size:12px;color:#a0aac0">(支持多选)</span></span></div>
                      <n-select v-model:value="formData.audience" multiple :options="AUDIENCE_OPTIONS.map(function(a){return {label:a,value:a}})" placeholder="请选择听众" :status="errors.audience?'error':undefined" @update:value="markAutoSave" />
                    </div>
                  </div>
                  <div class="form-row">
                    <div class="form-item full">

                          <span>自定义</span>
                          <n-input v-model:value="formData.customMinute" class="duration-custom-input" size="tiny" placeholder="分钟" @update:value="function(v){if(v){formData.duration='custom';}markAutoSave();}" @click.stop />
                          <span class="duration-custom-label">分钟</span>
                        </span>
                      </div>
                    </div>
                  </div>
                  <div class="form-row">
                    <div class="form-item full">
                      <div class="form-label">
                        <span class="form-label-left">核心内容要点<span style="font-size:12px;color:#a0aac0">(可选)</span></span>
                        <span class="label-action" @click="supplementKeyPoints"><span>✦</span><span>一键补充</span></span>
                      </div>
                      <n-input v-model:value="formData.keyPoints" type="textarea" :autosize="{minRows:3}" placeholder="示例：1、总结上半年工作成效；2、分析当前面临的形势任务；3、部署下阶段重点工作..." @update:value="markAutoSave" />
                      <div style="font-size:11px;color:#909aad;margin-top:4px;">💡 一键补充会智能融合已填要点，避免重复堆砌</div>
                    </div>
                  </div>
                </n-card>

                <!-- 讲话人风格 -->
                <n-card class="form-section" :bordered="false" size="small">
                  <template #header><span style="font-size:14px;font-weight:600;color:#333639">讲话人风格</span></template>
                  <div class="form-row">
                    <div class="form-item">
                      <div class="form-label"><span class="form-label-left">讲话人姓名<span style="font-size:12px;color:#a0aac0">(可选)</span></span></div>
                      <div class="autocomplete-wrap">
                        <n-input v-model:value="formData.speakerName" placeholder="输入姓名可从库中匹配" @update:value="function(){onSpeakerInput();markAutoSave();}" @focus="onSpeakerFocus" @blur="hideSpeakerDropdown" />
                        <div class="autocomplete-dropdown" v-show="speakerDropdownShow">
                          <div v-if="!speakerMatches.length" class="autocomplete-empty">未匹配到讲话人，可继续输入自定义姓名</div>
                          <div v-for="s in speakerMatches" :key="s.name" class="autocomplete-item" @mousedown="selectSpeaker(s)">
                            <div class="autocomplete-name">{{ s.name }}</div>

                    <n-button size="small" @click="printSpeech">🖨 打印</n-button>
                  </template>
                  <template v-else-if="previewMode==='edit'">
                    <n-button size="small" @click="cancelEditMode">✕ 取消</n-button>

              </div>

                  </div>
                </div>

                <div v-else-if="previewMode==='outline'" class="outline-container">

                  <div class="outline-meta">

                        <div style="display:flex;gap:4px;">
                          <button class="outline-icon-btn" @click="moveSection(idx,-1)" title="上移">↑</button>
                          <button class="outline-icon-btn" @click="moveSection(idx,1)" title="下移">↓</button>
                          <button class="outline-icon-btn danger" @click="removeSection(idx)" title="删除">×</button>
                        </div>
                      </div>
                      <div class="outline-section-body">
                        <div v-for="(p,pi) in sec.points" :key="pi" class="outline-point-item">
                          <span class="outline-point-bullet">{{ pi+1 }}</span>
                          <textarea class="outline-point-input" :value="p" @input="updateOutlinePoint(idx,pi,$event)"></textarea>
                          <span class="outline-point-remove" @click="removeOutlinePoint(idx,pi)">×</span>
                        </div>
                        <span class="outline-add-point" @click="addOutlinePoint(idx)">+ 添加要点</span>
                        <div class="outline-guide"><span class="outline-guide-label">写作指引：</span>{{ sec.guide }}</div>
                      </div>
                    </div>
                  </div>
                  <div class="outline-add-section" @click="addOutlineSection">+ 添加新章节</div>
                  <div class="outline-footer-bar">
                    <div class="outline-footer-tip">💡 可修改标题、增删要点、调整章节顺序，确认后生成发言稿正文</div>
                    <div style="display:flex;gap:8px;">
                      <n-button size="small" @click="regenerateOutline">重新生成</n-button>
                      <n-button size="small" type="primary" @click="confirmOutlineAndGenerate">✦ 确认提纲，生成发言稿</n-button>
                    </div>
                  </div>
                </div>
                <!-- 发言稿正文 -->
                <div v-else-if="previewMode==='speech'" v-html="speechHtml"></div>
                <!-- 编辑模式 -->
                <div v-else-if="previewMode==='edit'" class="edit-split">
                  <div class="edit-pane">
                    <div class="edit-pane-header"><span class="edit-pane-tag ro">编辑前（原文）</span><span class="edit-pane-hint">只读</span></div>
                    <div class="edit-pane-body" v-html="editReadOnlyHtml"></div>
                  </div>
                  <div class="edit-pane">
                    <div class="edit-pane-header"><span class="edit-pane-tag ed">编辑后</span><span class="edit-pane-hint">可编辑</span></div>
                    <div class="edit-pane-body edit-doc-editable" id="editDocAfter" contenteditable="true" v-html="editEditableHtml"></div>
                  </div>
                </div>
              </div>
            </section>
          </div>

        </div>
      </main>
    </div>

    <!-- 使用说明 -->
    <n-modal v-model:show="helpShow" preset="card" title="使用说明" style="width:680px;max-width:90vw">
      <div style="font-size:13px;color:#5a6b85;line-height:1.9">
        <div style="font-weight:600;color:#0E4C92;margin:8px 0;border-left:3px solid #0E4C92;padding-left:8px">📘 使用流程</div>
        <div style="background:#f4f8fd;border-radius:4px;padding:8px 12px;margin-bottom:6px"><strong>1. 填写基本要素：</strong>输入讲话主题、选择会议场合和听众类型（可多选）、设置时长，其余字段可选。也可使用"一句话生成"自动解析回填。</div>
        <div style="background:#f4f8fd;border-radius:4px;padding:8px 12px;margin-bottom:6px"><strong>2. 选择讲话人：</strong>输入姓名从库中自动匹配并带出职务、分析历史文风。风格提示词只读，仅语料更新时变化。</div>
        <div style="background:#f4f8fd;border-radius:4px;padding:8px 12px;margin-bottom:6px"><strong>3. 确认提纲：</strong>先生成详细提纲，支持修改标题、增删要点、调整顺序，满意后再生成正式发言稿。</div>
        <div style="background:#f4f8fd;border-radius:4px;padding:8px 12px;margin-bottom:6px"><strong>4. 预览与输出：</strong>严格党政公文排版，可预览、编辑（前后对比）、导出 DOCX/PDF、打印。政策依据可点击查看原文。</div>
        <div style="font-weight:600;color:#0E4C92;margin:12px 0 8px;border-left:3px solid #0E4C92;padding-left:8px">💡 常用技巧</div>
        <div style="background:#f4f8fd;border-radius:4px;padding:8px 12px;margin-bottom:6px"><strong>自动保存：</strong>系统自动保存，再次打开历史记录恢复上次最终状态。</div>
        <div style="background:#f4f8fd;border-radius:4px;padding:8px 12px;margin-bottom:6px"><strong>历史筛选：</strong>按关键词与时间筛选，每条记录显示状态徽标。</div>
        <div style="background:#f4f8fd;border-radius:4px;padding:8px 12px;margin-bottom:6px"><strong>发言稿编辑：</strong>点击"编辑"进入编辑前/编辑后对比视图。</div>
        <div style="background:#f4f8fd;border-radius:4px;padding:8px 12px;margin-bottom:6px"><strong>政策依据溯源：</strong>红色下划线短语点击查看原文详情。</div>
        <div style="font-weight:600;color:#0E4C92;margin:12px 0 8px;border-left:3px solid #0E4C92;padding-left:8px">⚙️ 配置功能</div>
        <div style="background:#f4f8fd;border-radius:4px;padding:8px 12px;margin-bottom:6px"><strong>三层作用域：</strong>全局通用（系统管理员）→ 我的部门（同委办局共用）→ 我的私有（仅本人）。</div>
        <div style="background:#f4f8fd;border-radius:4px;padding:8px 12px"><strong>私有隔离：</strong>上传参考资料、风格语料默认仅本人可用，不进入共享池。</div>
      </div>
    </n-modal>

    <!-- 通用确认弹窗 -->
    <n-modal v-model:show="confirmModal.show" preset="card" :title="confirmModal.title" style="width:440px;max-width:90vw">
      <div style="text-align:center;font-size:14px;color:#5a6b85;line-height:1.8" v-html="confirmModal.content"></div>
      <template #footer>
        <div style="display:flex;justify-content:flex-end;gap:8px;">
          <n-button @click="confirmModal.show=false">取消</n-button>
          <n-button :type="confirmModal.okType" @click="doConfirm">{{ confirmModal.okText }}</n-button>
        </div>
      </template>
    </n-modal>

    <!-- 政策详情 -->
    <n-modal v-model:show="policyDetailShow" preset="card" title="政策依据详情" style="width:640px;max-width:90vw">
      <div v-if="policyDetailItem" class="policy-detail">
        <div class="policy-detail-title-main">{{ policyDetailItem.fullTitle }}</div>
        <div class="policy-detail-row"><span class="policy-detail-label">引用表述</span><span class="policy-detail-val">{{ policyDetailItem.text }}</span></div>
        <div class="policy-detail-row"><span class="policy-detail-label">政策类型</span><span class="policy-detail-val">{{ policyDetailItem.type }}</span></div>
        <div class="policy-detail-row"><span class="policy-detail-label">出处来源</span><span class="policy-detail-val">{{ policyDetailItem.source }}</span></div>
        <div v-if="policyDetailItem.docNo" class="policy-detail-row"><span class="policy-detail-label">文号/标识</span><span class="policy-detail-val">{{ policyDetailItem.docNo }}</span></div>
        <div style="margin-top:12px;color:#909aad;font-size:12px">原文摘录（仅供参考引用）：</div>
        <div class="policy-detail-excerpt">{{ policyDetailItem.excerpt }}</div>
        <div class="policy-detail-tip">🔒 原文仅供内部学习参考，正式引用请以官方公布文本为准</div>
      </div>
    </n-modal>

    <!-- Toast -->
    <transition name="fade">
      <div v-if="toastData.show" :style="{position:'fixed',top:'32px',left:'50%',transform:'translateX(-50%)',background:toastData.type==='success'?'#43A047':(toastData.type==='error'?'#D9534F':'#0E4C92'),color:'#fff',padding:'10px 20px',borderRadius:'4px',fontSize:'13px',zIndex:3000,boxShadow:'0 4px 12px rgba(0,0,0,.15)'}">{{ toastData.msg }}</div>
    </transition>
  </n-config-provider>
  `
});
app.use(naive);
app.mount('#app');
</script>
<script src="handoff-context.js"></script>
</body>
</html>
