<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>函件智能生成 · 政务AI智能体 - 江北新区政务AI智能中台</title>
  <style>
    :root {
      --bg:#F4F6F9; --panel:#ffffff; --line:#e2e8f3; --line-soft:#eef1f7;
      --text:#333639; --muted:#75809a;
      --ai-navy:#0A3573; --ai-blue:#0E4C92; --ai-cyan:#13A8A8; --ai-green:#43A047;
      --ai-glow:0 0 16px rgba(19,168,168,.35);
      --primary:#0E4C92; --primary-dark:#0A3573; --primary-soft:#e8f1fa;
      --cyan:#13A8A8; --cyan-soft:#e2f4f4;
      --green:#43A047; --green-soft:#e8f7f1;
      --red:#D9534F; --red-soft:#fdecea; --orange:#F0AD4E;
      --orange-soft:#fff4e0; --purple:#6a52d6; --purple-soft:#efecfd;
      --shadow:0 16px 42px rgba(10,53,115,.10); --shadow-sm:0 8px 20px rgba(10,53,115,.06);
    }
    *{box-sizing:border-box}
    body{margin:0;min-width:1280px;height:100vh;overflow:hidden;color:var(--text);
      background:radial-gradient(circle at 78% -4%,rgba(19,168,168,.12),transparent 30%),radial-gradient(circle at 12% 100%,rgba(14,76,146,.08),transparent 35%),linear-gradient(180deg,#fbfcff,var(--bg));
      font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;}
    button,input,textarea,select{font:inherit} button{border:0;background:none;color:inherit;cursor:pointer} a{color:inherit;text-decoration:none}
    .app{display:grid;grid-template-columns: 300px 1fr;grid-template-rows:58px 1fr;height:100vh}
    .topbar{grid-column:1 / -1;grid-row:1}
    /* Sidebar 草稿列表侧边栏（移植自 decision） */
    .sidebar{grid-column:1;grid-row:2;min-height:0;display:flex;flex-direction:column;background:#fafbfc;border-right:1px solid var(--line)}
    .sidebar-header{padding:18px 16px 14px;background:linear-gradient(90deg,#0A3573,#0E4C92 60%,#13A8A8);box-shadow:0 4px 20px rgba(10,53,115,.18)}
    .logo{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .logo-icon{width:32px;height:32px;background:linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.3);box-shadow:var(--ai-glow);color:#fff;display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:800;font-size:15px;flex-shrink:0}
    .logo-text{font-size:15px;font-weight:700;color:#fff;white-space:nowrap}
    .btn-new{width:100%;padding:9px 12px;background:var(--primary);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s;white-space:nowrap}
    .btn-new:hover{background:var(--primary-dark)}
    .filter-box{padding:12px 16px;border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:8px}
    .search-wrap{position:relative}
    .search-input{width:100%;padding:7px 12px 7px 30px;border:1px solid var(--line);border-radius:6px;font-size:13px;color:#28324c;background:#fff;transition:border-color .2s}
    .search-input:focus{outline:none;border-color:var(--primary)}
    .search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
    .search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--muted);cursor:pointer;font-size:14px}
    .search-clear:hover{color:var(--red)}
    .time-filter-row{display:flex;gap:4px;flex-wrap:wrap}
    .time-chip{padding:3px 9px;font-size:12px;color:#47536c;background:#fff;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
    .time-chip:hover{border-color:var(--primary);color:var(--primary)}
    .time-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .sidebar-section-title{padding:12px 16px 6px;font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:space-between}
    .record-count{font-size:11px;color:var(--muted);font-weight:500}
    .history-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 8px 16px}
    .history-item{padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px;transition:.25s ease;position:relative}
    .history-item:hover{background:#eef2f7;transform:translateX(2px)}
    .history-item.active{background:linear-gradient(135deg,var(--ai-blue),var(--ai-cyan));box-shadow:0 8px 20px rgba(14,76,146,.25),var(--ai-glow)}
    .history-item.active .history-title{color:#fff}
    .history-item.active .history-tag,.history-item.active .history-step,.history-item.active .history-time{color:rgba(255,255,255,.85)}
    .history-title{font-size:13px;color:#28324c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
    .history-meta{font-size:11px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .history-tag{display:inline-block;padding:1px 6px;background:#f0f2f5;border-radius:3px;font-size:11px;color:#47536c}
    .history-status{display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px;font-weight:700}
    .history-status.s-draft{background:#fff7e6;color:#d48806}
    .history-status.s-submitted{background:#e6f4ff;color:#0958d9}
    .history-status.s-review{background:#fff2e8;color:#d46b08}
    .history-status.s-exported{background:#f6ffed;color:#2e7d32}
    .history-step{display:inline-block;padding:1px 5px;background:#f0f2f5;border-radius:3px;font-size:10px;color:#909399}
    .history-time{font-size:11px;color:var(--muted);margin-left:auto}
    .sidebar-footer{padding:12px 16px;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:10px}
    .user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--ai-blue),var(--ai-cyan));color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
    .user-info{flex:1;overflow:hidden}
    .user-info .user-name{font-size:13px;font-weight:700;color:#28324c}
    .user-info .user-dept{font-size:11px;color:var(--muted)}
    /* Top bar */
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 20px;background:linear-gradient(90deg,#0A3573,#0E4C92 60%,#13A8A8);border-bottom:none;box-shadow:0 4px 20px rgba(10,53,115,.18);backdrop-filter:blur(12px);z-index:5}
    .brand{display:flex;align-items:center;gap:11px;font-weight:800;color:#fff;white-space:nowrap}
    .brand-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:#fff;flex:none;background:linear-gradient(135deg,var(--ai-blue),var(--ai-cyan));box-shadow:var(--ai-glow),0 8px 18px rgba(14,76,146,.28)}
    .brand-mark .ic-svg{width:58%;height:58%;stroke:#fff;fill:none;stroke-width:2}
    .brand small{display:block;font-size:11px;font-weight:600;color:rgba(255,255,255,.7);margin-top:1px}
    .top-actions{display:flex;align-items:center;gap:8px}
    .topbar .icon-btn{color:#fff;background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.22)}
    .topbar .icon-btn:hover{background:rgba(255,255,255,.28);color:#fff;border-color:rgba(255,255,255,.4)}
    .topbar .safe-mode{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.28)}
    .safe-mode{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:9px;background:var(--green-soft);color:var(--green);font-size:13px;font-weight:700}
    /* Controls */
    .btn,.icon-btn,.primary-btn,.danger-btn,.ghost-btn{height:34px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;border:1px solid var(--line);background:#fff;color:#3a4761;transition:.25s ease;white-space:nowrap;font-weight:600}
    .btn{padding:0 12px}.icon-btn{width:34px}
    .primary-btn{padding:0 15px;border-color:transparent;color:#fff;background:linear-gradient(135deg,var(--ai-blue),var(--primary-hover));box-shadow:0 8px 16px rgba(14,76,146,.2)}
    .ghost-btn{padding:0 12px;background:#f6f8fd}
    .danger-btn{padding:0 12px;border-color:#f6ccc7;color:var(--red);background:#fff7f6}
    .btn:hover,.icon-btn:hover,.ghost-btn:hover{color:var(--primary);border-color:rgba(14,76,146,.4);background:var(--primary-soft)}
    .primary-btn:hover{background:var(--primary-dark);box-shadow:0 8px 20px rgba(14,76,146,.3),var(--ai-glow)}
    .danger-btn:hover{background:#fdece9}
    .btn.sm,.mini-btn{height:30px;padding:0 10px;font-size:13px}
    .mini-btn{border:1px solid var(--line);border-radius:8px;background:#fff;color:#4a5568}
    .mini-btn:hover{color:var(--primary);border-color:rgba(14,76,146,.36);background:var(--primary-soft)}
    .select{height:34px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#3c4658;padding:0 10px;outline:none}
    .select:focus{border-color:rgba(14,76,146,.5)}
    /* Views */
    .view{display:none;min-height:0;height:100%;grid-column:2;grid-row:2;overflow:hidden}
    .view.active{display:flex;flex-direction:column;overflow:hidden}
    #view-gen.active{display:grid;grid-template-rows:auto 1fr}
    #stageRoot{min-height:0;overflow:hidden}
    .stage{display:none;height:100%;min-height:0}
    #view-gen[data-stage="init"] #stageInit{display:grid;grid-template-columns:1fr 440px;overflow:hidden}
    #view-gen[data-stage="extract"] #stageExtract{display:grid;grid-template-columns:1fr 440px;overflow:hidden}
    #view-gen[data-stage="verify"] #stageVerify{display:grid;grid-template-columns:1fr 440px;overflow:hidden}
    #view-gen[data-stage="gen"] #stageGen{display:grid;grid-template-columns:1fr 440px;overflow:hidden}
    #view-gen[data-stage="compliance"] #stageCompliance{display:grid;grid-template-columns:1fr 440px;overflow:hidden}
    #view-gen[data-stage="output"] #stageOutput{display:grid;grid-template-columns:1fr 440px;overflow:hidden}
    /* Flow bar */
    .flowbar{display:flex;align-items:center;gap:0;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
    .flow-step{display:flex;align-items:center;gap:8px;white-space:nowrap}
    .flow-node{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:#f1f4fb;color:#7c88a2;font-size:12px;font-weight:700;cursor:pointer;transition:.25s ease;border:1px solid transparent}
    .flow-node .n{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:#cfd8ea;color:#fff;font-size:10px}
    .flow-node:hover{background:var(--primary-soft);color:var(--primary);transform:translateY(-1px)}
    .flow-node.done{background:var(--green-soft);color:var(--green)}.flow-node.done .n{background:var(--green)}
    .flow-node.current{background:linear-gradient(135deg,var(--ai-blue),var(--ai-cyan));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(19,168,168,.25),var(--ai-glow)}.flow-node.current .n{background:rgba(255,255,255,.35)}
    .flow-arrow{width:20px;height:1px;background:#d5deee;margin:0 2px;position:relative;flex:none}
    .flow-arrow::after{content:"›";position:absolute;right:-3px;top:-10px;color:#b6c1d8}
    /* Scroll pages */
    .page-scroll{flex:1;min-height:0;overflow:auto;padding:22px 26px 40px}
    .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
    .page-title{font-size:21px;font-weight:800;background:linear-gradient(90deg,#0A3573,#0E4C92,#13A8A8);-webkit-background-clip:text;background-clip:text;color:transparent}
    .page-sub{margin-top:5px;color:var(--muted);font-size:13px}
    .sub-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
    .init-step-tag{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 13px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-size:13px;font-weight:800}
    .toolbar-inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .init-actions{display:flex;align-items:center;gap:12px;padding:14px 0 0;margin-top:8px;border-top:1px solid var(--line-soft)}

    /* ===== Init stage ===== */
    .init-main{min-width:0;min-height:0;overflow:auto}
    .stage-side{min-height:0;overflow:auto;padding:16px 16px 24px;background:#fff;border-left:1px solid var(--line)}
    .gen-center{min-height:0;overflow:hidden;display:flex;flex-direction:column;background:#eaf0f8}
    .init-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
    .init-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);margin-bottom:16px}
    .init-card .card-head{padding:13px 18px;display:flex;align-items:center;gap:10px}
    .init-card .card-body{padding:14px 18px 18px}
    .init-card .hint{color:var(--muted);font-size:12.5px;font-weight:600}
    .card-title{font-weight:800;font-size:15px}
    .sec-no{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:7px;background:var(--primary);color:#fff;font-size:12px;font-weight:800;margin-right:8px}
    /* 函件类型 pill */
    .type-inline{display:flex;flex-wrap:wrap;gap:8px}
    .type-pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--line);background:#fff;color:#4a5670;font-weight:700;font-size:13px;transition:.16s}
    .type-pill .tp-ic{font-size:14px}
    .type-pill:hover{color:var(--primary);border-color:rgba(14,76,146,.4);background:var(--primary-soft)}
    .type-pill.active{color:#fff;background:var(--primary);border-color:var(--primary);box-shadow:0 6px 14px rgba(14,76,146,.2)}
    .type-desc{margin-top:10px;padding:9px 12px;border-radius:9px;background:var(--primary-soft);color:var(--primary-dark);font-size:12.5px;line-height:1.6;display:flex;align-items:flex-start;gap:7px}
    .type-desc .td-ic{font-size:16px;flex:none;margin-top:1px}
    /* 自然语言 */
    .nl-input textarea{width:100%;min-height:130px;padding:14px 15px;border:1px solid var(--line);border-radius:12px;outline:none;background:#fbfcff;resize:vertical;line-height:1.8;font-size:15px;color:#1f2937;transition:.16s}
    .nl-input textarea:focus{border-color:rgba(14,76,146,.5);box-shadow:0 0 0 4px rgba(14,76,146,.08);background:#fff}
    .nl-input textarea::placeholder{color:#b0bacc}
    .nl-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:9px}
    .nl-foot .hint{font-size:12.5px}.nl-count{font-size:12.5px;color:var(--muted);font-weight:700}
    /* 上传 */
    .dropzone{border:1.5px dashed #b9c4dc;border-radius:14px;padding:26px 20px;text-align:center;background:#f8fafd;transition:.16s;cursor:pointer}
    .dropzone:hover,.dropzone.drag{border-color:var(--primary);background:var(--primary-soft)}
    .dropzone .dz-ic{font-size:30px;margin-bottom:8px}.dropzone .dz-t{font-size:15px;font-weight:800;color:#33405c}.dropzone .dz-s{font-size:12.5px;color:var(--muted);margin:4px 0 12px}
    /* 右侧材料栏 */
    .init-side{min-height:0;overflow:auto;background:#fff;border-left:1px solid var(--line);padding:16px 16px 24px}
    .side-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);overflow:hidden}
    .side-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
    .side-title{font-weight:800;font-size:14.5px;color:#1b2947;display:inline-flex;align-items:center;gap:7px}
    .side-count{font-size:12.5px;font-weight:700;color:var(--muted)}
    .side-empty{padding:40px 20px;text-align:center;color:#9aa4b8;font-size:13px;line-height:1.7}
    .side-empty .eic{width:50px;height:50px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:var(--primary-soft);color:var(--primary);margin:0 auto 10px}
    .parse-prog{display:none;padding:13px 16px;border-bottom:1px solid var(--line-soft);background:linear-gradient(180deg,#f7f9fd,#fff)}
    .parse-prog.show{display:block}
    .pp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
    .pp-lbl{font-size:13px;font-weight:800;color:#33405c;display:inline-flex;align-items:center;gap:6px}
    .pp-lbl .spin{display:inline-block;width:12px;height:12px;border:2px solid #cfd8ea;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
    .pp-pct{font-size:13px;font-weight:800;color:var(--primary)}
    .pp-bar{height:8px;border-radius:999px;background:#eef2f9;overflow:hidden}
    .pp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--cyan));transition:width .25s}
    .pp-stage{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.55}
    .parse-prog.done .pp-lbl{color:var(--green)}.parse-prog.done .pp-bar i{background:var(--green)}
    @keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #cfd8ea;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px}
    .file-check-list{display:grid;gap:10px;padding:12px;max-height:560px;overflow:auto}
    .fc-card{border:1px solid var(--line);border-radius:11px;background:#fbfcff;overflow:hidden}
    .fc-card.warn{border-color:#f3d799;background:#fffbf2}.fc-card.err{border-color:#f3bbb4;background:#fdf3f2}.fc-card.pending{border-style:dashed;border-color:#cfd8ea}
    .fc-head{display:flex;align-items:center;gap:7px;padding:9px 11px}
    .fc-ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:13px;background:var(--primary-soft);color:var(--primary);flex:none}
    .fc-name{font-weight:700;color:#28324c;font-size:12.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;flex:1}
    .fc-meta{font-size:11px;color:var(--muted);white-space:nowrap}
    .fc-type{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;font-size:10.5px;font-weight:800;background:#eef2fb;color:#4a5670;white-space:nowrap}
    .fc-tag{display:inline-flex;align-items:center;height:19px;padding:0 6px;border-radius:5px;font-size:10.5px;font-weight:700;background:#eef2fb;color:#6b7690;white-space:nowrap}
    .fc-tag.policy{background:var(--purple-soft);color:var(--purple)}.fc-tag.check{background:#e6f5f8;color:var(--cyan)}.fc-tag.incoming{background:var(--green-soft);color:var(--green)}
    .fc-row2{display:flex;align-items:center;gap:10px;padding:8px 11px 10px;border-top:1px dashed var(--line-soft)}
    .fc-row2 .fc-label{font-size:11px;font-weight:800;color:#6a7690;flex:none}
    .fc-items{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:0}
    .fc-fmt-wrap{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
    .fc-fmt{font-size:11.5px;color:#47536c;white-space:nowrap}.fc-fmt b{color:#8b95a7;font-weight:700}
    .fc-fmt.pend{color:#9aa4b8;display:inline-flex;align-items:center;gap:4px}
    .mini-btn.ocr{color:var(--cyan);border-color:#bfe6ee;background:#e6f5f8;flex:none}
    .mini-btn.ocr:hover{background:#d3eef3;border-color:var(--cyan)}
    .ck{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:600;background:#fff;border:1px solid var(--line-soft);color:#6a7690}
    .ck.ok{color:var(--green);border-color:#c5e9dd;background:var(--green-soft)}.ck.fail{color:var(--red);border-color:#f3c4bf;background:var(--red-soft)}.ck.warn{color:var(--orange);border-color:#f3d799;background:var(--orange-soft)}.ck.pending{color:#9aa4b8;border-style:dashed}
    .ck.pending .spin{display:inline-block;width:9px;height:9px;border:2px solid #cfd8ea;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
    .init-actions{display:flex;align-items:center;gap:12px;padding:14px 26px;background:#fff;border-top:1px solid var(--line);margin-top:16px}
    .init-actions .hint{font-size:12.5px}

    /* ===== Extract & Verify shared ===== */
    .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);transition:transform .25s ease,box-shadow .25s ease}
    .card:hover{transform:translateY(-3px);box-shadow:0 16px 42px rgba(10,53,115,.13)}
    .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
    .card-title{font-weight:800;font-size:15px}
    .card-body{padding:16px}
    table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
    table.tbl th{text-align:left;padding:11px 12px;color:#6a7690;font-weight:700;background:#f7f9fd;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
    table.tbl td{padding:11px 12px;border-bottom:1px solid var(--line-soft);color:#37425c}
    table.tbl tr:hover td{background:#fafbff}
    .tbl-wrap{overflow:auto}
    .tag{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:700}
    .tag.high{color:#b42318;background:var(--red-soft)}.tag.mid{color:#9a5b00;background:var(--orange-soft)}.tag.low{color:#1747b6;background:var(--primary-soft)}.tag.done{color:var(--green);background:var(--green-soft)}.tag.wait{color:var(--orange);background:var(--orange-soft)}.tag.doing{color:var(--primary);background:var(--primary-soft)}
    .src-tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;font-size:10.5px;font-weight:700}
    .src-tag.file{background:#e6f5f8;color:var(--cyan)}.src-tag.text{background:var(--purple-soft);color:var(--purple)}.src-tag.fused{background:var(--green-soft);color:var(--green)}
    .hint{color:var(--muted);font-size:12.5px;font-weight:600}

    /* ===== Extract modal ===== */
    .ext-modal{padding:4px 2px 2px}
    .ext-mhead{margin-bottom:14px}
    .ext-mtitle{font-size:16px;font-weight:800;color:#1b2947;display:inline-flex;align-items:center;gap:8px}
    .ext-mtitle .spin{width:14px;height:14px;border-width:2.5px}
    .ext-mtitle.done{color:var(--green)}
    .ext-msub{margin-top:5px;font-size:13px;color:var(--muted)}
    .ext-mbar{height:8px;border-radius:999px;background:#eef2f9;overflow:hidden;margin-bottom:14px}
    .ext-mbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--cyan));transition:width .25s}
    .ext-mlist{display:grid;gap:9px;max-height:46vh;overflow:auto;padding-right:4px}
    .ext-mrow{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line-soft);border-radius:11px;background:#fbfcff;animation:extIn .28s ease}
    @keyframes extIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .ext-mic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--green-soft);color:var(--green);flex:none;margin-top:1px}
    .ext-mbody{min-width:0;flex:1}
    .ext-mrow-top{display:flex;align-items:center;gap:8px;margin-bottom:3px}
    .ext-mname{font-weight:800;font-size:13.5px;color:#28324c}
    .ext-msrc{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;font-size:10.5px;font-weight:700}
    .ext-msrc.file{background:#e6f5f8;color:var(--cyan)}.ext-msrc.text{background:var(--purple-soft);color:var(--purple)}.ext-msrc.fused{background:var(--green-soft);color:var(--green)}
    .ext-mval{font-size:13px;color:#47536c;line-height:1.55;word-break:break-all}
    .ext-mfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft)}
    .ext-mfoot .primary-btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}

    /* ===== Verify ===== */
    .verify-dims{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
    .vdim{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:#f7f9fd;font-size:13px}
    .vdim .vd-ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px}
    .vdim.ok{border-color:#c5e9dd;background:var(--green-soft);color:var(--green)}.vdim.ok .vd-ic{background:var(--green);color:#fff}
    .vdim.warn{border-color:#f3d799;background:var(--orange-soft);color:#9a6a00}.vdim.warn .vd-ic{background:var(--orange);color:#fff}
    .vdim .vd-name{font-weight:800}.vdim .vd-cnt{font-weight:700}
    .ve-row{display:grid;grid-template-columns:150px 1fr 96px 110px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line-soft)}
    .ve-row:last-child{border-bottom:0}
    .ve-name{font-weight:800;font-size:13.5px;color:#28324c}.ve-name .ve-req{color:var(--red);margin-left:2px}
    .ve-input{width:100%;height:36px;padding:0 11px;border:1px solid var(--line);border-radius:9px;outline:none;background:#fff;font-size:13.5px;color:#1f2937;transition:.16s}
    .ve-input:focus{border-color:rgba(14,76,146,.5);box-shadow:0 0 0 3px rgba(14,76,146,.08)}
    .ve-row.warn .ve-input{border-color:#f3d799;background:#fffbf2}
    .ve-src{font-size:11px}.ve-status{display:inline-flex;align-items:center;gap:5px}
    .ve-note{grid-column:2 / -1;margin-top:-4px;margin-bottom:4px;padding:7px 10px;border-radius:8px;background:#fff6e6;color:#9a6a00;font-size:12px;line-height:1.55}
    .ve-row.ok .ve-note{display:none}

    /* ===== Gen stage ===== */
    .tool-main{min-width:0;min-height:0;display:grid;grid-template-rows:auto 1fr;background:#eaf0f8}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 16px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
    .toolbar-left,.toolbar-right{display:flex;align-items:center;gap:7px;min-width:0}
    .workspace{min-height:0;overflow:auto;padding:20px 24px 36px;display:flex;justify-content:center}
    .doc-wrap{flex:0 1 820px;min-width:0;min-height:960px;background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);position:relative}
    .gw-doc{min-height:900px;padding:52px 64px 60px;background:#fff;line-height:2;color:#1f2937;font-family:"FangSong","仿宋","SimSun",serif;font-size:18px}
    .gw-doc .gw-fwzh{text-align:center;color:#47536e;font-size:16px;margin-bottom:22px}
    .gw-doc h1{margin:0 0 20px;text-align:center;font-family:"SimHei","黑体",sans-serif;font-size:24px;line-height:1.55;font-weight:700}
    .gw-doc p{margin:0 0 8px;text-indent:2em}.gw-doc .no-indent{text-indent:0}.gw-doc .right{text-align:right;text-indent:0}
    .gw-doc .sec{font-family:"SimHei","黑体",sans-serif;font-weight:700}.gw-doc .end{text-indent:2em;margin-top:10px}
    .gw-doc .cite{color:var(--primary);border-bottom:1px dashed var(--primary);cursor:help}.gw-doc .hl{background:#fff7e6;border-radius:3px;padding:0 2px}
    .doc-attr{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);color:#8b95a7;font-size:12px;text-align:right}
    .rightbar{min-height:0;overflow:hidden;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column}
    .fmt-side{background:#fff}.fmt-scroll{height:100%;overflow:auto;padding:16px 16px 24px}
    .fmt-sec{padding:14px 0;border-bottom:1px solid var(--line-soft)}.fmt-sec:last-child{border-bottom:0}
    .fmt-sec-title{font-size:13px;font-weight:800;color:#1b2947;margin-bottom:4px;display:flex;align-items:center;gap:6px}
    .fmt-sec-sub{font-size:11.5px;color:var(--muted);margin-bottom:9px;line-height:1.5}
    .fmt-pill-row{display:flex;flex-wrap:wrap;gap:6px}
    .fmt-pill{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:#4a5670;font-size:12.5px;font-weight:700;cursor:pointer;transition:.16s}
    .fmt-pill:hover{border-color:rgba(14,76,146,.4);color:var(--primary)}.fmt-pill.active{background:var(--primary);border-color:var(--primary);color:#fff}
    .doc-empty{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;text-align:center;padding-top:64px}
    .doc-empty .eic{width:74px;height:74px;border-radius:18px;display:grid;place-items:center;font-size:34px;background:var(--primary-soft);color:var(--primary)}
    .doc-empty .et{font-size:18px;font-weight:800;color:#33405c}.doc-empty .es{font-size:13px;color:var(--muted);line-height:1.75;max-width:340px}
    /* 可编辑正文 */
    .gw-doc[contenteditable="true"]{cursor:text;outline:none;box-shadow:inset 0 0 0 2px rgba(14,76,146,.25);border-radius:4px}
    .draft-note{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:var(--primary-soft);color:var(--primary-dark);font-size:12.5px;margin:0 24px 16px;line-height:1.6}
    /* AI校验结果 */
    .ai-list{display:grid;gap:9px}
    .airow{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border:1px solid var(--line-soft);border-radius:11px;background:#fbfcff}
    .airow.ok{border-color:#c5e9dd;background:var(--green-soft)}.airow.warn{border-color:#f3d799;background:var(--orange-soft)}
    .aiic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none}
    .airow.ok .aiic{background:var(--green);color:#fff}.airow.warn .aiic{background:var(--orange);color:#fff}
    .aibody{min-width:0;flex:1}.ainame{font-weight:800;font-size:13.5px;color:#28324c}
    .aidetail{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}

    /* ===== 函件模板库 ===== */
    .tpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:0 0 40px}
    .tpl-section-title{grid-column:1/-1;font-size:14px;font-weight:800;color:#1b2947;margin:8px 0 -4px;padding-bottom:6px;border-bottom:2px solid var(--primary-soft);display:flex;align-items:center;gap:8px}
    .tpl-section-title::before{content:"▤";color:var(--cyan)}
    .tpl-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:18px;transition:.16s;cursor:pointer;position:relative}
    .tpl-card:hover{border-color:rgba(14,76,146,.4);box-shadow:var(--shadow);transform:translateY(-2px)}
    .tpl-card .tpl-ic{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:20px;background:var(--primary-soft);color:var(--primary);margin-bottom:12px}
    .tpl-card h4{margin:0 0 6px;font-size:15px;color:#1b2947}
    .tpl-card p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.6}
    .tpl-card .tpl-tag{position:absolute;top:14px;right:14px}
    .tpl-card .tpl-foot{margin-top:12px;display:flex;align-items:center;gap:14px}
    .tpl-card .tpl-foot a{color:var(--primary);font-size:13px;font-weight:700;cursor:pointer}
    .tpl-card .tpl-foot a:hover{text-decoration:underline}
    /* 模板预览弹窗 */
    .tpl-preview-doc{background:#fff;border:1px solid var(--line);border-radius:8px;padding:34px 46px;line-height:2;font-family:"FangSong","仿宋","SimSun",serif;font-size:15.5px;color:#1f2937;max-height:56vh;overflow:auto}
    .tpl-preview-doc h1{text-align:center;font-family:"SimHei","黑体",sans-serif;font-size:19px;margin:0 0 6px;font-weight:700}
    .tpl-preview-doc .pv-no{text-align:center;color:#47536e;font-size:13px;margin-bottom:16px}
    .tpl-preview-doc p{margin:0 0 7px;text-indent:2em}
    .tpl-preview-doc .no-indent{text-indent:0}
    .tpl-preview-doc .right{text-align:right;text-indent:0}
    .tpl-preview-doc .sec{font-family:"SimHei","黑体",sans-serif;font-weight:700}
    .tpl-preview-doc .sub-sec{text-indent:2em}
    .tpl-preview-doc .end{text-indent:2em;margin-top:8px}
    .tpl-preview-doc .ph{color:#b04a00;background:#fff4e0;padding:0 3px;border-radius:2px;font-style:normal}
    .tpl-preview-doc .meta{color:#47536e;font-size:13px;text-indent:0}
    .tpl-preview-doc .pv-tip{margin-top:14px;padding:9px 11px;border-radius:8px;background:#f3f7ff;color:#4a597a;font-size:12.5px;line-height:1.6}
    /* 上传提取模板 */
    .cc-row{display:flex;flex-wrap:wrap;gap:10px 20px}
    .cc-opt{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:#47536c;cursor:pointer;user-select:none}
    .cc-opt .cbx{width:15px;height:15px;border-radius:4px;border:1.5px solid #c4cde0;display:grid;place-items:center;color:#fff;font-size:10px;transition:.15s}
    .cc-opt.on .cbx{background:var(--primary);border-color:var(--primary)}
    .cc-opt.on .cbx::after{content:"✓"}

    /* ===== 知识库/设置/历史/统计 通用样式 ===== */
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .rule-layout{display:grid;grid-template-columns:210px 1fr;gap:16px}
    .rule-nav{display:grid;gap:4px;align-content:start}
    .rule-nav button{text-align:left;padding:11px 12px;border-radius:10px;color:#46536e;font-weight:700;transition:.16s;display:flex;align-items:center;justify-content:space-between}
    .rule-nav button:hover{background:#fff;color:var(--primary)}
    .rule-nav button.active{background:var(--primary);color:#fff;box-shadow:var(--shadow-sm)}
    .rule-nav button .badge{font-size:12px;padding:1px 7px;border-radius:999px;background:#eef2fb;color:#6b7690}
    .rule-nav button.active .badge{background:rgba(255,255,255,.24);color:#fff}

    /* ===== 生成设置三级子菜单 ===== */
    .set-sub-nav{display:flex;gap:10px;padding:16px 0 0;margin-bottom:0;flex-wrap:wrap}
    .set-sub-tab{display:flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:#4a5670;font-weight:700;font-size:14px;transition:.16s}
    .set-sub-tab .st-ic{font-size:16px}
    .set-sub-tab .st-badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;background:#eef2fb;color:#6b7690}
    .set-sub-tab:hover{border-color:rgba(14,76,146,.4);color:var(--primary);background:var(--primary-soft)}
    .set-sub-tab.active{border-color:var(--primary);background:var(--primary);color:#fff;box-shadow:0 8px 18px rgba(14,76,146,.2)}
    .set-sub-tab.active .st-badge{background:rgba(255,255,255,.25);color:#fff}
    .set-level-desc{margin:10px 0 16px;padding:0}
    .set-level-desc .note-strip{margin-bottom:0}
    .set-panel{display:none}
    .set-panel.active{display:block}
    .note-strip{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:var(--orange-soft);color:#9a6a00;font-size:13px;margin-bottom:12px}
    .row-act a{color:var(--primary);font-weight:700;margin-right:12px}
    .row-act a:hover{text-decoration:underline}
    .row-act a.danger{color:var(--red)}
    .search{display:inline-flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
    .search span{color:var(--muted);font-size:14px}.search input{border:0;outline:none;background:transparent;height:32px;width:100%;color:var(--text)}
    /* Settings */
    .set-group{padding:18px 4px;border-bottom:1px solid var(--line-soft)}.set-group:last-child{border-bottom:0}
    .set-label{font-weight:800;margin-bottom:12px;color:#1f2b45}
    .radio-row{display:flex;flex-wrap:wrap;gap:12px 26px}
    .opt{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:#46536e;font-size:14px;user-select:none}
    .opt .rd{width:18px;height:18px;border-radius:50%;border:2px solid #c4cde0;display:grid;place-items:center;transition:.15s}
    .opt .rd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary);transform:scale(0);transition:.15s}
    .opt.on .rd{border-color:var(--primary)}.opt.on .rd::after{transform:scale(1)}
    .check-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;color:#46536e;font-size:14px;border-bottom:1px dashed var(--line-soft)}
    .toggle{width:40px;height:23px;padding:2px;border-radius:999px;background:#d3dbea;transition:.16s;flex:none}
    .toggle::after{content:"";display:block;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(10,53,115,.2);transition:.16s}
    .toggle.on{background:var(--primary)}.toggle.on::after{transform:translateX(17px)}
    .hidden-input{display:none}

    /* ===== Compliance stage ===== */
    .comp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
    .comp-dim{border:1px solid var(--line);border-radius:14px;padding:18px;background:#fff;text-align:center;transition:.2s}
    .comp-dim h4{margin:0 0 4px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px}
    .comp-dim .cd-sub{color:var(--muted);font-size:12px;margin-bottom:12px;line-height:1.5}
    .comp-ring{--v:0;width:90px;height:90px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;background:conic-gradient(var(--green) calc(var(--v)*1%),#e9eef7 0)}
    .comp-ring i{width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-style:normal;font-size:22px;color:var(--text)}
    .comp-dim .cd-tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
    .comp-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm)}
    .comp-issue{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;background:#fff;display:flex;gap:12px;align-items:flex-start}
    .comp-issue.high{border-color:#f3c9c6;background:#fff8f7}.comp-issue.mid{border-color:#f0dcbc;background:#fffaf1}.comp-issue.ok{border-color:#c7ead9;background:#f6fdf9}
    .comp-issue .ci-ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;flex:none}
    .comp-issue.high .ci-ic{background:var(--red);color:#fff}.comp-issue.mid .ci-ic{background:var(--orange);color:#fff}.comp-issue.ok .ci-ic{background:var(--green);color:#fff}
    .comp-issue .ci-body{flex:1;min-width:0}.comp-issue .ci-title{font-weight:700;font-size:13.5px;color:#28324c}
    .comp-issue .ci-detail{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.55}
    .comp-issue .ci-acts{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}

    /* ===== Output stage ===== */
    .out-center{min-height:0;overflow:auto;display:flex;flex-direction:column;background:#eaf0f8}
    .out-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 16px;background:#fff;border-bottom:1px solid var(--line)}
    .out-toolbar-left,.out-toolbar-right{display:flex;align-items:center;gap:7px;min-width:0}
    .out-preview{min-height:0;overflow:auto;padding:20px 24px 36px;display:flex;justify-content:center}
    .out-preview .doc-wrap{flex:0 1 820px;min-width:0;min-height:960px;background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);position:relative}
    .out-rightbar{min-height:0;overflow:hidden;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column}
    .fmt-scroll2{height:100%;overflow:auto;padding:16px 16px 24px}
    .fmt-sec2{padding:14px 0;border-bottom:1px solid var(--line-soft)}
    .fmt-sec2:last-child{border-bottom:0}
    .fmt-sec2-title{font-size:13px;font-weight:800;color:#1b2947;margin-bottom:4px;display:flex;align-items:center;gap:6px}
    .fmt-sec2-title .fmt-std{font-size:10.5px;font-weight:700;color:var(--cyan);background:#e6f5f8;padding:1px 6px;border-radius:5px}
    .fmt-sec2-sub{font-size:11.5px;color:var(--muted);margin-bottom:9px;line-height:1.5}
    .fmt-icon-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .fmt-icon2{text-align:left;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:#fbfcff;cursor:pointer;transition:.16s;display:flex;align-items:center;gap:8px}
    .fmt-icon2:hover{border-color:rgba(14,76,146,.4);background:#fff}
    .fmt-icon2.active{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 6px 14px rgba(14,76,146,.1)}
    .fmt-icon2 .fi-pic{width:34px;height:26px;border-radius:4px;border:1.5px solid #c7cfdd;background:#fff;flex:none;position:relative;overflow:hidden}
    .fmt-icon2 .fi-pic.red::before{content:"";position:absolute;top:4px;left:4px;right:4px;height:6px;background:#c0161b;border-radius:1px}
    .fmt-icon2 .fi-pic.letter::before{content:"";position:absolute;top:5px;left:4px;right:4px;height:2px;background:#1b2947}

      const rows=checks.map(c=>'<div class="airow '+(c.ok?'ok':'warn')+'"><span class="aiic">'+(c.ok?'✓':'!')+'</span><div class="aibody"><div class="ainame">'+c.name+'</div><div class="aidetail">'+c.detail+'</div></div></div>').join('');

    // —— 合规校验 ——
    function doCompliance(){
      const doc=finalDocRef.value;const text=doc?doc.textContent:'';
      const has=kw=>text.indexOf(kw)>=0;
      const type=selectedType.value;
      const contentIssues=[];
      if(!has('关于')||!has('的函'))contentIssues.push({level:'high',dim:'content',label:'标题格式不规范',detail:'函件标题应包含"关于…的函/复函"文种标志，当前标题缺少完整文种结构。',act:'focus'});
      if(type==='答复函'&&!has('收悉'))contentIssues.push({level:'high',dim:'content',label:'答复函缺少来函引述',detail:'答复函应在正文首段引述来函标题及文号（"……收悉"），再逐项答复。',act:'focus'});
      if(type==='商洽函'&&!has('商洽'))contentIssues.push({level:'mid',dim:'content',label:'商洽函应体现商洽性质',detail:'正文中建议明确"商洽""商请"等协商性表述，确保与文种性质相符。',act:'focus'});
      const hasClosing=has('特此函商')||has('特此函询')||has('特此函复')||has('特此函告')||has('妥否')||has('谢谢');
      if(!hasClosing)contentIssues.push({level:'high',dim:'content',label:'缺少法定结束语',detail:'函件须在正文末尾使用法定结束语（如"特此函商""特此函复""妥否，请批复"等）。',act:'focus'});
      if(hasClosing)contentIssues.push({level:'ok',dim:'content',label:'结束语符合文种要求',detail:'已检测到法定结束语，与当前函件类型匹配。',act:''});
      contentIssues.push({level:'ok',dim:'content',label:'核心要素齐备',detail:'发文机关、主送机关、事项名称、核心诉求、落款等要素均已体现。',act:''});
      const formatIssues=[];
      const fwzhEl=text.match(/〔\d{4}〕\d+号/);
      if(!fwzhEl&&type!=='便函')formatIssues.push({level:'high',dim:'format',label:'缺少发文字号',detail:'正式函件应标注发文字号（机关代字+年份+序号），便函可免编字号。',act:'auto'});
      if(fwzhEl)formatIssues.push({level:'ok',dim:'format',label:'发文字号格式合规',detail:'发文字号格式为"机关代字〔2026〕XX号"，符合《党政机关公文格式》要求。',act:''});
      if(!has('：'))formatIssues.push({level:'high',dim:'format',label:'主送机关缺冒号',detail:'主送机关后应使用全角冒号"："。',act:'auto'});
      else formatIssues.push({level:'ok',dim:'format',label:'主送格式规范',detail:'主送机关顶格书写、使用全角冒号，格式合规。',act:''});
      if(!has('2026')&&!has('二〇二六'))formatIssues.push({level:'mid',dim:'format',label:'成文日期',detail:'建议检查落款日期是否标注（应为汉字数字标注，如"二〇二六年七月十七日"）。',act:'focus'});
      else formatIssues.push({level:'ok',dim:'format',label:'成文日期已标注',detail:'落款日期要素完整。',act:''});
      formatIssues.push({level:'ok',dim:'format',label:'正文段首缩进',detail:'正文段落已按公文格式设置首行缩进。',act:''});
      const toneIssues=[];
      const badCmds=['责成','着即','限于','速将','即报','望即','特此请示','请批示'];
      const foundBad=badCmds.filter(has);
      if(foundBad.length)toneIssues.push({level:'mid',dim:'tone',label:'存在不适配横向行文的用语',detail:'检出命令/请示口吻词：'+foundBad.map(w=>'「'+w+'」').join('、')+'。横向行文（平级）宜用协商性用语。',act:'auto'});
      else toneIssues.push({level:'ok',dim:'tone',label:'无命令/请示口吻',detail:'用语平级得体，未检测到不适配横向行文的命令或请示口吻表述。',act:''});
      const casualWords=['搞定','搞好','弄','马上','差不多','回头','大概','基本'];
      const foundCasual=casualWords.filter(has);
      if(foundCasual.length)toneIssues.push({level:'mid',dim:'tone',label:'存在非正式口语化表述',detail:'检出：'+foundCasual.map(w=>'「'+w+'」').join('、')+'，建议替换为政务规范用语。',act:'auto'});
      else toneIssues.push({level:'ok',dim:'tone',label:'无口语化表述',detail:'用语文书正式，符合政务公文规范。',act:''});
      toneIssues.push({level:'ok',dim:'tone',label:'横向行文语气得体',detail:'正文未使用下行文命令口吻，符合平级单位间行文规范。',act:''});
      const allIssues=[...contentIssues,...formatIssues,...toneIssues];
      compliance.value={content:contentIssues,format:formatIssues,tone:toneIssues,all:allIssues};
      compliancePassed.value=allIssues.filter(i=>i.level==='high').length===0;
      return allIssues;
    }

        {key:'format',label:'格式规范',icon:'📐',desc:'发文字号·主送格式·段落缩进',issues:compliance.value.format},
        {key:'tone',label:'语气得体',icon:'✒️',desc:'平级用语·无命令/口语化',issues:compliance.value.tone}
      ];

        const score=Math.max(40,100-risk*25-mid*10);

      if(type==='答复函'){
        doc+='<p>你单位《'+getV('incomingTitle')+'》（'+getV('incomingNo')+'）收悉。经研究，现函复如下：</p>';

      }else if(type==='询问函'){
        doc+='<p>我办在开展相关工作中，就'+getV('matter')+'存在疑问，根据'+getV('basis')+'，特向贵局咨询如下：</p>';
        const qs=(getV('questions')||'').split(/[；;]/).filter(Boolean);
        qs.forEach((q,i)=>doc+='<p class="sec">'+(i+1)+'、'+q.trim()+'；</p>');
        doc+='<p>以上问题，请于<span class="hl">'+getV('replyDeadline')+'</span>前予以函复。</p>';
      }else if(type==='请批函'){
        doc+='<p>为保障全区政务数据共享平台建设连续推进，根据<span class="cite">'+getV('basis')+'</span>，现将'+getV('approvalItem')+'有关事宜报请协调如下：</p>';

                <div style="padding:14px 16px;font-size:13px;line-height:1.8;color:#4a5670">
                  <div v-for="(d,i) in verifyDims" :key="i" style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f0f2f5">
                    <span>{{d.name}}</span><b :style="{color:d.cnt?'#f59e0b':'#22c55e'}">{{d.cnt?'待修正 '+d.cnt:'通过'}}</b>
                  </div>
                </div>
              </div>
              <div class="side-card" style="margin-top:12px">
                <div class="side-head"><div class="side-title">💡 校验说明</div></div>
                <div style="padding:14px 16px;font-size:12.5px;line-height:1.7;color:#6b7689">
                  准确性：核对要素内容是否正确。<br>内容合规：检查是否涉及敏感内容。<br>语气得体：确保措辞符合公文规范。
                </div>
              </div>
            </aside>
          </div>
          <!-- Stage: 正文生成 -->
          <div class="stage" id="stageGen">
            <div class="gen-center">
              <section class="toolbar">
                <div class="toolbar-left">
                  <n-button size="small" @click="backToVerify">‹ 返回校验</n-button>
                  <n-tag type="success" size="small">✓ 校验通过</n-tag>
                </div>
                <div class="toolbar-right">
                  <n-button size="small" :disabled="generating" @click="editToggle">{{editing?'✓ 完成编辑':'✎ 编辑正文'}}</n-button>
                  <n-button size="small" :disabled="generating" @click="polish">🪄 AI 润色</n-button>
                  <n-button size="small" :disabled="generating" @click="rewrite">🔄 结合修改重写</n-button>
                  <n-button size="small" :disabled="generating" @click="aiCheck">🔍 AI 校验</n-button>
                  <n-button size="small" :disabled="generating" @click="copyGen">复制全文</n-button>
                  <n-button type="primary" size="small" :disabled="generating" @click="goCompliance">下一步：合规校验 ›</n-button>
                </div>
              </section>
              <div class="draft-note">💡 预览内容支持直接点击修改；修改后可「AI 润色」优化行文表述，或「结合修改重写」基于编辑内容重新生成完整正文。</div>
              <section class="workspace"><div class="doc-wrap"><article class="gw-doc" ref="finalDocRef"></article></div></section>
            </div>
            <aside class="stage-side">
              <div class="side-card">
                <div class="side-head"><div class="side-title">✏️ 编辑工具</div></div>
                <div style="padding:14px 16px;font-size:12.5px;line-height:1.7;color:#6b7689">
                  <div style="margin-bottom:8px">🎨 <b>AI 润色</b>：优化行文表述</div>
                  <div style="margin-bottom:8px">🔄 <b>结合修改重写</b>：基于编辑内容重新生成</div>
                  <div style="margin-bottom:8px">🔍 <b>AI 校验</b>：检查内容质量</div>
                  <div>📄 <b>复制全文</b>：一键复制正文</div>
                </div>
              </div>
              <div class="side-card" style="margin-top:12px">
                <div class="side-head"><div class="side-title">📝 文档信息</div></div>
                <div style="padding:14px 16px;font-size:12.5px;line-height:1.8;color:#4a5670">
                  <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f0f2f5"><span>当前阶段</span><b>正文生成</b></div>
                  <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f0f2f5"><span>函件类型</span><b>{{selectedType||'-'}}</b></div>
                  <div style="display:flex;justify-content:space-between;padding:4px 0"><span>编辑状态</span><b :style="{color:editing?'#0E4C92':'#22c55e'}">{{editing?'编辑中':'预览中'}}</b></div>
                </div>
              </div>
            </aside>
          </div>

          <!-- Stage: 合规校验 -->
          <div class="stage" id="stageCompliance">
            <div class="page-scroll">
              <div class="sub-head"><div><div class="page-title">合规校验</div><div class="page-sub">内容 / 格式 / 语气三维度校验 · 风险定位跳转 · 一键优化修复 · 流程 5 / 6</div></div><div class="init-step-tag">流程 5 / 6 · 合规校验</div></div>
              <div class="comp-actions">
                <n-button size="small" @click="backToGen">‹ 返回初稿</n-button>
                <n-button type="primary" size="small" @click="runComplianceBtn">🛡 一键合规校验</n-button>
                <span class="hint" style="flex:1;" v-html="compSummary"></span>
                <n-button v-if="compliancePassed" type="primary" size="small" @click="goOutputFromComp">下一步：成果输出 ›</n-button>
              </div>
              <div class="comp-grid">
                <div v-for="d in compDimData" :key="d.key" class="comp-dim">
                  <h4>{{d.icon}} {{d.label}}</h4>
                  <div class="cd-sub">{{d.desc}}</div>
                  <div class="comp-ring" :style="{'--v':d.score}"><i>{{d.score}}</i></div>
                  <div class="cd-tags">
                    <n-tag v-if="d.risk" size="small" type="error">风险 {{d.risk}}</n-tag>
                    <n-tag v-if="d.mid" size="small" type="warning">提示 {{d.mid}}</n-tag>
                    <n-tag v-if="!d.risk && !d.mid" size="small" type="success">✓ 通过</n-tag>
                  </div>
                </div>
              </div>
              <div class="card" v-if="compliance">
                <div class="card-head"><div class="card-title">校验明细</div><span class="hint">共 {{compliance.all.length}} 项</span></div>
                <div class="card-body">
                  <div v-for="(iss,i) in compliance.all" :key="i" class="comp-issue" :class="iss.level">
                    <div class="ci-ic">{{iss.level==='high'?'⛔':iss.level==='mid'?'⚠':'✓'}}</div>
                    <div class="ci-body">
                      <div class="ci-title"><n-tag size="tiny" :type="iss.dim==='content'?'info':iss.dim==='format'?'warning':'success'" style="margin-right:6px">{{iss.dim==='content'?'内容合规':iss.dim==='format'?'格式规范':'语气得体'}}</n-tag>{{iss.label}}</div>
                      <div class="ci-detail">{{iss.detail}}</div>
                      <div class="ci-acts" v-if="iss.act">
                        <button v-if="iss.act==='auto'" class="mini-btn" @click="autoFixCompIssue(iss.label)">🔧 一键修复</button>
                        <button v-if="iss.act==='focus'" class="mini-btn" @click="focusGenEdit">定位修改</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <aside class="stage-side">
              <div class="side-card">
                <div class="side-head"><div class="side-title">🛡 合规总览</div></div>
                <div style="padding:14px 16px;font-size:13px;line-height:1.8;color:#4a5670">
                  <div v-for="d in compDimData" :key="d.key" style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f2f5">
                    <span>{{d.icon}} {{d.label}}</span><b :style="{color:d.score>=80?'#22c55e':d.score>=60?'#f59e0b':'#ef4444'}">{{d.score}}分</b>
                  </div>
                </div>
              </div>
              <div class="side-card" style="margin-top:12px">
                <div class="side-head"><div class="side-title">💡 修复提示</div></div>
                <div style="padding:14px 16px;font-size:12.5px;line-height:1.7;color:#6b7689">
                  高风险项需立即修复，中风险项建议优化。点击「一键修复」可自动处理格式问题，「定位修改」可跳转至正文编辑。
                </div>
              </div>
            </aside>
          </div>

          <!-- Stage: 成果输出 -->
          <div class="stage" id="stageOutput">
            <div class="out-center">
              <section class="out-toolbar">
                <div class="out-toolbar-left">
                  <n-button size="small" @click="outBack">‹ 返回合规校验</n-button>
                  <n-tag type="success" size="small">✓ 合规校验通过</n-tag>
                  <span class="hint" style="color:#8b95a7;font-size:13px;">最终函件文稿 · 按所选版式渲染</span>
                </div>
                <div class="out-toolbar-right">
                  <n-button size="small" @click="copyOut">复制全文</n-button>
                  <n-button size="small" @click="showToast('导出 Word（Demo 占位，实际将导出符合 GB/T 9704 版式的公文）')">⬇ 导出 Word</n-button>
                  <n-button size="small" @click="showToast('导出 PDF（Demo 占位，实际将导出符合 GB/T 9704 版式的公文）')">⬇ 导出 PDF</n-button>
                  <n-button type="primary" size="small" @click="archive">📦 确认归档</n-button>
                </div>
              </section>
              <div class="out-preview">
                <div class="doc-wrap"><article class="gw-doc" id="finalOutDoc" v-html="outDocHTML"></article></div>
              </div>
            </div>
            <aside class="out-rightbar">
              <div class="fmt-scroll2">
                <div class="fmt-sec2">
                  <div class="fmt-sec2-title">板头与公文版式 <span class="fmt-std">GB/T 9704—2012</span></div>
                  <div class="fmt-sec2-sub">严格遵循党政机关公文格式，支持文件(红头)、信函、命令(令)、纪要等版式。函件推荐使用信函格式。</div>
                  <div class="fmt-icon-grid">
                    <button v-for="l in LAYOUTS" :key="l.k" class="fmt-icon2" :class="{active:outFmt.layout===l.k}" @click="fmtClick('layout',l.k)"><span class="fi-pic" :class="l.pic"></span><span class="fi-name">{{l.name}}</span></button>
                  </div>
                </div>
                <div class="fmt-sec2">
                  <div class="fmt-sec2-title">盖章版式</div>
                  <div class="fmt-sec2-sub">选择公文印章加盖方式</div>
                  <div class="fmt-icon-grid">
                    <button v-for="s in SEALS" :key="s.k" class="fmt-icon2" :class="{active:outFmt.seal===s.k}" @click="fmtClick('seal',s.k)"><span class="fi-pic" :class="s.pic"></span><span class="fi-name">{{s.name}}</span></button>
                  </div>
                </div>
                <div class="fmt-sec2">
                  <div class="fmt-sec2-title">密级与期限</div>
                  <div class="fmt-pill-row2">
                    <button v-for="s in SECRETS" :key="s" class="fmt-pill2" :class="{danger:s!=='非涉密',active:outFmt.secret===s}" @click="fmtClick('secret',s)">{{s}}</button>
                  </div>
                  <div class="fmt-field2"><label>保密期限</label><div class="fmt-pill-row2"><button v-for="t in SECRET_TERMS" :key="t" class="fmt-pill2" :class="{active:outFmt.secretTerm===t}" @click="fmtClick('secretTerm',t)">{{t}}</button></div></div>
                </div>
                <div class="fmt-sec2">
                  <div class="fmt-sec2-title">紧急程度</div>
                  <div class="fmt-pill-row2"><button v-for="u in URGS" :key="u.k" class="fmt-pill2" :class="[u.cls,{active:outFmt.urgency===u.k}]" @click="fmtClick('urgency',u.k)">{{u.k}}</button></div>
                </div>
                <div class="fmt-sec2">
                  <div class="fmt-sec2-title">发文字号</div>
                  <div class="fmt-sec2-sub">发文机关代字 + 年份 + 发文顺序号</div>
                  <div class="fmt-inline2"><input class="fmt-input2" :value="outFmt.daiZi" @input="fmtInput('daiZi',$event)" style="flex:1;"><span class="fmt-bracket">〔</span><input class="fmt-input2" :value="outFmt.year" @input="fmtInput('year',$event)" style="width:60px;text-align:center;"><span class="fmt-bracket">〕</span><input class="fmt-input2" :value="outFmt.seq" @input="fmtInput('seq',$event)" style="width:60px;text-align:center;"><span class="fmt-bracket">号</span></div>
                </div>
                <div class="fmt-sec2">
                  <div class="fmt-sec2-title">落款与分发</div>
                  <div class="fmt-field2"><label>发文机关</label><input class="fmt-input2" :value="outFmt.fromOrg" @input="fmtInput('fromOrg',$event)"></div>
                  <div class="fmt-field2"><label>成文日期</label><input class="fmt-input2" :value="outFmt.date" @input="fmtInput('date',$event)"></div>
                  <div class="fmt-field2"><label>签发人</label><input class="fmt-input2" :value="outFmt.signer" @input="fmtInput('signer',$event)" placeholder="可不填"></div>
                  <div class="fmt-field2"><label>抄送机关</label><input class="fmt-input2" :value="outFmt.cc" @input="fmtInput('cc',$event)" placeholder="多个以逗号分隔"></div>
                </div>
                <div class="fmt-sec2" style="border-bottom:0;">
                  <div class="fmt-sec2-title">版记</div>
                  <div class="fmt-field2"><label>印发机关（送印机关）</label><input class="fmt-input2" :value="outFmt.yinFa" @input="fmtInput('yinFa',$event)"></div>
                  <div class="fmt-field2"><label>印发日期</label><input class="fmt-input2" :value="outFmt.yinFaDate" @input="fmtInput('yinFaDate',$event)"></div>
                </div>
              </div>
            </aside>
          </div>
        </div>

      </div>







      <!-- 弹窗 -->
      <n-modal v-model:show="modal.show" preset="card" :title="modal.title" :style="{maxWidth:modal.wide?'900px':'640px',width:'calc(100vw - 40px)'}" :bordered="false" size="huge" :mask-closable="true">
        <div v-if="modal.progress" class="ext-modal">
          <div class="ext-mhead">
            <div class="ext-mtitle" :class="{done:modal.progress.done}"><span v-if="!modal.progress.done" class="spin"></span><template v-if="!modal.progress.done"> 正在处理…</template><template v-else> ✓ 处理完成</template></div>
            <div class="ext-msub">{{modal.progress.sub}}</div>
          </div>
          <div class="ext-mbar"><i :style="{width:modal.progress.barPct+'%'}"></i></div>
          <div class="ext-mlist">
            <div class="ext-mrow" v-for="(r,i) in modal.progress.rows" :key="i">
              <span class="ext-mic">✓</span>
              <div class="ext-mbody"><div class="ext-mrow-top"><span class="ext-mname">{{r.name}}</span><span v-if="r.src" class="ext-msrc" :class="r.src">{{srcLabel(r.src)}}</span></div><div v-if="r.value" class="ext-mval">{{r.value}}</div></div>
            </div>
          </div>
          <div v-if="modal.progress.nextLabel" class="ext-mfoot"><span>{{modal.progress.stat}}</span><n-button type="primary" :disabled="modal.progress.nextDisabled" @click="modal.progress.onNext && modal.progress.onNext()">{{modal.progress.nextLabel}}</n-button></div>
        </div>
        <div v-else v-html="modal.html"></div>
        <template #footer v-if="!modal.hideFooter && !modal.progress">
          <div style="display:flex;justify-content:flex-end;gap:10px;"><n-button @click="modal.show=false">取消</n-button><n-button type="primary" @click="onModalOk">{{modal.okText}}</n-button></div>
        </template>
      </n-modal>

      <!-- 提示 -->
      <div class="toast" :class="{show:toast.show}">{{toast.msg}}</div>
    </div>
  </n-config-provider>
  `
});
app.use(naive);
app.mount('#app');
</script>
</body>
</html>
