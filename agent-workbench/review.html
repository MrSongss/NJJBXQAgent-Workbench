                             :key="step.n" class="workflow-step"
                             :class="{current:currentStep===step.n,done:currentStep>step.n}">
                          <span class="step-dot">
                            <svg v-if="currentStep>step.n" class="icon" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
                            <template v-else>{{step.n}}</template>
                          </span>
                          <span>{{step.t}}</span>
                        </div>
                      </div>
                    </div>

                    <div v-if="phase==='empty'" class="empty-stage">
                      <div class="welcome-emblem" aria-hidden="true">
                        <svg viewBox="0 0 120 140">
                          <path d="M31 12h42l18 18v82a8 8 0 0 1-8 8H31a8 8 0 0 1-8-8V20a8 8 0 0 1 8-8z"/>
                          <path d="M73 12v18h18"/>
                          <path d="M39 53h36M39 67h29M39 81h22"/>
                          <circle cx="77" cy="94" r="17"/>
                          <path d="m69 94 5 5 11-12"/>
                        </svg>
                        <span class="emblem-scan"></span>
                        <span class="emblem-pulse"></span>
                      </div>
                      <h1 class="welcome-title">政务文稿智能预审</h1>
                      <p class="welcome-desc">从文种识别到合规核验，为政务文稿提供格式规范、行文规则、内容合规三维度的审查依据。</p>
                      <ul class="welcome-dimensions">
                        <li>
                          <svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                          <strong>格式规范校验</strong>
                          <span>标题、主送、序号、落款</span>
                        </li>
                        <li>
                          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
                          <strong>行文规则审查</strong>
                          <span>行文方向、对象规范</span>
                        </li>
                        <li>
                          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                          <strong>内容合规比对</strong>
                          <span>政策口径、涉敏涉密</span>
                        </li>
                      </ul>
                      <div class="quick-start">
                        <div class="quick-start-title">开始一次核查</div>
                        <div class="quick-start-grid">
                          <button class="quick-start-card" @click="openNewTask('upload')">
                            <svg class="qs-ic" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M20 15v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4"/></svg>
                            <b>上传 Word / PDF</b><span>支持 DOC、DOCX、PDF 文稿</span>
                          </button>
                          <button class="quick-start-card" @click="openNewTask('paste')">
                            <svg class="qs-ic" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4a2 2 0 0 1 6 0"/><path d="M9 11h6M9 15h4"/></svg>
                            <b>粘贴文字</b><span>直接粘贴文稿正文核查</span>
                          </button>
                          <button class="quick-start-card" @click="quickStartFromChat">
                            <svg class="qs-ic" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>
                            <b>从当前对话带入</b><span>核查智能体生成的文稿</span>
                          </button>
                          <button class="quick-start-card" @click="quickStartFromKB">
                            <svg class="qs-ic" viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 0 2 2h13"/><path d="M9 7h6"/></svg>
                            <b>从知识库选择</b><span>选择知识库中的文件核查</span>
                          </button>
                        </div>
                      </div>
                    </div>

                    <div v-else-if="phase==='thinking'" class="thinking-stage">
                      <div class="thinking-card">
                        <div class="thinking-title">
                          <div class="thinking-mini-avatar">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M12 3l1.5 4.2L18 9l-4.5 1.8L12 15l-1.5-4.2L6 9l4.5-1.8L12 3z"/></svg>
                          </div>
                          <span>合规审查智能体正在分析</span>
                          <span><i class="thinking-dot"></i> <i class="thinking-dot"></i> <i class="thinking-dot"></i></span>
                        </div>
                        <div class="thinking-row" :class="{active:analysisStage===1,done:analysisStage>1}">① 解析文稿结构与核心要素</div>
                        <div class="thinking-row" :class="{active:analysisStage===2,done:analysisStage>2}">② 匹配“{{task.type}}”文种版式和行文规则</div>
                        <div class="thinking-row" :class="{active:analysisStage===3,done:analysisStage>3}">③ 比对政策法规、制度规则和保密规则</div>
                        <div class="thinking-row" :class="{active:analysisStage===4,done:analysisStage>4}">④ 汇总风险并生成整改指引</div>
                      </div>
                    </div>

                    <div v-else class="result-stage">
                      <div v-if="resultsStale" class="stale-banner">
                        <span>⚠ 已修改 {{pendingChangeCount}} 处，当前结果尚未更新。<b style="margin-left:6px;color:#16704a;font-weight:600">绿色高亮为本轮已采纳文字</b>，处理完成后点击右侧“重新审查”。</span>
                      </div>
                      <div v-if="task.ocrReviewNeeded" class="ocr-notice" style="margin:0 20px 12px">
                        <svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.6 2.7 17a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0z"/></svg>
                        <span>PDF已完成OCR解析，其中 {{task.ocrLowConfidenceCount}} 处内容置信度较低，已标记为“待人工核对”，请结合原文件确认后再采纳建议。</span>
                      </div>
                      <div class="workspace">
                        <section class="document-pane">
                        <div class="pane-toolbar">
                          <div class="doc-meta">
                            <svg class="icon" style="color:#0e4c92" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
                            <span class="doc-name">{{task.name}}</span>
                            <n-select v-if="docTypeGroup(task.type)==='正式公文'" :value="task.type" @update:value="changeTaskDocType" :options="docTypeOptions" size="small" style="width:120px" />
                            <n-tag v-else size="small" :bordered="false">{{task.type}} · 其他政务材料</n-tag>
                          </div>
                        </div>
                        <div class="document-scroll">
                          <article class="paper" contenteditable="true"
                            v-html="renderedDocument"
                            @input="onDocumentInput"
                            @blur="onDocumentBlur($event)"
                            @click="event => { const el=event.target.closest('[data-issue-id]'); if(el){ activeIssueId=el.dataset.issueId; } }">
                          </article>
                        </div>
                        </section>

                        <aside class="issue-pane">
                        <div class="panel-tabs">
                          <button class="panel-tab" :class="{active:activeRightTab==='issues'}" @click="activeRightTab='issues'">问题清单<span class="panel-tab-count">{{task.issues.length}}</span></button>
                          <button class="panel-tab" :class="{active:activeRightTab==='versions'}" @click="activeRightTab='versions'">版本记录<span class="panel-tab-count">{{reviewVersions.length}}</span></button>
                        </div>
                        <template v-if="activeRightTab==='issues'">
                        <div class="issue-summary">
                          <div class="summary-top">
                            <div>
                              <div class="summary-title">审查结果</div>
                              <div class="summary-sub">按建设内容归并为三类审查维度</div>
                            </div>
                            <div style="text-align:right">
                              <div class="summary-count">{{task.issues.length}}</div>
                              <div class="summary-sub">项问题</div>
                            </div>
                          </div>
                          <div class="filter-row">
                            <span class="filter-label">维度</span>
                            <button v-for="item in dimensionOptions" :key="item.value"
                                    class="filter-chip" :class="{active:activeDimension===item.value}"
                                    @click="activeDimension=item.value">{{item.label}}</button>
                          </div>
                          <div class="filter-row">
                            <span class="filter-label">风险</span>
                            <button v-for="item in riskOptions" :key="item.value"
                                    class="filter-chip" :class="{active:activeRisk===item.value}"
                                    @click="activeRisk=item.value">{{item.label}}</button>
                          </div>
                        </div>

                        <div class="issue-actions">
                          <n-button size="small" @click="acceptAll" :disabled="pendingCount===0">全部采纳</n-button>
                          <n-button size="small" @click="ignoreAll" :disabled="pendingCount===0">全部忽略</n-button>
                          <span class="action-spacer"></span>
                          <n-button size="small" :type="pendingChangeCount>0?'warning':'default'" :disabled="pendingChangeCount===0" @click="recheckCurrentTask">{{pendingChangeCount>0?'重新审查 · '+pendingChangeCount+'处修改':'重新审查'}}</n-button>
                          <n-button size="small" type="primary" :disabled="resultsStale" @click="generateResult">生成闭环审查报告</n-button>
                        </div>

                        <div v-if="recheckSummary && !resultsStale" class="recheck-inline-summary">
                          <span><b>{{recheckSummary.fixed}}</b>已解决</span>
                          <span><b>{{recheckSummary.remaining}}</b>仍需处理</span>
                          <span><b>{{recheckSummary.newIssues}}</b>新增问题</span>
                        </div>

                        <div class="issue-scroll">
                          <article v-for="issue in visibleIssues" :key="issue.id"
                                   class="issue-card" :class="{active:activeIssueId===issue.id,resolved:issue.status!=='pending',accepted:issue.status==='accepted'}"
                                   @click="focusIssue(issue)">
                            <div class="issue-card-head">
                              <i class="risk-dot" :class="issue.risk"></i>
                              <span class="issue-title">{{issue.title}}</span>
                              <n-tag size="tiny" :type="issue.risk==='high'?'error':issue.risk==='medium'?'warning':'info'" :bordered="false">{{riskLabel(issue.risk)}}</n-tag>
                              <span class="issue-pos">{{issue.position}}</span>
                            </div>
                            <div class="issue-line">
                              <span class="line-label">原文</span>
                              <span class="original">{{issue.original}}</span>
                            </div>
                            <div class="issue-line">
                              <span class="line-label">建议</span>
                              <span class="suggestion">{{issue.suggestion}}</span>
                            </div>
                            <div class="basis-box">
                              <template v-if="issue.isPolicyBasis">
                                <b style="color:#445b70;font-weight:600">政策依据</b>
                                <div class="policy-basis-grid">
                                  <span class="policy-basis-item"><b>文件名称：</b>{{issue.basisFile || '—'}}</span>
                                  <span class="policy-basis-item"><b>发布机关：</b>{{issue.basisAgency || '—'}}</span>
                                  <span class="policy-basis-item"><b>具体条款：</b>{{issue.basisClause || '—'}}</span>
                                  <span class="policy-basis-item"><b>最后同步时间：</b>{{issue.basisSyncedAt || '—'}}</span>
                                </div>
                              </template>
                              <template v-else>
                                <b style="color:#445b70;font-weight:600">审查依据：</b>{{issue.basis}}
                                <span class="basis-source">来源：{{issue.basisSource || '平台合规规则库'}} · {{issue.basisUpdatedAt || ''}} · 位置：{{issue.position}}</span>
                              </template>
                            </div>
                            <div class="card-foot">
                              <span v-if="issue.status==='accepted'" class="status-text accepted">✓ 已采纳并修改正文</span>
                              <span v-else-if="issue.status==='ignored'" class="status-text ignored">— 已忽略</span>
                              <span v-else class="status-text" style="color:#98a2b3">待处理</span>
                              <span v-if="issue.status==='accepted' && issue.appliedAt" class="issue-applied-meta">{{issue.appliedBy}} · {{issue.appliedAt}}</span>
                              <div @click.stop>
                                <template v-if="issue.status==='pending'">
                                  <n-button text size="tiny" style="margin-right:12px" @click="ignoreIssue(issue)">忽略</n-button>
                                  <n-button text type="primary" size="tiny" @click="acceptIssue(issue)">采纳修改</n-button>
                                </template>
                                <n-button v-else text size="tiny" @click="undoIssue(issue)">撤销处理</n-button>
                              </div>
                            </div>
                          </article>
                          <div v-if="visibleIssues.length===0" class="empty-issues">当前筛选条件下暂无问题</div>
                        </div>
                        </template>

                        <div v-else class="version-pane">
                          <div class="version-intro">每次完成审查或重新审查生成一个版本。修改过程先作为工作稿保存，不会因每次输入产生大量零散版本。</div>
                          <div v-if="reviewVersions.length">
                            <article v-for="version in reviewVersions" :key="version.key" class="version-card" :class="{active:selectedVersionKey===version.key}" @click="selectedVersionKey=version.key">
                              <div class="version-head">
                                <span class="version-name">{{version.version}} · {{version.action}}</span>
                                <span class="version-time">{{version.time}}</span>
                              </div>
                              <div class="version-meta">{{version.operator}} · {{version.docType}}<span v-if="version.changeCount"> · 修改 {{version.changeCount}} 处</span></div>
                              <div class="version-kpis">
                                <span>{{version.total}}项问题</span>
                                <span v-if="version.fixed" class="fixed">解决{{version.fixed}}项</span>
                                <span v-if="version.remaining">遗留{{version.remaining}}项</span>
                                <span v-if="version.newIssues" class="new">新增{{version.newIssues}}项</span>
                              </div>
                              <div style="display:flex;justify-content:flex-end;margin-top:7px">
                                <n-button text type="primary" size="tiny" @click.stop="viewVersionReport(version)">查看本版本报告</n-button>
                              </div>
                              <div v-if="selectedVersionKey===version.key" class="version-changes">
                                <div v-if="version.changes && version.changes.length">
                                  <div v-for="change in version.changes" :key="change.key" class="version-change">
                                    <div class="version-change-title">{{change.field}} · {{change.position}} · {{change.source}}</div>
                                    <div class="version-change-before">修改前：{{change.before && change.before.length>120 ? change.before.slice(0,120)+'…' : change.before}}</div>
                                    <div class="version-change-after">修改后：{{change.after && change.after.length>120 ? change.after.slice(0,120)+'…' : change.after}}</div>
                                  </div>
                                </div>
                                <div v-else style="color:#98a2b3;font-size:10.5px">首次审查基线，无上一版本修改内容。</div>
                              </div>
                            </article>
                          </div>
                          <div v-else class="version-empty">完成首次审查后，这里会展示版本记录。</div>
                        </div>
                        </aside>
                      </div>
                    </div>
                  </section>

                  <section v-else class="record-page">
                    <div class="record-head">
                      <div style="display:flex;align-items:center;gap:12px">
                        <n-button text style="font-size:13px;color:var(--ai-blue);padding:0" @click="view='review'">
                          <svg class="icon" viewBox="0 0 24 24" style="margin-right:2px"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                          返回
                        </n-button>
                        <div>
                          <h1 class="page-title">审查记录</h1>
                          <div class="page-desc">查看已生成的审查报告、问题清单、审查版本和操作记录</div>
                        </div>
                      </div>
                    </div>
                    <div class="record-card">
                      <div class="record-filter">
                        <n-select v-model:value="recordType" :options="[{label:'全部文种',value:'全部文种'}].concat(docTypes.map(t=>({label:t,value:t})))" style="width:150px" />
                        <n-input v-model:value="recordKeyword" clearable placeholder="搜索文稿名称" style="width:280px">
                          <template #prefix>
                            <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
                          </template>
                        </n-input>
                      </div>
                      <div v-if="filteredReviewGroups.length" class="record-group-list">
                        <article v-for="draft in filteredReviewGroups" :key="draft.id" class="record-group">
                          <div class="record-group-main">
                            <div class="record-group-title">{{draft.name}}</div>
                            <div class="record-group-meta">
                              <span>{{draft.type}}</span>
                              <span>{{(draft.reviewVersions && draft.reviewVersions.length) || 1}}个审查版本</span>
                              <span>最近更新：{{draft.updatedAt || draft.createdAt}}</span>
                              <span>{{draft.status==='done'?'已完成':draft.status==='progress'?'审查中':'草稿'}}</span>
                            </div>
                          </div>
                          <n-button size="small" type="primary" ghost @click="openDraftVersions(draft)">查看版本与修改</n-button>
                        </article>
                      </div>
                      <div v-else class="version-empty">没有符合条件的审查记录</div>
                    </div>
                  </section>
                </main>
              </div>
            </div>

            <n-modal v-model:show="showNewTask" preset="card" title="新建合规审查" style="width:760px" :mask-closable="false">
              <n-tabs v-model:value="sourceMode" type="segment" animated>
                <n-tab-pane name="upload" tab="上传文稿">
                  <h3 class="modal-section-title">选择待审文件</h3>
                  <n-upload :default-upload="false" :max="1" accept=".doc,.docx,.pdf" @change="handleUploadChange">
                    <n-upload-dragger>
                      <div style="padding:14px 0 10px;color:#0e4c92">
                        <svg class="icon" style="width:34px;height:34px" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M20 15v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4"/></svg>
                      </div>
                      <n-text style="font-size:14px">点击或拖拽上传DOC、DOCX、PDF文件</n-text>
                    </n-upload-dragger>
                  </n-upload>
                  <div class="upload-note">原型演示中，上传任意支持格式的文件后将载入示例正文；正式系统由文件解析服务读取原文和版式。</div>
                </n-tab-pane>
                <n-tab-pane name="paste" tab="粘贴文本">
                  <h3 class="modal-section-title">粘贴待审正文</h3>
                  <n-input v-model:value="pasteText" type="textarea" :autosize="{minRows:8,maxRows:12}" placeholder="请粘贴正式公文或其他政务材料正文…" />
                </n-tab-pane>
              </n-tabs>

              <div v-if="hasInput" class="recognition-strip">
                <div class="recognition-main">
                  <div class="recognition-summary">
                    <span style="color:#7c8b9b">已自动识别</span>
                    <b>{{selectedDocType}}</b>
                    <span class="recognition-chip">{{docTypeGroup(selectedDocType)}}</span>
                    <span class="recognition-chip">{{reviewParams.issuer}}</span>
                    <span class="recognition-chip">{{reviewParams.usage}}</span>
                  </div>
                  <n-button text type="primary" size="small" @click="showRecognitionEdit=!showRecognitionEdit">{{showRecognitionEdit?'收起':'识别有误，修改'}}</n-button>
                </div>
                <div v-if="showRecognitionEdit" class="recognition-edit">
                  <n-grid :cols="3" :x-gap="12" :y-gap="10">
                    <n-gi><label>正式公文文种</label><n-select v-model:value="selectedDocType" :options="docTypeOptions" size="small" /></n-gi>
                    <n-gi><label>发文机关</label><n-input v-model:value="reviewParams.issuer" size="small" /></n-gi>
                    <n-gi><label>使用范围</label><n-select v-model:value="reviewParams.usage" size="small" :options="[{label:'内部使用',value:'内部使用'},{label:'公开发布',value:'公开发布'}]" /></n-gi>
                  </n-grid>
                  <div style="margin-top:8px;color:#8a97a6;font-size:10.5px">所属组织、主送机关、行文方向、核查范围和提交信息由系统自动获取，无需填写。</div>
                </div>
              </div>

              <div v-if="hasInput && ocrReviewNeeded" class="ocr-notice">
                <svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.6 2.7 17a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0z"/></svg>
                <span>检测到PDF文稿，系统将自动执行OCR解析；低置信度内容会标记为“待人工核对”，不影响继续审查。</span>
              </div>

              <template #footer>
                <div style="display:flex;justify-content:flex-end;gap:10px">
                  <n-button @click="showNewTask=false">取消</n-button>
                  <n-button type="primary" @click="startTask">开始合规审查</n-button>
                </div>
              </template>
            </n-modal>

            <n-modal v-model:show="showReport" preset="card" :title="selectedRecord && selectedRecord.reportMode==='version'?'版本审查报告':'闭环审查报告已生成'" style="width:1080px;max-height:88vh" :mask-closable="false">
              <n-scrollbar style="max-height:66vh" v-if="selectedRecord">
                <div class="report-hero">
                  <h3>{{selectedRecord.name}}</h3>
                  <p>{{selectedRecord.reportTitle || '闭环审查报告'}} · {{selectedRecord.version}} · {{selectedRecord.time}} · 操作人：{{selectedRecord.operator}}</p>
                </div>
                <div class="report-kpis">
                  <div class="report-kpi"><b>{{selectedRecord.initialTotal || 0}}</b><span>{{selectedRecord.reportMode==='version'?'本版本问题':'初审发现'}}</span></div>
                  <div class="report-kpi"><b style="color:#43a047">{{selectedRecord.fixed || 0}}</b><span>{{selectedRecord.reportMode==='version'?'本轮已解决':'已整改'}}</span></div>
                  <div class="report-kpi"><b style="color:#d9534f">{{selectedRecord.remaining || 0}}</b><span>复审遗留</span></div>
                  <div class="report-kpi"><b style="color:#f0ad4e">{{selectedRecord.newIssues || 0}}</b><span>复审新增</span></div>
                </div>
                <div style="padding:11px 13px;border:1px solid #dce8e1;border-radius:9px;background:#f5fbf7;color:#486657;font-size:12px">{{selectedRecord.reportMode==='version'?'本版本结论':'最终结论'}}：<b style="color:#16704a;font-weight:600">{{selectedRecord.conclusion || '待确认'}}</b><span style="margin-left:10px;color:#809087">{{selectedRecord.reportMode==='version'?'仅反映该版本冻结时点的审查结果':'完整保留初审问题、整改内容和复审结果'}}</span></div>
                <div v-if="selectedRecord.ocrReviewNeeded" class="ocr-notice" style="margin-top:14px">
                  <svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.6 2.7 17a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0z"/></svg>
                  <span>本次PDF解析存在 {{selectedRecord.ocrLowConfidenceCount}} 处OCR低置信度内容，请结合原文件人工核对。</span>
                </div>
                <div class="report-section">
                  <div class="report-section-head"><h4>{{selectedRecord.reportMode==='version'?'本版本问题明细':'整改闭环明细'}}</h4><span>{{selectedRecord.reportMode==='version'?'展示该版本冻结的问题清单':'逐项展示初审问题和复审结论'}}</span></div>
                <table class="report-table">
                  <thead><tr><th>问题</th><th>原文</th><th>修改建议</th><th>修改后文字</th><th>处理方式</th><th>审查结果</th></tr></thead>
                  <tbody>
                    <tr v-for="item in (selectedRecord.closureItems || [])" :key="item.key">
                      <td>{{item.issue.title}}<div style="margin-top:3px;color:#98a2b3;font-size:10px">{{item.issue.position}}</div></td>
                      <td>{{item.original}}</td>
                      <td>{{item.suggestion}}</td>
                      <td style="color:#16704a">{{item.modified}}</td>
                      <td>{{item.handling}}</td>
                      <td><span :style="{color:item.recheckResult==='复审通过'?'#16704a':item.recheckResult==='复审新增'?'#d9534f':'#8a5b18'}">{{item.recheckResult}}</span></td>
                    </tr>
                    <tr v-if="(selectedRecord.closureItems || []).length===0"><td colspan="6" :style="{padding:'22px',textAlign:'center',color:(selectedRecord.initialTotal || 0)>0?'#7b8794':'#16704a'}">{{(selectedRecord.initialTotal || 0)>0?'该历史记录未保存逐项问题明细，请以原始归档报告为准':'✓ 本版本未检出问题，审查通过'}}</td></tr>
                  </tbody>
                </table>
                </div>
                <div class="report-section">
                  <div class="report-section-head"><h4>审查依据</h4><span>仅展示可获取的必要来源信息</span></div>
                  <div class="report-basis-list">
                    <div v-for="(item,index) in (selectedRecord.closureItems || [])" :key="'basis-'+item.key" class="report-basis-row">
                      <div style="margin-bottom:5px;color:#31506d;font-weight:600">{{index+1}}. {{item.issue.title}}</div>
                      <div class="report-basis-meta">
                        <span><b>文件名称：</b>{{item.issue.basisFile || item.issue.basisSource || '平台合规规则库'}}</span>
                        <span><b>发布机关：</b>{{item.issue.basisAgency || '—'}}</span>
                        <span><b>具体条款：</b>{{item.issue.basisClause || item.issue.basis || '—'}}</span>
                        <span><b>最后同步时间：</b>{{item.issue.basisSyncedAt || item.issue.basisUpdatedAt || '—'}}</span>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="report-section">
                  <div class="report-section-head"><h4>遗留修订建议</h4><span>仅展示仍需处理的问题</span></div>
                  <div class="report-suggestion-list">
                    <div v-for="(item,index) in (selectedRecord.closureItems || []).filter(row=>row.recheckResult!=='复审通过')" :key="'suggestion-'+item.key" class="report-suggestion-row">
                      <strong>{{index+1}}. {{item.issue.position || '位置待确认'}}</strong>{{item.suggestion}}
                    </div>
                    <div v-if="(selectedRecord.closureItems || []).length>0 && (selectedRecord.closureItems || []).every(row=>row.recheckResult==='复审通过')" class="report-suggestion-row" style="color:#16704a">✓ 初审问题已全部整改并通过复审，无遗留修订建议。</div>
                    <div v-else-if="(selectedRecord.closureItems || []).length===0 && (selectedRecord.initialTotal || 0)>0" class="report-suggestion-row" style="color:#7b8794">该历史记录未保存逐项修订建议。</div>
                    <div v-else-if="(selectedRecord.closureItems || []).length===0" class="report-suggestion-row" style="color:#16704a">✓ 本版本未检出问题，无修订建议。</div>
                  </div>
                </div>
                <div style="margin-top:15px;color:#7b8794;font-size:11px">说明：{{selectedRecord.reportMode==='version'?'本报告仅反映该版本冻结时点的审查结果，可与其他版本报告分别查看。':'本报告完整记录初审问题、整改内容和复审结果，供文稿定稿及审查留痕使用。'}}</div>
              </n-scrollbar>
              <template #footer>
                <div style="display:flex;justify-content:space-between;align-items:center">
                  <n-button text type="primary" @click="showReport=false;view='records'">查看审查记录</n-button>
                  <div style="display:flex;gap:10px">
                    <n-button @click="printReport(selectedRecord)">打印</n-button>
                    <n-button @click="downloadDocument(selectedRecord)">导出文件</n-button>
                    <n-button type="primary" @click="downloadAll(selectedRecord);showReport=false">{{selectedRecord.reportMode==='version'?'下载本版本报告与明细':'下载闭环报告与整改明细'}}</n-button>
                  </div>
                </div>
              </template>
            </n-modal>

            <n-modal v-model:show="showRecheckResult" preset="card" title="复审比对结果" style="width:680px">
              <template v-if="recheckSummary">
                <div class="report-hero" style="background:linear-gradient(135deg,#0e4c92,#13a8a8)">
                  <h3>修改前后内容自动比对</h3>
                  <p>系统已自动比对待审文本修改前后的内容差异，验证整改情况</p>
                </div>
                <div class="report-kpis" style="margin-top:16px">
                  <div class="report-kpi"><b style="color:#667085">{{recheckSummary.prevTotal}}</b><span>修改前问题数</span></div>
                  <div class="report-kpi"><b style="color:#43a047">{{recheckSummary.fixed}}</b><span>已整改</span></div>
                  <div class="report-kpi"><b style="color:#f0ad4e">{{recheckSummary.remaining}}</b><span>遗留问题</span></div>
                  <div class="report-kpi"><b style="color:#d9534f">{{recheckSummary.newIssues}}</b><span>新增问题</span></div>
                  <div class="report-kpi" v-if="recheckSummary.stillIgnored > 0"><b style="color:#8895a7">{{recheckSummary.stillIgnored}}</b><span>已忽略</span></div>
                </div>
                <div style="margin-top:16px;padding:14px 16px;border-radius:10px;background:#f6f9fc;border:1px solid #e8edf3;font-size:13px;color:#445b70;line-height:1.8">
                  <p style="margin:0 0 6px"><b>整改验证结论：</b></p>
                  <p style="margin:0" v-if="recheckSummary.fixed > 0 && recheckSummary.remaining === 0 && recheckSummary.newIssues === 0">
                    <span style="color:#43a047">✓ 全部问题已整改完毕{{recheckSummary.stillIgnored > 0 ? '，' + recheckSummary.stillIgnored + ' 项已忽略问题不再提示' : ''}}，审查通过。</span>
                  </p>
                  <p style="margin:0" v-else>
                    <span style="color:#f0ad4e">仍有 {{recheckSummary.remaining}} 项遗留问题需处理{{recheckSummary.newIssues > 0 ? '，新增 ' + recheckSummary.newIssues + ' 项问题' : ''}}{{recheckSummary.stillIgnored > 0 ? '，' + recheckSummary.stillIgnored + ' 项已忽略问题不再处理' : ''}}，请继续整改后再次复审。</span>
                  </p>
                </div>
              </template>
              <template #footer>
                <div style="display:flex;justify-content:flex-end">
                  <n-button type="primary" @click="showRecheckResult=false">确认</n-button>
                </div>
              </template>
            </n-modal>

            <n-modal v-model:show="showRecordDetail" preset="card" title="审查记录详情" style="width:820px">
              <template v-if="selectedRecord">
                <div class="report-hero">
                  <h3>{{selectedRecord.name}}</h3>
                  <p>{{selectedRecord.type}} · {{selectedRecord.version}} · {{selectedRecord.time}} · {{selectedRecord.operator}}</p>
                </div>
                <n-grid :cols="2" :x-gap="18" style="margin-top:16px">
                  <n-gi>
                    <h3 class="modal-section-title">结果概览</h3>
                    <div class="report-kpis" style="grid-template-columns:repeat(4,1fr)">
                      <div class="report-kpi"><b>{{selectedRecord.initialTotal || 0}}</b><span>初审发现</span></div>
                      <div class="report-kpi"><b style="color:#43a047">{{selectedRecord.fixed || 0}}</b><span>已整改</span></div>
                      <div class="report-kpi"><b style="color:#d9534f">{{selectedRecord.remaining || 0}}</b><span>复审遗留</span></div>
                      <div class="report-kpi"><b style="color:#f0ad4e">{{selectedRecord.newIssues || 0}}</b><span>复审新增</span></div>
                    </div>
                    <div style="margin-top:10px;padding:9px 11px;border-radius:8px;background:#f5fbf7;color:#486657;font-size:12px">结论：<b style="color:#16704a">{{selectedRecord.conclusion}}</b></div>
                  </n-gi>
                  <n-gi>
                    <h3 class="modal-section-title">操作记录</h3>
                    <ul class="log-list">
                      <li v-for="(log,index) in selectedRecord.logs" :key="index"><b style="color:#344a62">{{log.time}}</b>　{{log.action}}</li>
                    </ul>
                  </n-gi>
                </n-grid>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px">
                  <div>
                    <n-tag v-if="selectedRecord.archived" type="success" size="small" round>已归档</n-tag>
                    <n-tag v-else type="warning" size="small" round>待导出</n-tag>
                  </div>
                  <div style="display:flex;gap:10px">
                    <n-button @click="openRecordReport(selectedRecord);showRecordDetail=false">查看报告</n-button>
                    <n-button @click="downloadDocument(selectedRecord)">导出文件</n-button>
                    <n-button type="primary" @click="downloadAll(selectedRecord);showRecordDetail=false">下载闭环报告与整改明细</n-button>
                  </div>
                </div>
              </template>
            </n-modal>
          </n-message-provider>
        </n-config-provider>
      `
    });

    app.use(naive);
    app.mount("#app");
  </script>
</body>
</html>
