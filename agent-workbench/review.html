<!doctype html>
<!-- 重构版本：采用问题整改后直接生成报告、问题清单和留痕记录的自动闭环。 -->
<!--
  业务场景：南京江北新区政务 AI 智能体平台—辅助文本合规审查
  端类型：PC 端（Vue 3 + Naive UI）
  研发对接说明：
  1. 将 Vue 3、Naive UI CDN 引入替换为 npm 包并接入 Vite。
  2. 将 setup() 业务逻辑和 template 拆分为 .vue 单文件组件。
  3. themeOverrides、CSS 变量、动效与数据结构可原样保留。
  4. 文件解析、文种识别、合规审查、规则依据、报告生成和审查记录由后端接口替换当前演示逻辑。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>辅助文本合规审查 - 江北新区政务AI智能体平台</title>
  <style>
    :root {
      --ai-navy: #0a3573;
      --ai-blue: #0e4c92;
      --ai-cyan: #13a8a8;
      --ai-green: #43a047;
      --ai-lime: #9ccc65;
      --page-bg: #f4f6f9;
      --panel: #ffffff;
      --text: #333639;
      --muted: #667085;
      --line: #e4eaf1;
      --soft-blue: #edf5fc;
      --soft-cyan: #eaf8f7;
      --soft-green: #edf8ee;
      --soft-amber: #fff8e9;
      --soft-red: #fff1f0;
      --shadow: 0 10px 32px rgba(24, 54, 91, 0.08);
      --ai-glow: 0 0 16px rgba(19, 168, 168, 0.28);
    }

    * { box-sizing: border-box; }
    html, body, #app { width: 100%; height: 100%; }
    #app { display: flex; flex-direction: column; }
    #app > .n-config-provider { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--page-bg);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }
    button, input, textarea, select { font: inherit; }
    .icon {
      width: 1em;
      height: 1em;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: -0.125em;
    }

    .app-shell { flex: 1; min-height: 0; height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .topbar {
      height: 64px;
      flex: 0 0 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      background:
        radial-gradient(circle at 82% -90%, rgba(156, 204, 101, 0.45), transparent 35%),
        linear-gradient(90deg, var(--ai-navy), var(--ai-blue) 60%, var(--ai-cyan));
      box-shadow: 0 4px 18px rgba(10, 53, 115, 0.2);
      position: relative;
      z-index: 20;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      color: #fff;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: var(--ai-glow);
      backdrop-filter: blur(10px);
    }
    .brand-title { font-size: 18px; font-weight: 600; letter-spacing: -.2px; }
    .brand-sub { margin-top: 2px; font-size: 11px; opacity: .78; }
    .top-user { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .top-user-meta { text-align: right; }
    .top-user-meta small { display: block; margin-top: 2px; opacity: .7; }
    .user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 600;
      background: rgba(255,255,255,.16);
      border: 1px solid rgba(255,255,255,.24);
    }

    .body-shell { flex: 1; min-height: 0; height: 0; overflow: hidden; display: grid; grid-template-columns: 300px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
    .sidebar { width: 300px; min-height: 0; background: #fafbfc; border-right: 1px solid var(--line); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; transition: width 0.3s ease; position: relative; }
    .sidebar.collapsed { width: 56px; }
    .sidebar-header { padding: 20px 16px 16px; flex-shrink: 0; background: linear-gradient(90deg, #0A3573, #0E4C92 60%, #13A8A8); border-bottom: none; box-shadow: 0 4px 20px rgba(10,53,115,0.18); }
    .sidebar.collapsed .sidebar-header { padding: 20px 8px 16px; }
    .sidebar-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .sidebar-logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.1)); border: 1px solid rgba(255,255,255,0.3); box-shadow: var(--ai-glow); color: #fff; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-weight: bold; font-size: 16px; flex-shrink: 0; }
    .sidebar-logo-icon .ic-svg { width: 58%; height: 58%; stroke: #fff; fill: none; stroke-width: 2; }
    .sidebar-logo-text { font-size: 15px; font-weight: 600; color: #fff; white-space: nowrap; }
    .sidebar.collapsed .sidebar-logo-text { display: none; }
    .sidebar.collapsed .sidebar-logo { justify-content: center; }
    .new-meeting-btn { width: 100%; padding: 10px 12px; background: var(--ai-blue); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background .2s; white-space: nowrap; overflow: hidden; }
    .new-meeting-btn:hover { background: var(--ai-cyan); }
    .sidebar.collapsed .new-meeting-btn { padding: 10px 0; }
    .sidebar.collapsed .new-meeting-btn .btn-text { display: none; }
    .filter-box { padding: 12px 16px; flex-shrink: 0; border-bottom: 1px solid #eaeef3; display: flex; flex-direction: column; gap: 8px; }
    .sidebar.collapsed .filter-box { display: none; }
    .search-wrap { position: relative; }
    .search-input { width: 100%; padding: 7px 12px 7px 30px; border: 1px solid var(--line); border-radius: 4px; font-size: 13px; color: var(--text); background: #fff; transition: border-color .2s; }
    .search-input:focus { outline: none; border-color: var(--ai-blue); }
    .search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: #98a2b3; font-size: 13px; pointer-events: none; }
    .search-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: #98a2b3; cursor: pointer; font-size: 14px; display: none; }

    .time-filter-row { display: flex; gap: 4px; flex-wrap: wrap; }
    .time-chip { padding: 3px 9px; font-size: 12px; color: #667085; background: #fff; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; transition: all .15s; white-space: nowrap; }
    .time-chip:hover { border-color: var(--ai-blue); color: var(--ai-blue); }
    .time-chip.active { background: var(--ai-blue); color: #fff; border-color: var(--ai-blue); }
    .custom-range { display: none; flex-direction: column; gap: 6px; }
    .custom-range.show { display: flex; }
    .custom-range-label { font-size: 11px; color: #98a2b3; }
    .custom-range-inputs { display: flex; align-items: center; gap: 4px; }
    .custom-range-inputs input { flex: 1; min-width: 0; padding: 5px 6px; border: 1px solid var(--line); border-radius: 4px; font-size: 12px; color: var(--text); }
    .custom-range-inputs input:focus { outline: none; border-color: var(--ai-blue); }
    .custom-range-sep { color: #98a2b3; font-size: 12px; }
    .history-section { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 8px; }
    .history-section::-webkit-scrollbar { width: 5px; }
    .history-section::-webkit-scrollbar-track { background: transparent; }
    .history-section::-webkit-scrollbar-thumb { background: #c8d2de; border-radius: 3px; }
    .history-section::-webkit-scrollbar-thumb:hover { background: #a0aec0; }
    .all-records-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: calc(100% - 16px); height: 34px; margin: 8px; border: 1px solid #dbe5ed; border-radius: 9px; color: #41627f; background: #f8fafc; font-size: 11px; cursor: pointer; transition: all .18s ease; }
    .all-records-btn:hover { color: var(--ai-blue); border-color: #a9c9df; background: var(--soft-blue); }
    .all-records-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .history-title { padding: 12px 8px 6px; font-size: 12px; color: #98a2b3; font-weight: 500; display: flex; align-items: center; justify-content: space-between; }
    .sidebar.collapsed .history-title, .sidebar.collapsed .history-list, .sidebar.collapsed .history-empty { display: none; }
    .history-list { padding-bottom: 8px; }
    .history-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; transition: .25s ease; position: relative; }
    .history-item:hover { background: #eef2f7; transform: translateX(2px); }
    .history-item.active { background: linear-gradient(135deg, var(--ai-blue), var(--ai-cyan)); box-shadow: 0 8px 20px rgba(14,76,146,0.25), var(--ai-glow); }
    .history-item.active .history-item-title { color: #fff; font-weight: 600; }
    .history-item.active .history-item-meta { color: rgba(255,255,255,.8); }
    .history-item.active .history-tag { color: rgba(255,255,255,.9) !important; background: rgba(255,255,255,.2) !important; }
    .history-item.active .history-status { color: #fff !important; background: rgba(255,255,255,.2) !important; }
    .history-item-title { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
    .history-item-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11px; color: #98a2b3; }
    .history-tag { padding: 1px 6px; border-radius: 8px; font-size: 10px; background: #f0f5ff; color: var(--ai-blue); }
    .history-status { padding: 1px 6px; border-radius: 8px; font-size: 10px; }
    .history-status.done { background: #f6ffed; color: #43a047; }
    .history-status.draft { background: #f0f5ff; color: var(--ai-blue); }
    .history-status.progress { background: #fff7e6; color: #f0ad4e; }
    .history-time { font-size: 11px; color: #98a2b3; margin-left: auto; }
    .history-empty { padding: 20px 8px; text-align: center; font-size: 12px; color: #98a2b3; }
    .sidebar-footer { padding: 10px 12px; flex-shrink: 0; border-top: 1px solid #eaeef3; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #667085; }
    .user-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--ai-blue); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
    .sidebar.collapsed .user-info { display: none; }
    .user-name { font-weight: 500; color: var(--text); }
    .user-dept { font-size: 10px; color: #98a2b3; }

    .main-view { min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
    .review-view { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .page-head {
      flex: 0 0 auto;
      padding: 14px 22px 10px;
      background: rgba(255,255,255,.92);
      border-bottom: 1px solid var(--line);
    }
    .page-head.compact { padding: 10px 22px; }
    .page-head.compact .workflow { margin-top: 0; }
    .page-head-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .page-title { margin: 0; color: #173454; font-size: 20px; font-weight: 600; letter-spacing: -.3px; }
    .page-desc { margin-top: 4px; color: var(--muted); font-size: 12px; }

    .workflow {
      margin-top: 12px;
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      white-space: nowrap;
    }
    .workflow-step { position: relative; display: flex; align-items: center; color: #98a2b3; font-size: 12px; }
    .workflow-step:not(:last-child)::after {
      content: "";
      height: 1px;
      flex: 1;
      margin: 0 10px;
      background: #d9e2ec;
    }
    .workflow-step.done:not(:last-child)::after,
    .workflow-step.current:not(:last-child)::after { background: linear-gradient(90deg, var(--ai-cyan), #b9dce1); }
    .step-dot {
      width: 26px;
      height: 26px;
      margin-right: 7px;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      flex: 0 0 26px;
      color: #7b8794;
      background: #edf1f5;
      border: 1px solid #dde5ed;
      font-size: 11px;
      font-weight: 600;
    }
    .workflow-step.current { color: var(--ai-blue); font-weight: 600; }
    .workflow-step.current .step-dot {
      color: #fff;
      background: var(--ai-blue);
      border-color: var(--ai-blue);
      box-shadow: 0 0 0 4px rgba(14,76,146,.1);
    }
    .workflow-step.done { color: var(--ai-cyan); }
    .workflow-step.done .step-dot { color: #fff; background: var(--ai-cyan); border-color: var(--ai-cyan); }

    .empty-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 32px;
      background: var(--page-bg);
    }
    .welcome-emblem {
      position: relative;
      width: 132px;
      height: 148px;
      display: grid;
      place-items: center;
      color: var(--ai-blue);
    }
    .welcome-emblem::before {
      content: "";
      position: absolute;
      inset: 8px 0 0;
      border: 1px solid rgba(14,76,146,.12);
      border-radius: 50%;
      transform: scaleX(.8);
    }
    .welcome-emblem svg {
      position: relative;
      z-index: 1;
      width: 104px;
      height: 120px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 10px 12px rgba(14,76,146,.12));
    }
    .emblem-scan {
      position: absolute;
      z-index: 2;
      left: 29px;
      right: 29px;
      top: 47px;
      height: 1px;
      background: var(--ai-cyan);
      box-shadow: 0 0 10px rgba(19,168,168,.7);
      animation: documentScan 3.6s ease-in-out infinite;
    }
    .emblem-pulse {
      position: absolute;
      z-index: 3;
      right: 14px;
      bottom: 26px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid var(--ai-cyan);
      box-shadow: 0 0 0 5px rgba(19,168,168,.1);
      animation: sealPulse 2.4s ease-in-out infinite;
    }
    .emblem-pulse::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 3px;
      width: 5px;
      height: 8px;
      border: solid var(--ai-cyan);
      border-width: 0 1.5px 1.5px 0;
      transform: rotate(45deg);
    }
    @keyframes documentScan {
      0%, 100% { transform: translateY(-20px); opacity: .25; }
      50% { transform: translateY(58px); opacity: 1; }
    }
    @keyframes sealPulse {
      0%, 100% { box-shadow: 0 0 0 5px rgba(19,168,168,.1); }
      50% { box-shadow: 0 0 0 9px rgba(19,168,168,.03); }
    }
    @media (prefers-reduced-motion: reduce) {
      .emblem-scan, .emblem-pulse { animation: none; }
    }
    .welcome-title {
      margin: 4px 0 0;
      color: #173454;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .welcome-desc {
      width: min(100%, 480px);
      margin: 0;
      color: #7d8b9d;
      font-size: 14px;
      line-height: 1.8;
      text-align: center;
      overflow-wrap: anywhere;
    }
    .welcome-dimensions {
      display: flex;
      align-items: stretch;
      gap: 0;
      margin-top: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .welcome-dimensions li {
      list-style: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-width: 96px;
      padding: 4px 18px;
      color: #5b6b7e;
      font-size: 12px;
      text-align: center;
    }
    .welcome-dimensions li + li { border-left: 1px solid #e3e9f0; }
    .recognition-strip { margin-top: 12px; padding: 12px 14px; border: 1px solid #dbe7f0; border-radius: 10px; background: #f8fbfd; }
    .recognition-main { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .recognition-summary { display: flex; align-items: center; gap: 8px; min-width: 0; color: #3e5368; font-size: 12px; }
    .recognition-summary b { color: #173b5f; font-size: 13px; font-weight: 600; }
    .recognition-chip { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border: 1px solid #d9e6ef; border-radius: 999px; color: #597087; background: #fff; font-size: 10.5px; white-space: nowrap; }
    .recognition-edit { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #dbe5ed; }
    .recognition-edit label { display: block; margin-bottom: 5px; color: #75869a; font-size: 11px; }
    .ocr-notice { display: flex; align-items: flex-start; gap: 9px; margin-top: 12px; padding: 10px 12px; border: 1px solid #f0d7a9; border-radius: 9px; color: #765525; background: #fffaf0; font-size: 11px; line-height: 1.6; }
    .ocr-notice svg { flex: 0 0 auto; width: 16px; height: 16px; margin-top: 1px; fill: none; stroke: #d08b22; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .basis-source { display: block; margin-top: 5px; font-size: 10.5px; color: #98a2b3; }
    .policy-basis-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; margin-top: 7px; padding-top: 7px; border-top: 1px dashed #e4eaf0; }
    .policy-basis-item { min-width: 0; color: #6f7f90; font-size: 10.5px; line-height: 1.5; }
    .policy-basis-item b { color: #8795a5; font-weight: 500; }
    .issue-applied-meta { font-size: 10.5px; color: #43a047; margin-right: auto; }
    .quick-start { margin-top: 26px; width: min(720px, 100%); }
    .quick-start-title { font-size: 14px; font-weight: 700; color: #2c3e50; margin-bottom: 12px; letter-spacing: .5px; }
    .quick-start-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
    .quick-start-card {
      display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
      padding: 16px 14px; border: 1px solid #e3e9f0; border-radius: 12px; background: #fff;
      cursor: pointer; text-align: left; transition: .16s ease; font-family: inherit;
    }
    .quick-start-card:hover { border-color: var(--ai-blue); box-shadow: 0 6px 18px rgba(14,76,146,.10); transform: translateY(-2px); }
    .quick-start-card .qs-ic { width: 24px; height: 24px; fill: none; stroke: var(--ai-blue); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; margin-bottom: 6px; }
    .quick-start-card b { font-size: 13px; color: #2c3e50; }
    .quick-start-card span { font-size: 11px; color: #8895a7; line-height: 1.5; }
    @media (max-width: 900px) { .quick-start-grid { grid-template-columns: repeat(2, 1fr); } }
    .welcome-dimensions svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: var(--ai-blue);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .85;
    }
    .welcome-dimensions strong {
      color: #2c3e50;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: .3px;
    }

    .thinking-stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 36px 28px 28px; }
    .thinking-card { width: 620px; padding: 34px 38px; border-radius: 16px; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow); }
    .thinking-title { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; color: #173f6c; font-size: 18px; font-weight: 600; }
    .thinking-mini-avatar {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--ai-blue), var(--ai-cyan));
      box-shadow: var(--ai-glow);
    }
    .thinking-row {
      margin: 11px 0;
      padding: 13px 15px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 11px;
      color: #526476;
      background: #f6f9fc;
      border: 1px solid #e8edf3;
      font-size: 13px;
      animation: fadeUp .25s ease;
    }
    .thinking-row.active { color: var(--ai-blue); border-color: #b9dbe8; background: #f0f9fb; }
    .thinking-row.done { color: var(--ai-green); }
    .thinking-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ai-cyan); display: inline-block; animation: dot-bounce 1.2s infinite ease-in-out; }
    .thinking-dot:nth-child(2) { animation-delay: .15s; }
    .thinking-dot:nth-child(3) { animation-delay: .3s; }

    .workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(520px, 1fr) 430px;
      background: #eef2f6;
    }
    .document-pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid #dce4ec; }
    .pane-toolbar {
      height: 52px;
      flex: 0 0 52px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(255,255,255,.94);

        function buildClosureData(versionList) {
          const chronological = (versionList || []).slice().reverse();
          const first = chronological[0] || null;
          const latest = chronological[chronological.length - 1] || null;
          if (!first || !latest) {
            return { items: [], initialTotal: 0, fixed: 0, remaining: 0, newIssues: 0, ignored: 0, conclusion: "暂无审查结果" };
          }
          const initialIssues = (first.issues && first.issues.length ? first.issues : (latest.issues || [])).map(issue => JSON.parse(JSON.stringify(issue)));
          const latestIssues = (latest.issues || []).map(issue => JSON.parse(JSON.stringify(issue)));
          const allChanges = chronological.flatMap(version => version.changes || []);
          const handledSnapshots = chronological.flatMap(version => version.previousIssues || []);
          const items = initialIssues.map(issue => {
            let matchedChange = null;
            allChanges.forEach(change => {
              if (change.key === "ISSUE-" + issue.id || (change.title && change.title === issue.title)) matchedChange = change;
            });
            let handledIssue = null;
            handledSnapshots.forEach(item => { if (item.title === issue.title) handledIssue = item; });
            const latestIssue = latestIssues.find(item => item.title === issue.title);
            const ignored = (handledIssue && handledIssue.status === "ignored") || (latestIssue && latestIssue.status === "ignored");
            const hasRecheck = chronological.length > 1;
            const passed = hasRecheck && !latestIssue && !ignored;
            return {
              key: "CLOSURE-" + issue.id,
              issue,
              original: issue.original,
              suggestion: issue.suggestion,
              modified: matchedChange ? matchedChange.after : (passed ? "已通过手动修改完成整改" : "—"),
              handling: matchedChange ? "已采纳" : (ignored ? "已忽略" : (passed ? "已整改" : "待处理")),
              recheckResult: ignored ? "已忽略，待人工确认" : (passed ? "复审通过" : (latestIssue ? "仍需处理" : "待复审")),
              isNew: false
            };
          });
          const initialTitles = new Set(initialIssues.map(issue => issue.title));
          latestIssues.filter(issue => !initialTitles.has(issue.title)).forEach(issue => {
            items.push({
              key: "NEW-" + issue.id,
              issue,
              original: issue.original,
              suggestion: issue.suggestion,
              modified: "—",
              handling: "待处理",
              recheckResult: "复审新增",
              isNew: true
            });
          });
          const fixed = items.filter(item => !item.isNew && item.recheckResult === "复审通过").length;
          const ignored = items.filter(item => item.handling === "已忽略").length;
          const remaining = items.filter(item => item.recheckResult === "仍需处理").length;
          const newIssues = items.filter(item => item.isNew).length;
          const conclusion = remaining === 0 && newIssues === 0 && ignored === 0 && chronological.length > 1
            ? "复审通过"
            : (ignored > 0 ? "存在已忽略问题，需人工确认" : (chronological.length > 1 ? "仍有问题需要整改" : "初审完成，待整改复审"));
          return { items, initialTotal: initialIssues.length, fixed, remaining, newIssues, ignored, conclusion };
        }

        function beginAnalysis(isRecheck = false, prevIssues = []) {
          phase.value = "thinking";
          currentStep.value = 2;
          analysisStage.value = 0;
          let index = 0;
          const stages = [1, 2, 3, 4];
          const timer = setInterval(() => {
            analysisStage.value = stages[index];
            index += 1;
            if (index >= stages.length) {
              clearInterval(timer);
              setTimeout(() => {
                task.issues = analyzeDocument(task.text, task.type);
                if (task.ocrReviewNeeded) {
                  task.issues.push(
                    makeIssue("OCR-1", "format", "general", "OCR识别内容待人工核对", "消防设施配备", "请对照原PDF确认该处文字，确认无误后无需修改。", "OCR解析置信度低于自动确认阈值。", "正文第3段", { replaceable: false, basisSource: "文件解析服务", basisUpdatedAt: "本次解析", category: "OCR核对" }),
                    makeIssue("OCR-2", "format", "general", "OCR识别数字待人工核对", "025-58150000", "请对照原PDF确认联系电话数字是否准确。", "OCR对连续数字的识别置信度较低。", "正文第5段", { replaceable: false, basisSource: "文件解析服务", basisUpdatedAt: "本次解析", category: "OCR核对" })
                  );
                }
                savedAnalysisText.value = task.text;
                savedAnalysisDocType.value = task.type;
                resultsStale.value = false;
                staleReason.value = "";
                if (isRecheck && prevIssues.length > 0) {
                  const prevMap = {};
                  prevIssues.forEach(i => { prevMap[i.title] = i; });
                  let resolved = 0, remaining = 0, newIssues = 0, stillIgnored = 0;
                  const ignoredTitles = previousIgnoredTitles.value;
                  task.issues.forEach(curr => {
                    const prev = prevMap[curr.title];
                    if (!prev) { newIssues++; }
                    else if (prev.status === "accepted") { resolved++; }
                    else if (prev.original !== curr.original) { resolved++; }
                    else {
                      if (ignoredTitles.includes(curr.title)) {
                        curr.status = "ignored";
                        stillIgnored++;
                      } else {
                        remaining++;
                      }
                    }
                  });
                  const fixedCount = prevIssues.filter(i => i.status === "accepted" || !task.issues.some(c => c.title === i.title)).length;
                  recheckSummary.value = {
                    prevTotal: prevIssues.length,
                    currTotal: task.issues.length,
                    fixed: fixedCount,
                    remaining: remaining,
                    newIssues: newIssues,
                    stillIgnored: stillIgnored,
                    prevAccepted: prevIssues.filter(i => i.status === "accepted").length
                  };
                  createReviewVersion("重新审查", recheckSummary.value, prevIssues);
                  pendingChanges.value = [];
                  showRecheckResult.value = false;
                  addLog("复审完成：整改" + fixedCount + "项，遗留" + remaining + "项，新增" + newIssues + "项" + (stillIgnored > 0 ? "，已忽略" + stillIgnored + "项" : ""));
                  message.success("复审完成，已自动比对修改前后内容");
                } else {
                  if (reviewVersions.value.length === 0) createReviewVersion("首次审查", null);
                  pendingChanges.value = [];
                  addLog((isRecheck ? "重新审查完成" : "完成格式规范、行文规则、内容合规审查") + "，生成" + task.issues.length + "项问题");
                  message.success(isRecheck ? "重新审查完成，问题清单已更新" : "合规审查完成");
                }
                phase.value = "results";
                currentStep.value = 3;
                activeDimension.value = "all";
                activeRisk.value = "all";
                activeRightTab.value = "issues";
                documentDirty.value = false;
                saveDraft();
              }, 320);
            }
          }, 380);
        }

        function startTask() {

          const sourceText = sourceMode.value === "paste" ? pasteText.value.trim() : sampleDocument;
          const sourceName = sourceMode.value === "paste"

          task.id = "TASK-" + Date.now();

          task.type = selectedDocType.value;
          task.text = sourceText;
          task.createdAt = now();
          task.issuer = reviewParams.issuer;
          task.usage = reviewParams.usage;
          task.ocrReviewNeeded = ocrReviewNeeded.value;
          task.ocrLowConfidenceCount = ocrLowConfidenceCount.value;
          task.issues = [];
          task.logs = [];
          reviewVersions.value = [];
          pendingChanges.value = [];
          selectedVersionKey.value = "";
          documentDirty.value = false;
          activeRightTab.value = "issues";
          recheckSummary.value = null;
          resultsStale.value = false;
          staleReason.value = "";
          savedAnalysisText.value = "";
          savedAnalysisDocType.value = "";
          recheckRound.value = 0;
          previousIgnoredTitles.value = [];
          addLog(sourceMode.value === "paste"
            ? "粘贴文本并识别为“" + task.type + "”"
            : "上传“" + uploadFile.value.name + "”并识别为“" + task.type + "”");
          if (task.ocrReviewNeeded) {
            addLog("PDF已完成OCR解析，" + task.ocrLowConfidenceCount + "处低置信度内容标记为待人工核对");
          }
          showNewTask.value = false;
          view.value = "review";
          beginAnalysis();
        }

        function invalidateResults(reason) {
          resultsStale.value = true;
          staleReason.value = reason;
          selectedRecord.value = null;
          showReport.value = false;
          currentStep.value = 3;
        }

        function onDocumentBlur(event) {
          const el = event.target;
          const current = normalizeDocumentText(el.innerText);
          const analyzedText = normalizeDocumentText(savedAnalysisText.value);
          if (current !== analyzedText && analyzedText) {
            const previousText = normalizeDocumentText(task.text);
            task.text = current;
            savedAnalysisText.value = current;
            addPendingChange({
              key: "MANUAL-" + Date.now(),
              field: "正文",
              source: "手动编辑",
              position: "正文内容",
              before: previousText,
              after: current
            });
            documentDirty.value = false;
            addLog("用户编辑正文，当前审查结果失效");
            message.warning("正文已修改，请重新审查");
            saveDraft();
          } else {
            documentDirty.value = false;
            if (pendingChanges.value.length === 0) {
              resultsStale.value = false;
              staleReason.value = "";
            }
          }
        }

        function changeTaskDocType(value) {
          if (!value || value === task.type) return;
          const previousType = task.type;
          task.type = value;
          addPendingChange({
            key: "META-docType",
            field: "文种",
            source: "手动修改",
            position: "文稿属性",
            before: previousType,
            after: value
          });
          addLog("文种由“" + (savedAnalysisDocType.value || "未确认") + "”调整为“" + value + "”");
          message.warning("文种已变更，请重新审查");
        }

        function recheckCurrentTask() {
          if (!task.text.trim()) {
            message.warning("正文不能为空");
            return;
          }
          if (pendingChangeCount.value === 0) {
            message.info("当前文稿尚未修改，无需重新审查");
            return;
          }
          previousIssues.value = JSON.parse(JSON.stringify(task.issues));
          recheckRound.value++;
          addLog("针对" + pendingChangeCount.value + "处修改重新发起合规审查（第" + recheckRound.value + "轮复审）");
          beginAnalysis(true, previousIssues.value);
        }

        const visibleIssues = computed(() => task.issues.filter(issue =>
          (activeDimension.value === "all" || issue.dimension === activeDimension.value) &&
          (activeRisk.value === "all" || issue.risk === activeRisk.value)
        ));
        const pendingCount = computed(() => task.issues.filter(i => i.status === "pending").length);
        const acceptedCount = computed(() => task.issues.filter(i => i.status === "accepted").length);
        const ignoredCount = computed(() => task.issues.filter(i => i.status === "ignored").length);
        const highCount = computed(() => task.issues.filter(i => i.risk === "high").length);
        const mediumCount = computed(() => task.issues.filter(i => i.risk === "medium").length);
        const generalCount = computed(() => task.issues.filter(i => i.risk === "general").length);

        const dimensionLabel = (value) => ({
          format: "格式规范",
          writing: "行文规则",
          content: "内容合规"
        }[value] || value);
        const riskLabel = (value) => ({
          high: "高风险",
          medium: "中风险",
          general: "一般问题"
        }[value] || value);
        const statusLabel = (value) => ({
          pending: "待处理",
          accepted: "已采纳",
          ignored: "已忽略"
        }[value] || value);

        function escapeHtml(value) {
          return String(value || "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        }

        const renderedDocument = computed(() => {
          let html = task.text.split(/\n+/).map(line => "<p>" + escapeHtml(line) + "</p>").join("");
          task.issues.forEach(issue => {
            const highlightText = issue.status === "accepted"
              ? (issue.applyText || issue.suggestion)
              : issue.original;
            if (!highlightText || highlightText.startsWith("未识别")) return;
            const safeText = escapeHtml(highlightText);
            const css = "doc-mark " + issue.risk + " " + issue.status + (activeIssueId.value === issue.id ? " active" : "");
            html = html.replace(safeText,
              '<mark class="' + css + '" data-issue-id="' + issue.id + '">' + safeText + "</mark>");
          });
          return html;
        });

        function focusIssue(issue) {
          activeIssueId.value = issue.id;
          nextTick(() => {
            const el = document.querySelector('[data-issue-id="' + issue.id + '"]');
            if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
          });
        }

        // 文稿版本快照（每次真实修改正文时记录）
        const textVersions = ref([]);
        const currentUserName = "张政";
        function snapshotText(action) {
          textVersions.value.push({ version: "V" + (textVersions.value.length + 1), time: now(), action, text: task.text });
          if (textVersions.value.length > 30) textVersions.value.shift();
        }
        // 将建议真实应用到正文；返回是否成功。支持 replace / append / afterTitle 三种模式
        function applyIssueToText(issue) {
          if (!issue.replaceable) return false;
          snapshotText("采纳前快照：" + issue.title);
          const mode = issue.applyMode || "replace";
          const insertText = issue.applyText || issue.suggestion;
          let applied = false;
          if (mode === "replace") {
            if (!issue.original || issue.original.startsWith("未识别")) return false;
            if (!task.text.includes(issue.original)) return false;
            task.text = task.text.split(issue.original).join(issue.suggestion);
            applied = true;
          } else if (mode === "append") {
            task.text = task.text.replace(/\s+$/, "") + "\n" + insertText;
            applied = true;
          } else if (mode === "afterTitle") {
            const lines = task.text.split(/\n/);
            lines.splice(1, 0, insertText);
            task.text = lines.join("\n");
            applied = true;
          }
          if (!applied) return false;
          savedAnalysisText.value = task.text;
          issue.appliedBy = currentUserName;
          issue.appliedAt = now();
          issue.appliedVersion = "V" + (textVersions.value.length + 1);
          addPendingChange({
            key: "ISSUE-" + issue.id,
            field: "正文",
            source: "采纳建议",
            position: issue.position || "正文",
            title: issue.title,
            before: issue.original && !issue.original.startsWith("未识别") ? issue.original : "未补充",
            after: mode === "replace" ? issue.suggestion : insertText
          });
          return true;
        }
        // 撤销已应用的修改（把正文改回采纳前状态）
        function revertIssueFromText(issue) {
          if (!issue.replaceable) return false;
          const mode = issue.applyMode || "replace";
          const insertText = issue.applyText || issue.suggestion;
          if (mode === "replace") {
            if (!issue.suggestion || !task.text.includes(issue.suggestion)) return false;
            task.text = task.text.split(issue.suggestion).join(issue.original);
            savedAnalysisText.value = task.text;
            return true;
          }
          if (mode === "append" || mode === "afterTitle") {
            if (!task.text.includes(insertText)) return false;
            task.text = task.text.split("\n" + insertText).join("").split(insertText + "\n").join("").split(insertText).join("");
            savedAnalysisText.value = task.text;
            return true;
          }
          return false;
        }

        function acceptIssue(issue) {
          if (issue.status === "accepted") return;
          const applied = applyIssueToText(issue);
          issue.status = "accepted";
          if (applied) {
            addLog("采纳并修改正文：“" + issue.title + "”，操作人：" + currentUserName);
            message.success("已采纳并修改正文");
          } else {
            addLog("采纳整改：“" + issue.title + "”，操作人：" + currentUserName);
            message.success("已采纳该修改建议");
          }
          saveDraft();
        }

        function ignoreIssue(issue) {
          if (issue.status === "ignored") return;
          issue.status = "ignored";
          if (!previousIgnoredTitles.value.includes(issue.title)) {
            previousIgnoredTitles.value.push(issue.title);
          }
          addLog("忽略问题：“" + issue.title + "”");
          message.info("已忽略该问题");
        }

        function undoIssue(issue) {
          const wasAccepted = issue.status === "accepted";
          if (wasAccepted && revertIssueFromText(issue)) {
            removePendingChange("ISSUE-" + issue.id);
            addLog("撤销采纳并恢复正文：“" + issue.title + "”");
          } else {
            addLog("撤销问题处理：“" + issue.title + "”");
          }
          issue.status = "pending";
          issue.appliedBy = ""; issue.appliedAt = ""; issue.appliedVersion = "";
          message.info("已恢复为待处理");
          saveDraft();
        }

        function acceptAll() {
          let appliedCount = 0;
          task.issues.filter(i => i.status === "pending").forEach(issue => {
            if (applyIssueToText(issue)) appliedCount++;
            issue.status = "accepted";
          });
          addLog("批量采纳全部待处理问题，其中" + appliedCount + "项已自动替换正文，操作人：" + currentUserName);
          message.success(appliedCount > 0 ? ("已采纳全部待处理问题，" + appliedCount + "项已替换正文") : "已采纳全部待处理问题");
          saveDraft();
        }

        function ignoreAll() {
          task.issues.filter(i => i.status === "pending").forEach(issue => issue.status = "ignored");
          addLog("批量忽略全部待处理问题");
          message.info("已忽略全部待处理问题");
        }

        function persistRecord(record) {
          try {
            const userRecords = records.value
              .filter(item => !seedRecords.some(seed => seed.id === item.id))
              .slice(0, 20);
            localStorage.setItem("jiangbeiComplianceRecords", JSON.stringify(userRecords));
          } catch (e) {}
        }

        function generateResult() {
          if (resultsStale.value) {
            message.warning("当前审查结果已失效，请重新审查后再生成报告");
            return;
          }
          if (reviewVersions.value.length === 0) createReviewVersion("首次审查", null);
          const closure = buildClosureData(reviewVersions.value);
          const newestVersion = reviewVersions.value[0];
          const oldestVersion = reviewVersions.value[reviewVersions.value.length - 1];
          const version = reviewVersions.value.length > 1 ? (oldestVersion.version + "—" + newestVersion.version) : newestVersion.version;
          addLog("生成" + version + "闭环审查报告，保留初审问题、整改内容和复审结论");
          const record = {
            id: "R-" + Date.now(),
            name: task.name,
            type: task.type,
            version,
            time: now(),
            reportMode: "closure",
            reportTitle: "闭环审查报告",
            total: closure.initialTotal,
            initialTotal: closure.initialTotal,
            fixed: closure.fixed,
            remaining: closure.remaining,
            newIssues: closure.newIssues,
            accepted: closure.items.filter(item => item.handling === "已采纳").length,
            ignored: closure.ignored,
            pending: closure.remaining + closure.newIssues,
            high: closure.items.filter(item => item.issue.risk === "high").length,
            medium: closure.items.filter(item => item.issue.risk === "medium").length,
            general: closure.items.filter(item => item.issue.risk === "general").length,
            conclusion: closure.conclusion,
            closureItems: JSON.parse(JSON.stringify(closure.items)),
            operator: "综合办公室",
            issuer: task.issuer,
            usage: task.usage,
            ocrReviewNeeded: task.ocrReviewNeeded,
            ocrLowConfidenceCount: task.ocrLowConfidenceCount,
            text: task.text,
            issues: JSON.parse(JSON.stringify(task.issues)),
            logs: JSON.parse(JSON.stringify(task.logs)),
            reviewVersions: JSON.parse(JSON.stringify(reviewVersions.value)),
            archived: false
          };
          records.value.unshift(record);
          persistRecord(record);
          selectedRecord.value = record;
          phase.value = "report";
          currentStep.value = 4;
          showReport.value = true;
          message.success("闭环审查报告已生成，初审问题和整改复审过程已完整保留");
        }

        function archiveRecord(record) {
          record.archived = true;
          persistRecord(record);
          currentStep.value = 4;
          addLog("审查记录" + record.version + "已闭环归档");
          message.success("已归档，审查流程闭环完成");
        }

        function viewRecord(record) {
          if (record.initialTotal == null) record.initialTotal = record.total || 0;
          if (record.fixed == null) record.fixed = record.accepted || 0;
          if (record.remaining == null) record.remaining = Math.max(0, (record.total || 0) - (record.accepted || 0) - (record.ignored || 0));
          if (record.newIssues == null) record.newIssues = 0;
          if (!record.conclusion) record.conclusion = record.remaining === 0 ? "审查处理完成" : "仍有问题需要处理";
          selectedRecord.value = record;
          showRecordDetail.value = true;
        }

        function openRecordReport(record) {
          viewRecord(record);
          showRecordDetail.value = false;
          showReport.value = true;
        }

        function viewVersionReport(version) {
          const versionIssues = JSON.parse(JSON.stringify(version.issues || []));
          const previousTitles = new Set((version.previousIssues || []).map(issue => issue.title));
          const versionItems = versionIssues.map(issue => {
            const matchedChange = (version.changes || []).find(change => change.key === "ISSUE-" + issue.id || change.title === issue.title);
            return {
              key: "VERSION-" + version.key + "-" + issue.id,
              issue,
              original: issue.original,
              suggestion: issue.suggestion,
              modified: matchedChange ? matchedChange.after : "—",
              handling: statusLabel(issue.status),
              recheckResult: version.action === "首次审查" || version.action === "历史审查"
                ? "本版本检出"
                : (previousTitles.has(issue.title) ? "仍需处理" : "复审新增")
            };
          });
          const versionConclusion = versionIssues.length === 0
            ? "本版本审查通过"
            : (version.action === "首次审查" || version.action === "历史审查" ? "本版本发现" + versionIssues.length + "项问题" : "本版本仍有" + versionIssues.length + "项问题需要处理");
          selectedRecord.value = {
            id: "VERSION-" + version.key,
            name: task.name,
            type: version.docType || task.type,
            version: version.version,
            time: version.time,
            operator: version.operator,
            reportMode: "version",
            reportTitle: version.version + "版本审查报告",
            total: versionIssues.length,
            initialTotal: versionIssues.length,
            fixed: version.fixed || 0,
            remaining: version.remaining != null ? version.remaining : versionIssues.length,
            newIssues: version.newIssues || 0,
            accepted: versionIssues.filter(issue => issue.status === "accepted").length,
            ignored: versionIssues.filter(issue => issue.status === "ignored").length,
            pending: versionIssues.filter(issue => issue.status === "pending").length,
            conclusion: versionConclusion,
            closureItems: versionItems,
            issues: versionIssues,
            text: version.text,
            logs: JSON.parse(JSON.stringify(task.logs || [])),
            reviewVersions: [JSON.parse(JSON.stringify(version))],
            archived: false
          };
          showReport.value = true;
        }

        const filteredRecords = computed(() => records.value.filter(record =>
          (recordType.value === "全部文种" || record.type === recordType.value) &&
          (!recordKeyword.value.trim() || record.name.includes(recordKeyword.value.trim()))
        ));

        const recordColumns = [
          { title: "文稿名称", key: "name", minWidth: 240, ellipsis: { tooltip: true } },
          { title: "文种", key: "type", width: 90 },
          {
            title: "审查版本", key: "version", width: 90,
            render: row => Vue.h("span", { class: "version-tag" }, row.version)
          },
          { title: "初审问题", key: "total", width: 90 },
          {
            title: "整改情况", key: "handled", width: 170,
            render: row => row.initialTotal != null
              ? (row.fixed || 0) + "项已整改 / " + ((row.remaining || 0) + (row.newIssues || 0)) + "项待处理"
              : (row.accepted || 0) + "项已处理 / " + (row.ignored || 0) + "项忽略"
          },
          { title: "生成时间", key: "time", width: 160 },
          {
            title: "状态", key: "archived", width: 90,
            render: row => row.archived
              ? Vue.h("span", { style: "color:#43a047;font-weight:600" }, "已归档")
              : Vue.h("span", { style: "color:#f0ad4e;font-weight:600" }, "待导出")
          },
          { title: "操作人", key: "operator", width: 100 },
          {
            title: "操作", key: "actions", width: 200,
            render: row => Vue.h("div", { style: "display:flex;gap:6px" }, [
              Vue.h(naive.NButton, {
                text: true, type: "primary",
                onClick: () => viewRecord(row)
              }, { default: () => "详情" }),
              Vue.h(naive.NButton, {
                text: true, type: "success",
                onClick: () => downloadAll(row)
              }, { default: () => "下载报告" })
            ])
          }
        ];

        function downloadBlob(content, fileName, mime) {
          const blob = new Blob([content], { type: mime });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = fileName;
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
        }

        function buildReportHtml(record) {
          const isVersionReport = record.reportMode === "version";
          const closureItems = record.closureItems || (record.issues || []).map(issue => ({
            issue, original: issue.original, suggestion: issue.suggestion, modified: "—", handling: statusLabel(issue.status), recheckResult: "待复审"
          }));
          const rows = closureItems.length ? closureItems.map((item, index) =>
            "<tr><td>" + (index + 1) + "</td><td>" + escapeHtml(item.issue.title) + "</td><td>" +
            escapeHtml(item.original) + "</td><td>" + escapeHtml(item.suggestion) + "</td><td>" +
            escapeHtml(item.modified) + "</td><td>" + escapeHtml(item.handling) + "</td><td>" +
            escapeHtml(item.recheckResult) + "</td></tr>"
          ).join("") : ((record.initialTotal || 0) > 0
            ? "<tr><td colspan='7'>该历史记录未保存逐项问题明细，请以原始归档报告为准。</td></tr>"
            : "<tr><td colspan='7' class='pass'>本版本未检出问题，审查通过。</td></tr>");
          const basisRows = closureItems.map((item, index) => {
            const issue = item.issue;
            return "<div class='detail'><b>" + (index + 1) + ". " + escapeHtml(issue.title) + "</b>" +
            "<p>文件名称：" + escapeHtml(issue.basisFile || issue.basisSource || "平台合规规则库") + "</p>" +
            "<p>发布机关：" + escapeHtml(issue.basisAgency || "—") + "</p>" +
            "<p>具体条款：" + escapeHtml(issue.basisClause || issue.basis || "—") + "</p>" +
            "<p>最后同步时间：" + escapeHtml(issue.basisSyncedAt || issue.basisUpdatedAt || "—") + "</p></div>";
          }).join("");
          const unresolved = closureItems.filter(item => item.recheckResult !== "复审通过");
          const suggestionRows = unresolved.length
            ? unresolved.map((item, index) => "<li><b>" + (index + 1) + ". " + escapeHtml(item.issue.position || "位置待确认") + "：</b>" + escapeHtml(item.suggestion) + "</li>").join("")
            : ((record.initialTotal || 0) > 0 && closureItems.length === 0
              ? "<li>该历史记录未保存逐项修订建议。</li>"
              : "<li class='pass'>初审问题已全部整改并通过复审，无遗留修订建议。</li>");
          return '<html><head><meta charset="UTF-8"><title>' + escapeHtml(record.reportTitle || "闭环审查报告") + '</title><style>' +
            'body{font-family:"Microsoft YaHei",sans-serif;color:#24384b;max-width:1060px;margin:28px auto;padding:0 24px;line-height:1.7}h1{font-size:24px;margin-bottom:8px}h2{font-size:17px;margin-top:26px;border-bottom:1px solid #dfe6ed;padding-bottom:7px}p{margin:3px 0}.summary{margin:18px 0;padding:12px 14px;border:1px solid #dce8e1;border-radius:8px;background:#f5fbf7}.summary b{color:#16704a}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #dfe6ed;padding:7px;text-align:left;vertical-align:top}th{background:#f5f7fa}.detail{padding:10px 12px;margin:8px 0;border:1px solid #e2e8ef;border-radius:6px}.detail p{font-size:12px;color:#526476}li{margin:8px 0}.pass{color:#16704a}@media print{body{margin:0;max-width:none}.no-print{display:none}}' +
            '</style></head><body>' +
            "<h1>" + escapeHtml(record.name) + "—" + escapeHtml(record.reportTitle || "闭环审查报告") + "</h1>" +
            "<p>文种：" + record.type + "　版本：" + record.version + "　生成时间：" + record.time + "</p>" +
            "<div class='summary'>" + (isVersionReport ? "本版本检出" : "初审发现") + " <b>" + (record.initialTotal || 0) + "</b> 项，" + (isVersionReport ? "本轮解决" : "已整改") + " <b>" + (record.fixed || 0) + "</b> 项，复审遗留 <b>" + (record.remaining || 0) + "</b> 项，复审新增 <b>" + (record.newIssues || 0) + "</b> 项。" + (isVersionReport ? "本版本结论" : "最终结论") + "：<b>" + escapeHtml(record.conclusion || "待确认") + "</b></div>" +
            '<h2>' + (isVersionReport ? '本版本问题明细' : '整改闭环明细') + '</h2><table><tr><th>序号</th><th>问题</th><th>原文</th><th>修改建议</th><th>修改后文字</th><th>处理方式</th><th>审查结果</th></tr>' + rows + "</table>" +
