<!doctype html>
<!--
  业务场景：南京江北新区政务 AI 智能体平台 —— 报告请示智能生成流程演示
  端类型：PC 端（Naive UI）  技术栈：Vue 3 + Naive UI（CDN，单文件可双击运行）

  本次升级（对标招标 1.2.10 + 三层权限）：
    A. 三层权限：超级管理员 / 部门管理员 / 普通用户，顶栏可切换，菜单/数据/操作按角色差异化。
    B. 场景补齐：履职情况汇报、反映问题、权限申请、工作建议、事项协调；新增"意见"文种。
    C. 公文格式要素：发文字号、签发人、紧急程度、保密期限、抄送机关、附件说明 + 对应校验规则。
    D. 子场景差异化模板 + 行文提纲预览 + 内容来源可点击溯源。
    E. 文种属性校验与格式校验分别输出；规则豁免；审核/归档回写闭环；审计日志。

  研发对接：CDN 换 npm 包；单 template 拆 .vue 组件；themeOverrides 迁移到 n-config-provider；setup 逻辑拆 composable/store。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>报告请示智能生成 · 江北新区政务AI智能体平台</title>
  <style>
    :root{
      --ai-navy:#0A3573; --ai-blue:#0E4C92; --ai-cyan:#13A8A8; --ai-green:#43A047;
      --ai-amber:#F0AD4E; --ai-red:#D9534F; --ai-purple:#7a3ed6;
      --ai-glow:0 0 16px rgba(19,168,168,.35);
      --primary-hover:#1377B5;
      --bg:#F4F6F9; --surface:#ffffff;
      --text:#333639; --muted:#6b7680; --line:#e6e9ef;
      --shadow-sm:0 4px 14px rgba(14,76,146,.06);
      --shadow:0 8px 24px rgba(14,76,146,.10);
      --border:#e6e9ef; --border-light:#eef1f7;
      --text-main:#333639; --text-secondary:#75809a; --text-regular:#606266;
      --primary:#0E4C92; --danger:#D9534F;
    }
    *{box-sizing:border-box}
    body{margin:0;min-width:1280px;height:100vh;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 78% -4%,rgba(19,168,168,.12),transparent 30%),radial-gradient(circle at 12% 100%,rgba(14,76,146,.08),transparent 35%),var(--bg);color:var(--text)}
    .icon{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.125em}

    @keyframes blink{50%{opacity:0}}
    .typing-cursor::after{content:'▍';margin-left:2px;color:var(--ai-cyan);animation:blink 1s steps(1) infinite}
    @keyframes dot-bounce{0%,80%,100%{transform:scale(.5);opacity:.3}40%{transform:scale(1);opacity:1}}
    .thinking-dot{width:6px;height:6px;border-radius:50%;background:var(--ai-cyan);display:inline-block;animation:dot-bounce 1.2s infinite ease-in-out}
    .thinking-dot:nth-child(2){animation-delay:.15s}
    .thinking-dot:nth-child(3){animation-delay:.3s}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .bubble{animation:fadeUp .3s ease}
    @keyframes pageIn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
    .stage-in{animation:pageIn .25s ease}
    @keyframes pulseGlow{50%{box-shadow:0 0 0 6px rgba(19,168,168,.12)}}
    .pulse{animation:pulseGlow 1.5s infinite}
    .ai-gradient-text{background:linear-gradient(90deg,#0E4C92,#13A8A8,#43A047);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.glass-card{background:rgba(10,53,115,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(19,168,168,.3);box-shadow:var(--ai-glow);border-radius:12px;color:#fff}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

    .app{display:grid;grid-template-columns: 300px 1fr;grid-template-rows:58px 1fr;height:100vh;transition:grid-template-columns .3s ease}
    .app.sidebar-collapsed{grid-template-columns:56px 1fr}
    .topbar{grid-column:1/-1;grid-row:1;display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:#fff;
      background:linear-gradient(90deg,#0A3573,#0E4C92 60%,#13A8A8);box-shadow:0 4px 20px rgba(10,53,115,.18);z-index:5}
    .brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:15px}
    .brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.3);box-shadow:var(--ai-glow);color:#fff;font-size:13px;font-weight:800;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    .brand small{display:block;margin-top:2px;color:rgba(255,255,255,.78);font-size:11px;font-weight:500}
    .top-actions{display:flex;align-items:center;gap:10px}
    .safe-badge{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid rgba(255,255,255,.28);border-radius:8px;background:rgba(255,255,255,.12);color:#fff;font-size:12px;font-weight:600;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    .role-badge{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:8px;font-size:12px;font-weight:600;color:#fff;background:rgba(255,255,255,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    .role-badge .dot{width:7px;height:7px;border-radius:50%;background:#fff}
    .role-badge.super{background:linear-gradient(135deg,var(--ai-purple),var(--ai-blue))}
    .role-badge.dept{background:linear-gradient(135deg,var(--ai-cyan),var(--ai-green))}
    .role-badge.user{background:rgba(255,255,255,.22)}

    /* ============ 左侧侧边栏 ============ */
    .sidebar{width:300px;background:#fafbfc;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .3s ease;position:relative;grid-column:1;grid-row:1/3}
    .sidebar.collapsed{width:56px}
    .sidebar-header{padding:20px 16px 16px;background:linear-gradient(90deg,#0A3573,#0E4C92 60%,#13A8A8);border-bottom:none;box-shadow:0 4px 20px rgba(10,53,115,.18)}
    .sidebar.collapsed .sidebar-header{padding:20px 8px 16px}
    .sidebar-logo{display:flex;align-items:center;gap:10px;margin-bottom:16px}
    .sidebar-logo-icon{width:32px;height:32px;background:linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.3);box-shadow:var(--ai-glow);color:#fff;display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:bold;font-size:16px;flex-shrink:0}
    .sidebar-logo-text{font-size:15px;font-weight:600;color:#fff;white-space:nowrap}
    .sidebar.collapsed .sidebar-logo-text{display:none}
    .sidebar.collapsed .sidebar-logo{justify-content:center}
    .btn-new{width:100%;padding:10px 12px;background:var(--primary);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s;white-space:nowrap;overflow:hidden}
    .btn-new:hover{background:var(--primary-hover)}
    .sidebar.collapsed .btn-new{padding:10px 0}
    .sidebar.collapsed .btn-new .btn-text{display:none}

    .sidebar-filter-box{padding:12px 16px;border-bottom:1px solid var(--border-light);display:flex;flex-direction:column;gap:8px}
    .sidebar.collapsed .sidebar-filter-box{display:none}
    .sidebar-search-wrap{position:relative}
    .sidebar-search-input{width:100%;padding:7px 12px 7px 30px;border:1px solid var(--border);border-radius:4px;font-size:13px;color:var(--text-main);background:#fff;transition:border-color .2s}
    .sidebar-search-input:focus{outline:none;border-color:var(--primary)}
    .sidebar-search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-secondary);font-size:13px;pointer-events:none}
    .sidebar-search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--text-secondary);cursor:pointer;font-size:14px;display:none}
    .sidebar-search-clear:hover{color:var(--danger)}
    .time-filter-row{display:flex;gap:4px;flex-wrap:wrap}
    .time-chip{padding:3px 9px;font-size:12px;color:var(--text-regular);background:#fff;border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
    .time-chip:hover{border-color:var(--primary);color:var(--primary)}
    .time-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

    .sidebar-section-title{padding:14px 16px 8px;font-size:12px;color:var(--text-secondary);font-weight:500;white-space:nowrap;display:flex;align-items:center;justify-content:space-between}
    .sidebar.collapsed .sidebar-section-title{text-align:center;padding:14px 4px 8px;font-size:10px}
    .record-count{font-size:11px;color:var(--text-secondary);font-weight:normal}
    .history-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 8px 16px;min-height:0}
    .history-item{padding:10px 12px;border-radius:6px;cursor:pointer;margin-bottom:4px;transition:.25s ease;position:relative}
    .history-item:hover{background:#eef2f7;transform:translateX(2px)}
    .history-item.active{background:linear-gradient(135deg,var(--ai-blue),var(--ai-cyan));box-shadow:0 8px 20px rgba(14,76,146,.25),var(--ai-glow)}
    .history-item.active .history-title{color:#fff}
    .history-title{font-size:13px;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
    .history-meta{font-size:11px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .history-tag{display:inline-block;padding:1px 6px;background:#f0f0f0;border-radius:3px;font-size:11px;color:var(--text-regular)}
    .history-status{display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px}
    .history-status.s-draft{background:#fff7e6;color:#d48806}
    .history-status.s-submitted{background:#e6f4ff;color:#0958d9}
    .history-status.s-review{background:#fff2e8;color:#d46b08}
    .history-status.s-exported{background:#f6ffed;color:#2e7d32}
    .history-step{display:inline-block;padding:1px 5px;background:#f0f0f0;border-radius:3px;font-size:10px;color:#909399}
    .history-time{font-size:11px;color:var(--text-secondary);margin-left:auto}
    .sidebar.collapsed .history-item{padding:10px 4px;text-align:center}
    .sidebar.collapsed .history-title,.sidebar.collapsed .history-meta,.sidebar.collapsed .history-time{display:none}
    .sidebar.collapsed .history-item::after{content:attr(data-abbr);display:inline-block;padding:3px 6px;background:#e6f4ff;color:#0958d9;border-radius:3px;font-size:11px}
    .sidebar.collapsed .history-item:hover::before{content:attr(data-full);position:absolute;left:60px;top:50%;transform:translateY(-50%);background:#303133;color:#fff;padding:6px 12px;border-radius:4px;font-size:12px;white-space:nowrap;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
    .sidebar-footer{padding:12px 16px;border-top:1px solid var(--border-light);display:flex;align-items:center;gap:10px}
    .sidebar.collapsed .sidebar-footer{padding:12px 8px;justify-content:center}
    .sidebar.collapsed .sidebar-user-info{display:none}
    .sidebar-user-avatar{width:32px;height:32px;border-radius:50%;background:#d9dcdf;color:var(--text-regular);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
    .sidebar-user-info{flex:1;overflow:hidden}
    .sidebar-user-name{font-size:13px;color:var(--text-main);white-space:nowrap}
    .sidebar-user-dept{font-size:11px;color:var(--text-secondary);white-space:nowrap}
    .collapse-btn{position:absolute;right:-12px;top:20px;width:24px;height:24px;background:#fff;border:1px solid var(--border);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-regular);font-size:12px;z-index:10;box-shadow:0 2px 4px rgba(0,0,0,.06);transition:all .2s}
    .collapse-btn:hover{color:var(--primary);border-color:var(--primary)}
    .collapse-icon{transition:transform .3s}
    .sidebar.collapsed .collapse-icon{transform:rotate(180deg)}

    .view{display:none;grid-column:2;grid-row:2;min-height:0;overflow:hidden}
    .view.active{display:block}
    .page-scroll{height:100%;padding:22px 26px 42px;overflow:auto}

    #view-generate.active{display:grid;grid-template-rows:auto auto 1fr}
    .gen-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 22px;background:#fff;border-bottom:1px solid var(--line)}
    .tool-left{display:flex;align-items:center;gap:14px}
    .task-name{color:#1d2c47;font-size:15px;font-weight:700}
    .task-meta{color:#8693a8;font-size:12.5px}
    .flowbar{display:flex;align-items:center;padding:11px 22px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line)}
    .flow-step{display:flex;align-items:center}
    .flow-node{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border:1px solid transparent;border-radius:999px;background:#f0f3f8;color:#7d899f;font-size:12.5px;font-weight:700;white-space:nowrap;transition:.25s ease;cursor:pointer;border:none}
    .flow-node span{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#cbd5e5;color:#fff;font-size:11px}
    .flow-node:hover:not(.locked){color:var(--ai-blue);background:#edf3ff;transform:translateY(-1px)}
    .flow-node.done{color:var(--ai-green);background:#eaf8f1}
    .flow-node.done span{background:var(--ai-green)}
    .flow-node.current{color:#fff;background:linear-gradient(135deg,var(--ai-blue),var(--ai-cyan));box-shadow:0 5px 13px rgba(19,168,168,.28),var(--ai-glow)}
    .flow-node.current span{background:rgba(255,255,255,.25)}
    .flow-node.locked{cursor:not-allowed;opacity:.72}
    .flow-arrow{position:relative;flex:none;width:24px;height:1px;margin:0 3px;background:#d7dfeb}
    .flow-arrow::after{content:"";position:absolute;top:-3px;right:-1px;width:6px;height:6px;border-top:1px solid #b9c5d8;border-right:1px solid #b9c5d8;transform:rotate(45deg)}
    .stage-scroll{min-height:0;padding:22px 26px 48px;overflow:auto}
    .stage-grid{display:grid;grid-template-columns:minmax(620px,1fr) 360px;gap:18px;align-items:start}
.stage-grid aside{display:flex;flex-direction:column;min-height:0}
.stage-grid aside .card{flex:1;display:flex;flex-direction:column}
.stage-grid aside .card-body{flex:1}
.stage-grid aside .card+.card{margin-top:16px;flex:none}
    .stage-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}
    .stage-actions .right{display:flex;gap:8px}

    .card{margin-bottom:16px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--shadow-sm);overflow:hidden;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
    .card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(14,76,146,.15);border-color:var(--ai-cyan)}
    .card:last-child{margin-bottom:0}
    .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:0 16px;border-bottom:1px solid #eef1f6}
    .card-title{display:flex;align-items:center;gap:8px;color:#1d2c47;font-size:15px;font-weight:700}
    .step-badge{padding:2px 8px;border-radius:6px;color:var(--ai-blue);background:#edf3ff;font-size:10.5px;font-weight:700}
    .card-body{padding:16px}
    .card-note{color:#8390a5;font-size:12px}
    .subtle-note{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-left:3px solid var(--ai-cyan);background:#f4fbfb;color:#54606b;font-size:12.5px;line-height:1.65;border-radius:0 7px 7px 0}
    .subtle-note .icon{color:var(--ai-cyan);margin-top:1px}

    .status-list{display:grid;gap:0}
    .status-line{display:flex;align-items:flex-start;gap:10px;min-height:45px;padding:10px 0;border-bottom:1px dashed #eef1f6;color:#4a5870;font-size:12.5px}
    .status-line:last-child{border-bottom:0}
    .status-ico{display:grid;place-items:center;width:21px;height:21px;margin-top:-1px;border-radius:50%;color:#8b98ac;background:#edf1f7}
    .status-line.ok .status-ico{color:#fff;background:var(--ai-green)}
    .status-line.doing .status-ico{color:#fff;background:var(--ai-blue)}
    .status-line.warn .status-ico{color:#fff;background:var(--ai-amber)}
    .status-line b{display:block;color:#33415b;font-size:12.5px}
    .status-line small{display:block;margin-top:2px;color:#8a96a9;font-size:11.5px}
    .status-tag{margin-left:auto;padding-top:2px;color:#8692a5;font-size:11px;white-space:nowrap}

    .missing-item{display:grid;grid-template-columns:148px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px dashed #eef1f6}
    .missing-item:last-child{border-bottom:0}
    .missing-name{color:#33415a;font-size:12.5px;font-weight:700}
    .missing-name small{display:block;margin-top:2px;color:#93a0b5;font-size:11px;font-weight:500}
    .tag-pill{display:inline-flex;align-items:center;gap:4px;min-height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
    .tag-pill.done{color:var(--ai-green);background:#eaf8f1}
    .tag-pill.wait{color:var(--ai-amber);background:#fff5e4}
    .tag-pill.doing{color:var(--ai-blue);background:#edf3ff}
    .tag-pill.block{color:var(--ai-red);background:#fdeeee}
    .tag-pill.purple{color:var(--ai-purple);background:#f1eafa}

    .document-shell{overflow:hidden;border:1px solid #d9e0eb;border-radius:10px;background:#fff;box-shadow:var(--shadow)}
    .document-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:0 13px;border-bottom:1px solid #eef1f6;background:#fbfcfe}
    .document-tools .hint{color:#8190a4;font-size:11.5px}
    .document-page{min-height:560px;padding:40px 56px 50px;color:#1b1f27;font-family:FangSong,"仿宋",SimSun,serif;font-size:16px;line-height:2;outline:none}
    .document-page .doc-secret{margin:0 0 4px;font-family:SimHei,"黑体",sans-serif;font-size:15px;color:#c2342d;text-align:left;text-indent:0}
    .document-page .doc-urgency{margin:0 0 8px;font-family:SimHei,"黑体",sans-serif;font-size:15px;color:#1b1f27;text-align:left;text-indent:0}
    .document-page .red-head{margin:6px 0 6px;color:#c2342d;font-family:SimHei,"黑体",sans-serif;font-size:26px;font-weight:700;letter-spacing:2px;text-align:center}
    .document-page .doc-num-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-family:SimSun,serif;font-size:14px;color:#1b1f27}
    .document-page .red-line{height:2px;background:#c2342d;margin:2px 0 24px}
    .document-page h1{margin:0 0 18px;font-family:SimHei,"黑体",sans-serif;font-size:22px;line-height:1.65;text-align:center}
    .document-page .doc-meta{margin:0 0 20px;color:#1b1f27;font-size:16px;text-align:left;text-indent:0;font-family:FangSong,"仿宋",serif}
    .document-page .doc-attach{margin:14px 0 0;text-indent:2em;font-family:FangSong,"仿宋",serif;font-size:16px}
    .document-page .doc-note{margin:8px 0 0;text-indent:2em;font-family:FangSong,"仿宋",serif;font-size:14px;color:#3a3f47}
    .document-page .doc-record{margin-top:16px;padding-top:10px;border-top:1px solid #c2342d;font-family:SimSun,serif;font-size:13px;color:#3a3f47;text-indent:0}
    .document-page p{margin:0 0 9px;text-indent:2em}
    .document-page .no-indent{text-indent:0}
    .document-page .right-align{text-align:right;text-indent:0}
    .source-mark{padding:0 2px;border-bottom:2px solid var(--ai-amber);background:#fff5e2;cursor:pointer}
    .source-mark:hover{color:#8f4d00;background:#ffe5ac}
    .source-mark.active{color:#8f4d00;background:#ffe5ac}

    .title-option{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;color:#45536c;font-size:13px;line-height:1.5;cursor:pointer;transition:.18s;text-align:left}
    .title-option .title-text{flex:1;min-width:0}
    .title-option .title-tag{flex:none;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
    .title-option .title-tag.rec{color:var(--ai-blue);background:#e3edff}
    .title-option .title-tag.alt{color:#8a96a9;background:#eef2f8}
    .title-option:hover{border-color:#a4b9e8;background:#edf3ff}
    .title-option.on{border-color:var(--ai-blue);color:var(--ai-navy);background:#edf3ff}
    .title-option.on .title-tag.rec{color:#fff;background:var(--ai-blue)}

.check-summary{display:flex;align-items:center;gap:14px}

    .check-list{max-height:min(320px,calc(100vh - 380px));overflow:auto;padding-right:4px;margin:0 -4px 0 0}

        });

        function toggleSidebar(){ sidebarCollapsed.value = !sidebarCollapsed.value; }

        function selectHistoryItem(id){
          const data = HISTORY_DATA[id];
          if(!data){ showToast('未找到该历史记录'); return; }
          activeHistoryId.value = id;
          view.value = 'generate';
          // 恢复表单数据
          const fd = data.formData||{};
          form.taskTitle = fd.taskTitle||data.title;
          form.department = fd.department||'';
          form.recipient = fd.recipient||'';
          form.submitDate = fd.submitDate||todayStr();
          form.purpose = fd.purpose||'工作进展报送';
          form.requestedType = fd.requestedType||'自动识别';
          if(typeof onTypeChange==='function') onTypeChange();
          form.secret = fd.secret||'非涉密';
          form.secretPeriod = fd.secretPeriod||'';
          form.docNumber = fd.docNumber||'';
          form.signer = fd.signer||'';
          form.urgency = fd.urgency||'常规';
          form.ccRecipients = fd.ccRecipients||'';
          form.startDate = fd.startDate||todayStr();
          form.endDate = fd.endDate||todayStr();
          form.phone = fd.phone||'';
          form.summary = fd.summary||'';
          // 更新任务名称和元数据
          taskName.value = fd.taskTitle||data.title;
          const st = STATUS_MAP[data.status]||{};
          taskMeta.value = '\u00b7 文种：'+data.type+' \u00b7 状态：'+(st.text||'')+' \u00b7 密级：'+(fd.secret||'非涉密');
          // 跳转到对应步骤
          const targetStep = data.step||1;
          if(data.status==='exported'){
            unlocked.value = 6;
            if(targetStep>=4) renderDocument();
            goStep(6, true);
            taskStatus.value = 'archived';
            showToast('已加载归档记录：'+data.title.substring(0,18)+'...',true);
          }else if(data.status==='review'||data.status==='submitted'){
            unlocked.value = 5;
            if(targetStep>=4) renderDocument();
            goStep(5, true);
            taskStatus.value = data.status==='review'?'approved':'submitted';
            showToast('已加载\u300c'+st.text+'\u300d记录，可继续审核',true);
          }else{
            unlocked.value = targetStep;
            if(targetStep>=4) renderDocument();
            goStep(targetStep, true);
            taskStatus.value = 'draft';
            showToast('已恢复草稿（第'+targetStep+'步\u00b7'+(STEP_LABELS[targetStep]||'')+'），可继续编辑',true);
          }
        }

        // ===== 表单（补齐公文格式要素） =====
        const todayStr = ()=>{ const n=new Date(); const m=String(n.getMonth()+1).padStart(2,'0'); const d=String(n.getDate()).padStart(2,'0'); return `${n.getFullYear()}-${m}-${d}`; };
        const form = reactive({
          taskTitle:'', department:'', recipient:'', submitDate:todayStr(),
          purpose:'工作进展报送', requestedType:'自动识别', secret:'非涉密', secretPeriod:'',
          docNumber:'', signer:'', urgency:'常规', ccRecipients:'',
          startDate:todayStr(), endDate:todayStr(), phone:'', summary:''
        });
        const docTypeOptions=['自动识别','报告','请示'];
        // 办文目的按文种差异化：报告/请示/自动识别（自动识别时全部显示）
        const purposeByType={
          报告:['工作进展报送','履职情况汇报','阶段性成果总结'],
          请示:['事项报批','权限申请','工作请示','事项协调']
        };
        const purposeOptions=computed(()=>{
          if(form.requestedType==='报告') return purposeByType.报告;
          if(form.requestedType==='请示') return purposeByType.请示;
          return [...purposeByType.报告,...purposeByType.请示]; // 自动识别：全部显示
        });
        // 文种切换后，若当前办文目的不在可选项内，则重置为第一项
        function onTypeChange(){
          if(!purposeOptions.value.includes(form.purpose)){
            form.purpose=purposeOptions.value[0];
          }
        }
        const deptOptions=['南京江北新区管理委员会办公室','南京江北新区经济发展局','南京江北新区社会事业局','南京江北新区行政审批局','南京江北新区建设与交通局'];
        const secretOptions=['非涉密','内部','秘密','机密'];
        const urgencyOptions=['常规','加急','特急'];

        const formErrors = reactive({});
        const phonePattern = /^1[3-9]\d{9}$/;
        function validateForm(){
          Object.keys(formErrors).forEach(k=>delete formErrors[k]);
          let ok=true;
          if(!form.taskTitle){formErrors.taskTitle='请填写任务名称。';ok=false;}
          if(!form.department){formErrors.department='请选择发文单位。';ok=false;}
          if(!form.recipient){formErrors.recipient='请填写主送机关。';ok=false;}
          if(!form.submitDate){formErrors.submitDate='请选择计划报送日期。';ok=false;}
          if(!phonePattern.test(form.phone)){formErrors.phone='请输入正确的11位手机号码。';ok=false;}
          if(!form.startDate||!form.endDate||form.startDate>form.endDate){formErrors.dates='请填写有效的工作起止日期。';ok=false;}
          if(!form.summary){formErrors.summary='请填写工作情况或请示事项说明。';ok=false;}
          if(form.secret!=='非涉密'&&!form.secretPeriod){formErrors.secretPeriod='涉密文稿请填写保密期限。';ok=false;}
          if(!ok) showToast('请检查必填项、联系电话、工作日期范围及保密期限。');
          return ok;
        }

        // ===== 文件上传（模拟） =====
        const files = ref([]);
        const uploadRef = ref(null);
        function humanSize(b){ if(!b) return '模拟附件 · 128KB'; return b>1024*1024?`${(b/1024/1024).toFixed(1)}MB`:`${Math.max(1,Math.round(b/1024))}KB`; }
        function handleUpload({fileList}){ files.value = fileList.slice(0,8).map(f=>({name:f.name,size:humanSize(f.file&&f.file.size)})); if(fileList.length) showToast(`已添加 ${fileList.length} 个材料，提交后将模拟解析。`,true); }
        function removeFile(i){ files.value.splice(i,1); }

        // ===== 步骤流转 =====
        function goStep(next, force=false){
          if(!force && next>unlocked.value){ showToast('请先完成当前环节。'); return; }
          step.value=next; unlocked.value=Math.max(unlocked.value,next);
          if(next===2) renderParse();
          if(next===3) renderIdentification();
          if(next===4) renderDocument();
          if(next===5){ checkDocHtml.value=docHtml.value; runCheck(); }
          if(next===6) renderOutput();
          nextTick(()=>{ const el=document.querySelector('.stage-scroll'); if(el) el.scrollTop=0; });
        }
        function backStep(n){ goStep(n,true); }

        // ===== 解析补全 =====
        const parseLogs = ref([]);
        const missingList = ref([]);
        const materialSummary = ref('');
        const basisInput = ref('');
        const nextActionInput = ref('');
        const ownerInput = ref('');
        function renderParse(){
          materialSummary.value = files.value.length?`已读取 ${files.value.length} 个附件及任务说明`:'已读取任务说明文本，未上传附件';
          parseLogs.value = [
            {type:'ok',title:'识别任务与发文主体',desc:`任务：${form.taskTitle||'未命名任务'}；单位：${form.department||'待确认'}`,tag:'完成'},
            {type:'ok',title:'解析文本与附件材料',desc:files.value.length?`识别 ${files.value.length} 个文件，已提取正文、表格和附件名称`:'基于已输入的工作说明提取文本要素',tag:'完成'},
            {type:'ok',title:'抽取事实、时间与主体',desc:`工作周期：${form.startDate||'待补录'} 至 ${form.endDate||'待补录'}`,tag:'完成'},
            {type:'warn',title:'识别待确认要素',desc:'请补充请示事项、依据文件或下一步工作安排，系统将据此完成文种判定。',tag:'待处理'}
          ];
          missingList.value = [
            {name:'政策或业务依据',sub:'请示/意见场景建议必填',tag:'待补充'},
            {name:'下一步工作安排',sub:'报告场景建议补充',tag:'待补充'},
            {name:'责任主体与时限',sub:'用于生成执行性表述',tag:'待确认'}
          ];
        }

        // ===== 文种识别（报告/请示/意见） =====
        const docType = ref('报告');
        const recommendTitle = ref(''); const recommendDesc = ref('');
        const attributeRules = ref([]);
        const elements = ref([]);
        function scenarioOf(){
          const p=form.purpose;
          if(docType.value==='请示'){
            if(p==='权限申请') return 'permission';
            if(p==='事项协调') return 'coordinate';
            return 'request'; // 事项报批、工作请示
          }
          // 报告类
          if(p==='履职情况汇报') return 'duty';
          return 'progress'; // 工作进展报送、阶段性成果总结
        }
        const OUTLINES = {
          progress:['一、工作进展','二、主要成效','三、存在问题','四、下一步工作'],
          duty:['一、职责履行情况','二、主要工作','三、工作成效','四、存在不足','五、改进措施'],
          problem:['一、问题表现','二、原因分析','三、处置建议'],
          suggestion:['一、现状情况','二、建议事项','三、建议理由','四、实施建议'],
          request:['一、请示事项','二、请示理由','三、办理建议'],
          permission:['一、现有权限情况','二、申请权限事项','三、申请理由','四、影响范围与管控'],
          coordinate:['一、协调事项','二、情况说明','三、协调建议','四、协办单位职责']
        };
        function inferredType(){
          if(form.requestedType!=='自动识别') return form.requestedType;
          const p=form.purpose;
          if(/(申请|请示|请求|批准|协调|报批|同意|支持|权限)/.test(p+form.summary)) return '请示';
          return '报告';
        }
        function renderIdentification(){
          docType.value=inferredType();
          const t=docType.value;
          const labels={报告:'工作报告',请示:'事项请示'};
          recommendTitle.value=`推荐使用：${labels[t]}`;
          recommendDesc.value = t==='请示'?'材料包含事项申请、请求协调或审批性表达，建议采用请示文种并明确单一请求事项。'
            :'材料以工作进展、阶段成果或履职情况为主，建议采用报告文种。';
          attributeRules.value = t==='请示'?[
            {ok:true,text:'已识别请求性表达，建议将请示事项置于正文结尾并使用明确办理建议。'},
            {ok:false,text:'请确认是否仅包含一个核心请示事项；多个无关事项应拆分办理（一文一事）。'}
          ]:[
            {ok:true,text:'已识别陈述性/建议性表达，符合报告类行文特征，不要求上级批复。'},
            {ok:false,text:'如需上级批准、协调或明确意见，请调整为请示文种并补充请求事项。'}
          ];
          const sc=scenarioOf();
          const last = OUTLINES[sc].slice(-1)[0];
          const content = (t==='请示'||t==='意见')?(form.summary||'待补充内容'):(nextActionInput.value||'待补充下一步工作安排');
          elements.value = [
            {k:'发文单位',v:form.department||'待确认',c:96},
            {k:'主送机关',v:form.recipient||'待确认',c:93},
            {k:'办文目的',v:form.purpose||'待确认',c:95},
            {k:'工作周期',v:`${form.startDate||'待确认'} 至 ${form.endDate||'待确认'}`,c:88},
            {k:'主要事实/情况',v:form.summary||'待补充',c:90},
            {k:'政策或业务依据',v:basisInput.value||'待补充业务依据或相关文件文号',c:68},
            {k:last.replace(/^[一二三四五]、/,''),v:content,c:79}
          ];
        }
        function selectDocType(t){ docType.value=t; renderIdentification(); }
        function syncElementsToForm(){
          const map=Object.fromEntries(elements.value.map(e=>[e.k,e.v]));
          if(map['主送机关']) form.recipient=map['主送机关'];
          if(map['主要事实/情况']) form.summary=map['主要事实/情况'];
          if(map['政策或业务依据']) basisInput.value=map['政策或业务依据'];
          const lastKey=OUTLINES[scenarioOf()].slice(-1)[0].replace(/^[一二三四五]、/,'');
          if(map[lastKey]) nextActionInput.value=map[lastKey];
        }

        // ===== 初稿生成（按子场景差异化模板 + 流式输出） =====
        const selectedTitle = ref(0);
        const config = reactive({redHead:true,sources:true,responsible:true,tone:true});
        const docHtml = ref('');
        const isStreaming = ref(false);
        const streamingHtml = ref('');
        const titleOptions = ref([]);

        function cleanTopic(title,type){
          return String(title||(type==='请示'?'有关事项':'有关工作'))
            .replace(/^关于/,'').replace(/的(?:请示|报告)$/,'').replace(/^(申请|请求)/,'').trim();
        }
        function cleanSentence(v){ return String(v||'').trim().replace(/[。；，、！？]+$/,''); }
        function cnDate(v){ const m=String(v||'').match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); return m?`${m[1]}年${Number(m[2])}月${Number(m[3])}日`:(v||'成文日期待定'); }
        function docTitleList(type,title){
          const topic=cleanTopic(title,type);
          if(type==='请示') return [`关于${topic}的请示`,`关于请求协调解决${topic}的请示`,`关于${topic}有关事项的请示`];
          return [`关于${topic}的报告`,`关于报送${topic}情况的报告`,`关于${topic}阶段性情况的专题报告`];
        }
        function esc(s){ return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

        function bodyParas(sc){
          const sum=cleanSentence(form.summary||'');
          const basis=cleanSentence(basisInput.value||'有关政策文件及会议纪要');
          const next=cleanSentence(nextActionInput.value||'持续推进有关工作，及时报送阶段进展');
          const owner=cleanSentence(ownerInput.value||'由相关业务处室牵头落实');
          const src=(k,t)=>config.sources?`<span class="source-mark" data-source="${k}">${esc(t)}</span>`:esc(t);
          const H=(h,t)=>`<p><b>${h}</b></p><p>${t}</p>`;
          switch(sc){
            case 'duty':
              return [`<p>${config.tone?'现将履职情况报告如下：':'履职情况如下：'}</p>`,
                H('一、职责履行情况', src('fact',esc(sum||'本年度按职责要求持续推进各项任务'))+'。'),
                H('二、主要工作', '围绕年度重点任务，统筹推进专项工作与日常管理，确保各项职责落实到位。'),
                H('三、工作成效', '已形成阶段性工作成果，相关指标稳步提升。'),
                H('四、存在不足', '在跨部门协同与精细化管理方面仍有提升空间。'),
                H('五、改进措施', src('next',esc(next))+'。'+(config.responsible?esc(owner)+'。':''))];
            case 'problem':
              return [`<p>${config.tone?'现将有关问题反映如下：':'有关问题如下：'}</p>`,
                H('一、问题表现', src('fact',esc(sum||'当前存在需要关注的问题'))+'。'),
                H('二、原因分析', '经初步分析，问题成因涉及机制衔接、资源保障与落实环节等方面。'),
                H('三、处置建议', src('next',esc(next))+'。'+(config.responsible?esc(owner)+'。':''))];
            case 'suggestion':
              return [`<p>${config.tone?'现就有关工作提出建议如下：':'有关建议如下：'}</p>`,
                H('一、现状情况', src('fact',esc(sum||'结合当前工作实际'))+'。'),
                H('二、建议事项', '建议针对关键环节优化流程、完善机制并加强统筹。'),
                H('三、建议理由', `依据${src('basis',esc(basis))}，该建议具备必要性与可行性。`),
                H('四、实施建议', src('next',esc(next))+'。'+(config.responsible?esc(owner)+'。':''))];
            case 'permission':
              return [`<p>为规范推进有关工作，现就权限申请事项请示如下。</p>`,
                H('一、现有权限情况', src('fact',esc(sum||'当前权限尚不能满足工作需要'))+'。'),
                H('二、申请权限事项', '申请明确相应业务办理权限及适用范围。'),
                H('三、申请理由', `依据${src('basis',esc(basis))}，确属工作必需。`),
                H('四、影响范围与管控', src('next',esc(next))+'。'+(config.responsible?esc(owner)+'。':'')),
                `<p>妥否，请批示。</p>`];
            case 'coordinate':
              return [`<p>为妥善推进有关事项，现就协调事宜请示如下。</p>`,
                H('一、协调事项', src('fact',esc(sum||'有关事项需多方协同'))+'。'),
                H('二、情况说明', `依据${src('basis',esc(basis))}，事项涉及多部门职责交叉。`),
                H('三、协调建议', '建议明确牵头单位与协办单位职责分工及办理时限。'),
                H('四、协办单位职责', src('next',esc(next))+'。'+(config.responsible?esc(owner)+'。':'')),
                `<p>妥否，请批示。</p>`];
            case 'request':
              return [`<p>为妥善推进${esc(cleanTopic(form.taskTitle,'请示'))}，根据${src('basis',esc(basis))}，结合当前工作实际，现就有关事项请示如下。</p>`,
                H('一、请示事项', `<span class="source-mark" data-source="request">${esc(cleanSentence(form.summary||'对有关事项予以研究支持'))}。</span>`),
                H('二、请示理由', '当前有关工作已进入关键阶段，需进一步统筹资源、明确办理路径，需上级部门予以指导和协调。'),
                H('三、办理建议', esc(owner)+'。'),
                `<p>妥否，请批示。</p>`];
            default: // progress
              return [`<p>${config.tone?'现将有关情况报告如下：':'有关情况如下：'}</p>`,
                H('一、工作进展', `<span class="source-mark" data-source="fact">${esc(sum||'现阶段工作正按计划推进')}。</span>`),
                H('二、主要成效', '围绕年度重点任务，持续完善工作机制，推动相关事项协同落实，已形成阶段性工作成果。'),
                H('三、存在问题', '当前仍存在跨部门协同、资料汇集与后续落实等方面需要持续关注的问题。'),
                H('四、下一步工作', `<span class="source-mark" data-source="next">${esc(next)}。</span>${config.responsible?esc(owner)+'。':''}`)];
          }
        }

        function buildDocHtml(){
          const type=docType.value; const sc=scenarioOf();
          const title=docTitleList(type,form.taskTitle)[selectedTitle.value]||docTitleList(type,form.taskTitle)[0];
          const secretLine = form.secret!=='非涉密' ? `<div class="doc-secret">密级：${esc(form.secret)}${form.secretPeriod?'　保密期限：'+esc(form.secretPeriod):''}</div>` : '';
          const urgencyLine = form.urgency!=='常规' ? `<div class="doc-urgency">${esc(form.urgency)}</div>` : '';
          const head = config.redHead ? `<div class="red-head">${esc(form.department||'南京江北新区管理委员会办公室')}文件</div>` : '';
          const numRow = `<div class="doc-num-row"><span class="doc-number">${esc(form.docNumber||'〔2026〕XX号')}</span><span class="doc-signer">签发人：${esc(form.signer||'待签发')}</span></div>`;
          const redline = config.redHead ? `<div class="red-line"></div>` : '';
          const body=bodyParas(sc).join('');
          const attach = files.value.length?`<div class="doc-attach">附件：${files.value.map(f=>esc(f.name)).join('；')}</div>`:'';
          const note = `<div class="doc-note">（联系人：${esc(currentUser.value.name)}；联系电话：${esc(form.phone||'—')}）</div>`;
          const cc = form.ccRecipients?`<div class="doc-record"><div>抄送：${esc(form.ccRecipients)}</div></div>`:'';
          return `${secretLine}${urgencyLine}${head}${numRow}${redline}`+
            `<h1>${esc(title)}</h1><div class="doc-meta">${esc(form.recipient||'主送机关')}：</div>`+
            body+attach+
            `<p class="right-align" style="margin-top:18px;">${esc(form.department||'发文单位')}</p><p class="right-align">${esc(cnDate(form.submitDate))}</p>`+
            note+cc;
        }
        function renderDocument(){
          titleOptions.value = docTitleList(docType.value,form.taskTitle);
          docHtml.value = buildDocHtml();
          startStreaming();
        }
        let streamTimer=null;
        function startStreaming(){
          if(streamTimer) clearInterval(streamTimer);
          isStreaming.value=true; streamingHtml.value='';
          const full=docHtml.value; let i=0;
          const chunk=Math.max(3,Math.floor(full.length/60));
          streamTimer=setInterval(()=>{
            i+=chunk;
            streamingHtml.value=full.slice(0,i);
            if(i>=full.length){ clearInterval(streamTimer); streamTimer=null; isStreaming.value=false; streamingHtml.value=full; }
          },30);
        }
        function regenerate(){ docHtml.value=buildDocHtml(); startStreaming(); showToast('已依据最新要素重新生成初稿。',true); }
        function selectTitle(i){ selectedTitle.value=i; regenerate(); }

        // ===== 弹窗 / Toast =====
        const modalShow=ref(false); const modalTitle=ref(''); const modalBody=ref(''); const modalOkText=ref('确认'); const modalHideFooter=ref(false); let modalOkHandler=null;
        function openModal(title,body,onOk,okText){ modalTitle.value=title; modalBody.value=body; modalOkText.value=okText||'确认'; modalHideFooter.value=false; modalOkHandler=onOk||closeModal; modalShow.value=true; }

        function newTask(){ step.value=1; unlocked.value=1; Object.keys(checkStates).forEach(k=>delete checkStates[k]); taskStatus.value='draft'; exempted.value=false; selectedTitle.value=0; resetForm(); taskName.value='新建报告请示任务'; taskMeta.value='请填写或上传上行文材料，系统将在后续环节自动处理。'; goStep(1,true); showToast('已创建新任务，请开始录入材料。',true); }

          outputDocName, downloadDoc, submitReview, approveTask, rejectTask, archiveTask,

      },
      template: `

                        <div class="missing-item"><span class="missing-name">政策或业务依据<small>请示/意见场景建议必填</small></span><n-input v-model:value="basisInput" placeholder="例如：宁新区发〔2026〕12号文及相关会议纪要" /><span class="tag-pill wait">待补充</span></div>
                        <div class="missing-item"><span class="missing-name">下一步工作安排<small>报告场景建议补充</small></span><n-input v-model:value="nextActionInput" placeholder="例如：拟于三季度完成专项攻坚并形成长效机制" /><span class="tag-pill wait">待补充</span></div>
                        <div class="missing-item"><span class="missing-name">责任主体与时限<small>用于生成执行性表述</small></span><n-select v-model:value="ownerInput" :options="['由发文单位牵头，相关部门配合','由业务处室负责，限期办理','由上级部门统筹协调'].map(o=>({label:o,value:o}))" placeholder="请选择" /><span class="tag-pill wait">待确认</span></div>
                      </div></div>
                      <div class="stage-actions"><n-button @click="backStep(1)">返回材料录入</n-button><div class="right"><n-button type="primary" @click="toStep3">确认要素，进入文种识别<template #icon><icon name="arrow" /></template></n-button></div></div>
                    </div>
                    <aside>
                      <div class="card"><div class="card-head"><div class="card-title">解析摘要</div></div><div class="card-body"><div class="status-list">
                        <div class="status-line ok"><span class="status-ico"><icon name="check" /></span><span><b>识别材料类型</b><small>{{materialSummary}}</small></span><span class="status-tag">完成</span></div>
                        <div class="status-line ok"><span class="status-ico"><icon name="check" /></span><span><b>提取主体与时间</b><small>已抽取发文单位、报送对象和工作周期</small></span><span class="status-tag">完成</span></div>
                        <div class="status-line warn"><span class="status-ico"><icon name="alert" /></span><span><b>待人工确认</b><small>请确认请示事项或下一步工作表述</small></span><span class="status-tag">2 项</span></div>
                      </div></div></div>
                      <div class="card"><div class="card-head"><div class="card-title">来源材料</div></div><div class="card-body"><div v-if="files.length" class="status-list"><div v-for="f in files" :key="f.name" class="status-line ok"><span class="status-ico"><icon name="fileText" /></span><span><b>{{f.name}}</b><small>已纳入解析范围</small></span></div></div><div v-else class="empty">暂未上传附件，系统将基于已录入文本解析。</div></div></div>
                    </aside>
                  </div>
                </section>

                <!-- STEP 3 文种识别 -->
                <section class="stage-in" v-show="step===3">
                  <div class="stage-grid">
                    <div>
                      <div class="card"><div class="card-head"><div class="card-title"><span class="step-badge">STEP 3</span>文种属性识别与要素确认</div><span class="card-note">可直接点击内容进行修正</span></div><div class="card-body">
                        <div style="padding:16px;border:1px solid #d4e0f4;border-radius:10px;background:#f6f9ff;">
                          <div style="display:flex;align-items:center;gap:12px;"><span style="display:grid;place-items:center;width:44px;height:44px;border-radius:10px;color:#fff;background:linear-gradient(135deg,var(--ai-blue),var(--ai-cyan));box-shadow:var(--ai-glow)"><icon name="sparkles" style="width:1.3em;height:1.3em" /></span><span><b style="color:#243454;font-size:15px;">{{recommendTitle}}</b><p style="margin:3px 0 0;color:#748198;font-size:12px;line-height:1.55;">{{recommendDesc}}</p></span></div>
                          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px;">
                            <button v-for="t in ['报告','请示']" :key="t" class="title-option" :class="{on:docType===t}" style="display:block;flex-direction:column;align-items:flex-start;" @click="selectDocType(t)"><strong style="display:block;color:#36445d;font-size:14px;" :style="{color:docType===t?'var(--ai-blue)':'#36445d'}">{{t}}</strong><small style="display:block;margin-top:4px;color:#7f8ba0;font-size:11px;">{{t==='报告'?'陈述工作进展、成果、问题或工作建议，不以请求批复为目的。':'就具体事项请求批准、指示或协调，一文一事。'}}</small></button>
                          </div>
                          <div style="margin-top:14px;border-top:1px solid #dce5f2;">
                            <div v-for="(r,i) in attributeRules" :key="i" style="display:flex;gap:8px;padding:9px 0;border-bottom:1px solid #dce5f2;font-size:12px;line-height:1.45;color:#5c6a80;"><icon :name="r.ok?'check':'alert'" :style="{color:r.ok?'var(--ai-green)':'var(--ai-amber)'}" /><span>{{r.text}}</span></div>
                          </div>
                        </div>
                      </div></div>
                      <div class="card"><div class="card-head"><div class="card-title">结构化要素</div><span class="card-note">修改内容会同步应用至初稿生成</span></div>
                        <n-data-table :columns="[{title:'要素',key:'k',width:135},{title:'识别结果',key:'v',render:(row)=>h('div',{contenteditable:true,onBlur:e=>{row.v=e.target.innerText}},row.v)}]" :data="elements" :bordered="false" :single-line="false" size="small" /></div>
                      <div class="stage-actions"><n-button @click="backStep(2)">返回解析补全</n-button><div class="right"><n-button @click="previewOutline"><template #icon><icon name="list" /></template>预览提纲</n-button><n-button type="primary" @click="previewOutline">确认文种，生成初稿<template #icon><icon name="arrow" /></template></n-button></div></div>
                    </div>
                    <aside>
                      <div class="card"><div class="card-head"><div class="card-title">文种校验说明</div></div><div class="card-body"><div class="subtle-note"><icon name="shield" /><span>报告与请示不可混用。系统将对标题、正文目的、请求性表述和事项数量进行校验，发现冲突时提示人工确认。工作建议归入建议性报告，不要求批复。</span></div></div></div>
                      <div class="card"><div class="card-head"><div class="card-title">适用模板</div></div><div class="card-body"><div class="title-option on">江北新区政务上行文通用模板<br><small>适用：各委办局工作报告（含建议性报告）、事项请示；按办文场景差异化结构</small></div><n-button size="small" @click="previewTemplate"><template #icon><icon name="eye" /></template>查看模板要素</n-button></div></div>
                    </aside>
                  </div>
                </section>

                <!-- STEP 4 初稿生成 -->
                <section class="stage-in" v-show="step===4">
                  <div class="stage-grid">
                    <div>
                      <div class="document-shell">
                        <div class="document-tools">
                          <span class="hint">文稿支持直接编辑；含发文字号/签发人/密级/紧急程度/附件说明/抄送/附注等公文要素。点击黄色标记可溯源。
                            <span v-if="isStreaming" style="color:var(--ai-cyan);font-weight:700;margin-left:6px;">智能体生成中<span class="thinking-dot"></span><span class="thinking-dot"></span><span class="thinking-dot"></span></span>
                          </span>
                          <n-button size="small" @click="regenerate" :loading="isStreaming"><template #icon><icon name="refresh" /></template>重新生成</n-button>
                        </div>
                        <article class="document-page" id="docPage" contenteditable="true" v-html="isStreaming?streamingHtml:docHtml" :class="{'typing-cursor':isStreaming}" @click="onDocClick"></article>
                      </div>
                      <div class="stage-actions"><n-button @click="backStep(3)">返回文种识别</n-button><div class="right"><n-button @click="saveDraft"><template #icon><icon name="edit" /></template>保存草稿</n-button><n-button type="primary" @click="toStep5">下一步：校验文稿<template #icon><icon name="arrow" /></template></n-button></div></div>
                    </div>
                    <aside>
                      <div class="card"><div class="card-head"><div class="card-title">标题建议</div></div><div class="card-body">
                        <button v-for="(t,i) in titleOptions" :key="i" class="title-option" :class="{on:selectedTitle===i}" @click="selectTitle(i)"><span class="title-text">{{t}}</span><span class="title-tag" :class="i===0?'rec':'alt'">{{i===0?'推荐标题':'备选标题'}}</span></button>
                      </div></div>
                      <div class="card"><div class="card-head"><div class="card-title">生成配置</div></div><div class="card-body">
                        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #eef1f6;font-size:12.5px;"><span>显示单位版头</span><n-switch v-model:value="config.redHead" @update:value="regenerate" /></div>
                        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #eef1f6;font-size:12.5px;"><span>引用材料来源</span><n-switch v-model:value="config.sources" @update:value="regenerate" /></div>
                        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #eef1f6;font-size:12.5px;"><span>自动补全责任主体与时限</span><n-switch v-model:value="config.responsible" @update:value="regenerate" /></div>
                        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:12.5px;"><span>使用单位规范表述</span><n-switch v-model:value="config.tone" @update:value="regenerate" /></div>
                      </div></div>
                      <div class="card"><div class="card-head"><div class="card-title">生成说明</div></div><div class="card-body"><div class="subtle-note"><icon name="alert" /><span>初稿依据已确认要素、适用模板和当前规则生成。涉及政策事实、资金金额、审批权限等内容必须由经办人核实。</span></div></div></div>
                    </aside>
                  </div>
                </section>

                <!-- STEP 5 校验 -->
                <section class="stage-in" v-show="step===5">
                  <div class="stage-grid">
                    <div>
                      <div class="document-shell">
                        <div class="document-tools"><span class="hint">点击右侧校验项可定位相关文稿内容；黄色标记可点击溯源。</span><n-button size="small" @click="runCheck" :loading="checkRunning"><template #icon><icon name="refresh" /></template>重新校验</n-button></div>
                        <article class="document-page" id="checkDocPage" v-html="checkDocHtml" @click="onDocClick"></article>
                      </div>
                      <div class="stage-actions"><n-button @click="backStep(4)">返回文稿编辑</n-button><div class="right">
                        <n-button v-if="canExempt && !allBlockResolved() && !exempted" @click="applyExempt"><template #icon><icon name="key" /></template>申请规则豁免</n-button>
                        <n-button type="primary" :disabled="!allBlockResolved()" @click="toStep6">校验通过，进入提交<template #icon><icon name="arrow" /></template></n-button>
                      </div></div>
                    </div>
                    <aside>
                      <div class="card"><div class="card-head"><div class="card-title">校验结果</div><span class="card-note">{{checkResultText}}</span></div><div class="card-body">
                        <div style="padding:4px 0 2px;"><div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;color:#718098;"><span>{{checkLabel}}</span><b>{{checkProgress}}%</b></div><n-progress type="line" :percentage="checkProgress" :show-indicator="false" /></div>
                        <div class="check-list">
                          <div v-for="c in checkCards" :key="c.id" class="check-card" :class="{resolved:checkStates[c.id]&&checkStates[c.id].resolved}">
                            <div class="check-head">
                              <span class="tag-pill" :class="c.level==='block'?'block':'wait'">{{c.label}}</span>
                              <span class="check-dim">{{c.dim}}<small>{{c.rule}}</small></span>
                              <span class="check-c-ops" v-if="checkStates[c.id]&&checkStates[c.id].resolved">
                                <span class="done-mark">✓ 已采纳</span><span class="sep">|</span><a @click.stop="undoCheckFix(c.id)">↩ 撤回</a>
                              </span>
                              <span class="check-c-ops" v-else>
                                <a @click.stop="applyCheckFix(c.id)">采纳建议</a><span class="sep">|</span><a @click.stop="locateCheck">定位文稿</a>
                              </span>
                            </div>
                            <div class="check-line"><span class="check-badge orig">原文</span><span class="del">{{c.orig}}</span></div>
                            <div class="check-line"><span class="check-badge sugg">建议</span><span class="ins">{{c.sugg}}</span></div>
                          </div>
                        </div>
                      </div></div>
                      <div class="card"><div class="card-head"><div class="card-title">校验范围</div></div><div class="card-body"><div class="status-list">
                        <div class="status-line ok"><span class="status-ico"><icon name="check" /></span><span><b>文种属性</b><small>报告/请示/意见适用性、标题与正文一致性、一文一事</small></span></div>
                        <div class="status-line ok"><span class="status-ico"><icon name="check" /></span><span><b>内容完整性</b><small>主送机关、事实数据、请求事项、依据文号与建议</small></span></div>
                        <div class="status-line ok"><span class="status-ico"><icon name="check" /></span><span><b>格式规范</b><small>发文字号、签发人、标题、层次、附件说明、落款及成文日期</small></span></div>
                      </div></div></div>
                    </aside>
                  </div>
                </section>

                <!-- STEP 6 输出与提交 -->
                <section class="stage-in" v-show="step===6">
                  <div class="card"><div class="card-head"><div class="card-title"><span class="step-badge">STEP 6</span>成果输出与审核提交</div><span class="tag-pill" :class="exempted?'purple':'done'"><icon name="check" />{{exempted?'已豁免校验':'已完成校验'}}</span></div><div class="card-body"><div class="output-grid">
                    <div class="output-item"><span class="output-icon"><icon name="fileText" style="width:1.3em;height:1.3em" /></span><div class="output-name">{{outputDocName}}</div><div class="output-desc">含单位版头、发文字号、签发人、标题、正文结构、附件说明、落款及版本记录。</div><div class="output-foot"><span>DOCX · 约 76KB</span><n-button size="small" @click="downloadDoc('正式文稿')">下载</n-button></div></div>
                    <div class="output-item"><span class="output-icon"><icon name="sparkles" style="width:1.3em;height:1.3em" /></span><div class="output-name">文种属性校验结果</div><div class="output-desc">文种适用性、标题与正文一致性、一文一事、请求性表述校验结论。</div><div class="output-foot"><span>PDF · 约 180KB</span><n-button size="small" @click="downloadDoc('文种属性校验')">下载</n-button></div></div>
                    <div class="output-item"><span class="output-icon"><icon name="shield" style="width:1.3em;height:1.3em" /></span><div class="output-name">格式校验结果</div><div class="output-desc">发文字号、签发人、标题、层次、附件说明、落款及成文日期等格式校验结论。</div><div class="output-foot"><span>PDF · 约 220KB</span><n-button size="small" @click="downloadDoc('格式校验')">下载</n-button></div></div>
                    <div class="output-item"><span class="output-icon"><icon name="list" style="width:1.3em;height:1.3em" /></span><div class="output-name">结构化要素清单</div><div class="output-desc">留存任务要素、来源材料、文种确认和规则版本。</div><div class="output-foot"><span>XLSX · 约 18KB</span><n-button size="small" @click="downloadDoc('要素清单')">下载</n-button></div></div>
                  </div></div></div>
                  <div class="card"><div class="card-head"><div class="card-title">后续流程衔接</div><span class="card-note">当前状态：{{taskStatus}}</span></div><div class="card-body"><div class="process-track">
                    <div class="process-node done"><span class="process-dot"><icon name="check" /></span><div class="process-name">材料确认</div></div>
                    <div class="process-node done"><span class="process-dot"><icon name="check" /></span><div class="process-name">初稿生成</div></div>
                    <div class="process-node done"><span class="process-dot"><icon name="check" /></span><div class="process-name">规则校验</div></div>
                    <div class="process-node" :class="{done:taskStatus==='approved'||taskStatus==='archived',current:taskStatus==='submitted'}"><span class="process-dot"><icon v-if="taskStatus==='approved'||taskStatus==='archived'" name="check" /><template v-else>4</template></span><div class="process-name">部门审核</div></div>
                    <div class="process-node" :class="{done:taskStatus==='archived',current:taskStatus==='approved'}"><span class="process-dot"><icon v-if="taskStatus==='archived'" name="check" /><template v-else>5</template></span><div class="process-name">归档回写</div></div>
                  </div></div></div>
                  <div class="stage-actions"><n-button @click="backStep(5)">返回校验确认</n-button><div class="right">
                    <n-button v-if="role==='user'&&taskStatus==='draft'" type="primary" @click="submitReview"><template #icon><icon name="arrow" /></template>提交部门审核</n-button>
                    <template v-if="canReview&&taskStatus==='submitted'">
                      <n-button @click="rejectTask"><template #icon><icon name="x" /></template>退回修改</n-button>
                      <n-button type="primary" @click="approveTask"><template #icon><icon name="check" /></template>审核通过</n-button>
                    </template>
                    <n-button v-if="canReview&&taskStatus==='approved'" type="primary" @click="archiveTask"><template #icon><icon name="shield" /></template>归档回写</n-button>
                    <n-tag v-if="taskStatus==='archived'" type="success" size="large" round>已归档回写 · 流程闭环</n-tag>
                    <n-tag v-if="role==='super'&&taskStatus==='draft'" type="info" size="large" round>超级管理员只读演示（请切换为普通用户提交）</n-tag>
                  </div></div>
                </section>
              </div>
            </main>

            <!-- ===== 历史台账 ===== -->
            <main class="view" :class="{active:view==='history'}" id="view-history"><div class="page-scroll">
              <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;">
                <div><div style="font-size:21px;font-weight:700;color:#162644;">历史任务记录</div><div style="margin-top:5px;color:var(--muted);font-size:13px;">数据范围：{{currentUser.scope}} · 查看报告请示任务的生成、校验、审核和导出留痕，可复用已完成任务。</div></div>
                <n-space><n-select v-model:value="historyFilter" :options="['全部状态','已归档','待审核','已退回','生成中'].map(o=>({label:o,value:o}))" style="width:130px" /><n-button @click="downloadDoc('台账')"><template #icon><icon name="download" /></template>导出台账</n-button></n-space>
              </div>
              <div class="card"><div class="card-head"><div class="card-title">生成任务台账 <span class="card-note">共 {{filteredHistory.length}} 条</span></div><n-input v-model:value="historySearch" placeholder="搜索任务名称" style="width:210px" clearable /></div>
                <n-data-table :columns="historyColumns" :data="filteredHistory" :bordered="false" /></div>
            </div></main>

            <!-- ===== 模板与规则 ===== -->
            <main class="view" :class="{active:view==='rules'}" id="view-rules"><div class="page-scroll">
              <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;">
                <div><div style="font-size:21px;font-weight:700;color:#162644;">模板与规则配置</div><div style="margin-top:5px;color:var(--muted);font-size:13px;">按委办局、文种和业务场景维护模板、强制规则和单位规范表述；规则发布后对新建任务生效。</div></div>
                <n-space><n-button @click="previewTemplate"><template #icon><icon name="eye" /></template>模板预览</n-button><n-button type="primary" @click="addRule"><template #icon><icon name="filePlus" /></template>{{canManageRule?'新增规则':'提交规则建议'}}</n-button></n-space>
              </div>
              <div class="subtle-note" style="margin-bottom:16px;"><icon name="shield" /><span v-if="canManageRule">您拥有规则新增、启用/停用、发布权限，操作均记录审计日志。</span><span v-else>您可提交规则建议，启用/停用与发布需超级管理员处理；强制规则命中后作为阻断项，可由审核人说明豁免原因。</span></div>
              <div class="rule-layout">
                <aside class="card"><div class="card-head"><div class="card-title">规则分类</div></div><div class="card-body" style="padding:9px;"><div class="rule-menu">
                  <button v-for="c in ruleCategories" :key="c.key" :class="{active:ruleCategory===c.key}" @click="ruleCategory=c.key">{{c.label}}<span class="counter">{{c.count}}</span></button>
                </div></div></aside>
                <section class="card"><div class="card-head"><div class="card-title">规则列表</div><span class="card-note">当前单位：{{currentUser.dept}}</span></div><div class="card-body">
                  <div v-for="(r,i) in filteredRules" :key="i" class="rule-row-table">
                    <span class="tag-pill" :class="r[3]==='阻断'?'block':'wait'">{{r[3]}}</span>
                    <span><b style="display:block;color:#3c4b64;margin-bottom:2px;">{{r[1]}}</b>{{r[2]}}</span>
                    <span class="switch-text" :style="{color:ruleEnabled[r[4]]?'var(--ai-green)':'var(--ai-red)'}">{{ruleEnabled[r[4]]?'已启用':'已停用'}} · {{r[4]}}</span>
                    <div style="display:flex;gap:11px;align-items:center;"><n-switch v-if="canManageRule" :value="ruleEnabled[r[4]]" @update:value="()=>toggleRule(r)" size="small" /><button class="row-action" @click="viewRule(r)">{{canManageRule?'编辑':'查看'}}</button></div>
                  </div>
                </div></section>
              </div>
            </div></main>

            <!-- ===== 审计日志（超级管理员） ===== -->
            <main class="view" :class="{active:view==='audit'}" id="view-audit"><div class="page-scroll">
              <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;">
                <div><div style="font-size:21px;font-weight:700;color:#162644;">审计日志</div><div style="margin-top:5px;color:var(--muted);font-size:13px;">记录生成、修改、校验、导出、提交、审核、豁免、归档及规则变更等全部操作，仅超级管理员可查。</div></div>
                <n-button @click="downloadDoc('审计日志')"><template #icon><icon name="download" /></template>导出审计日志</n-button>
              </div>
              <div class="card"><div class="card-head"><div class="card-title">操作留痕 <span class="card-note">共 {{auditLogs.length}} 条</span></div></div>
                <n-data-table :columns="[
                  {title:'时间',key:0,width:160},
                  {title:'操作人',key:1,width:120},
                  {title:'所属单位',key:2,width:150},
                  {title:'操作类型',key:3,width:110,render:r=>h('span',{class:'tag-pill '+(['审核通过','归档回写'].includes(r[3])?'done':(['规则豁免','停用规则'].includes(r[3])?'block':'doing'))},r[3])},
                  {title:'操作对象',key:4},
                  {title:'备注',key:5,width:120}
                ]" :data="auditLogs" :bordered="false" /></div>
            </div></main>
          </div>

          <!-- 弹窗 -->
          <n-modal v-model:show="modalShow" preset="card" :title="modalTitle" style="width:590px;max-width:calc(100vw - 40px);" :bordered="false">
            <div v-html="modalBody" style="color:#526078;font-size:13px;line-height:1.65;"></div>
            <template v-if="!modalHideFooter" #footer>
              <div style="display:flex;justify-content:flex-end;gap:8px;"><n-button @click="closeModal">取消</n-button><n-button type="primary" @click="onModalOk">{{modalOkText}}</n-button></div>
            </template>
          </n-modal>

          <!-- Toast -->
          <transition name="fadeUp">
            <div v-if="toastShow" style="position:fixed;top:74px;right:22px;z-index:40;max-width:360px;padding:11px 13px;border-radius:10px;color:#fff;box-shadow:0 12px 30px rgba(25,38,61,.22);font-size:13px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.18);" :style="{background:toastSuccess?'var(--ai-green)':'rgba(28,41,65,.92)'}">{{toastText}}</div>
          </transition>
        </n-config-provider>
      `
    });
    app.use(naive);
    app.component('Icon', Icon);
    app.mount('#app');
  </script>
</body>
</html>
