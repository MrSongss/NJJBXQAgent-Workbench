const units=[["u1","第一条","为了保障公民、法人和其他组织依法获取政府信息，提高政府工作的透明度，建设法治政府，充分发挥政府信息对人民群众生产、生活和经济社会活动的服务作用，制定本条例。"],["u2","第二条","本条例所称政府信息，是指行政机关在履行行政管理职能过程中制作或者获取的，以一定形式记录、保存的信息。"],["u14","第十四条","依法确定为国家秘密的政府信息，法律、行政法规禁止公开的政府信息，以及公开后可能危及国家安全、公共安全、经济安全、社会稳定的政府信息，不予公开。"],["u15","第十五条","涉及商业秘密、个人隐私等公开会对第三方合法权益造成损害的政府信息，行政机关不得公开。但是，第三方同意公开或者行政机关认为不公开会对公共利益造成重大影响的，予以公开。"],["u27","第二十七条","除行政机关主动公开的政府信息外，公民、法人或者其他组织可以向地方各级人民政府、对外以自己名义履行行政管理职能的县级以上人民政府部门申请获取相关政府信息。"],["u29","第二十九条","公民、法人或者其他组织申请获取政府信息的，应当向行政机关的政府信息公开工作机构提出，并采用包括信件、数据电文在内的书面形式；采用书面形式确有困难的，申请人可以口头提出，由受理该申请的政府信息公开工作机构代为填写政府信息公开申请。"],["u30","第三十条","政府信息公开申请应当包括下列内容：（一）申请人的姓名或者名称、身份证明、联系方式；（二）申请公开的政府信息的名称、文号或者便于行政机关查询的其他特征性描述；（三）申请公开的政府信息的形式要求，包括获取信息的方式、途径。"],["u33","第三十三条","行政机关收到政府信息公开申请，能够当场答复的，应当当场予以答复。行政机关不能当场答复的，应当自收到申请之日起20个工作日内予以答复；需要延长答复期限的，应当经政府信息公开工作机构负责人同意并告知申请人，延长的期限最长不得超过20个工作日。"],["u36","第三十六条","对政府信息公开申请，行政机关应当根据不同情况分别作出答复；所申请公开信息已经主动公开的，应当告知申请人获取该政府信息的方式、途径；可以公开的，应当向申请人提供该政府信息，或者告知申请人获取该政府信息的方式、途径和时间。"]];

function render(){ $("#summary").innerHTML=intro("核心摘要与政策背景","回答为什么出台、解决什么问题，并提炼总体要求。",4)+'<div class="cards">'+card("一句话摘要","条例建立政府信息主动公开与依申请公开制度，保障社会公众依法获取政府信息，提高政府透明度并推进法治政府建设。","u1","第一条","target")+card("出台背景","针对政府信息获取渠道、公开边界与答复标准不统一等问题，形成统一制度规范。","u1","第一条","book")+card("政策对象","政府信息是行政机关履职过程中制作或获取，并以一定形式记录、保存的信息。","u2","第二条","file")+card("治理目标","保障知情权和监督权，提升行政透明度与政务服务可预期性。","u1","第一条","users")+"</div>";
$("#path").innerHTML=intro("申请办理实施路径","按“准备—申请—受理—答复”排序，并核验责任、材料、时限、渠道。",4)+'<div class="path">'+step(1,"确认申请范围","确定目标信息及有权受理的行政机关。","申请人","提交前","目标信息特征","u27","第二十七条")+step(2,"准备申请信息","准备身份、联系方式、信息名称或特征描述和获取方式。","申请人","提交时","身份与信息描述","u30","第三十条")+step(3,"选择申请渠道","向政府信息公开工作机构提交书面申请；书面困难可口头提出并由机构代填。","政府信息公开工作机构","申请时","信件 / 数据电文 / 口头代填","u29","第二十九条")+step(4,"受理与答复","能当场答复的当场答复；否则一般在20个工作日内答复，依法延长应告知。","受理行政机关","20个工作日内","答复或告知获取方式","u33","第三十三条")+"</div>";
$("#terms").innerHTML=intro("关键术语与限制条件","术语采用原文口径，突出适用对象、禁止性规定与权益保护边界。",5)+'<div class="term-table">'+term("政府信息","行政机关履职过程中制作或获取并记录、保存的信息。","u2","第二条")+term("申请主体","公民、法人或者其他组织。","u27","第二十七条")+term("禁止公开","国家秘密、法律法规禁止公开及可能危及安全稳定的信息。","u14","第十四条")+term("第三方权益","商业秘密、个人隐私原则上不得公开；符合法定例外的除外。","u15","第十五条")+term("答复时限","一般20个工作日；依法延长最长不超过20个工作日并告知申请人。","u33","第三十三条")+"</div>";

function report(){if(!S.parsed)return toast("请稍候","政策解读尚未完成。");S.report=true;$("#reportTab").hidden=false;$("#report").innerHTML='<article class="report-paper" id="wordReport"><div class="cover"><div class="word">W</div><h1>'+safe(S.name)+'解读报告</h1><p>江北新区政务AI智能体生成 · 结论逐条关联原文</p></div><div class="visuals">'+visual("target","政策宗旨","保障依法获取政府信息")+visual("users","适用对象","公民、法人和其他组织")+visual("clock","答复时限","一般20个工作日内")+visual("shield","公开边界","国家秘密及权益保护")+'</div><h2>一、核心摘要</h2><p>条例规范主动公开与依申请公开程序，保障公众依法获取政府信息。<span class="cite">【第一条、第二条】</span></p><h2>二、背景与目标</h2><p>解决信息获取路径、公开边界和答复标准不统一问题，提升政府透明度。<span class="cite">【第一条】</span></p><h2>三、实施路径</h2><ol><li>确认信息与受理机关。【第二十七条】</li><li>准备身份、联系方式、信息特征和获取要求。【第三十条】</li><li>通过信件、数据电文等方式申请。【第二十九条】</li><li>当场或一般20个工作日内答复。【第三十三条】</li></ol><h2>四、术语与限制</h2><p>政府信息定义及国家秘密、商业秘密、个人隐私等公开边界以原文为准。<span class="cite">【第二条、第十四条、第十五条】</span></p><h2>五、执行要素校验</h2><ul><li>责任主体：政府信息公开工作机构。</li><li>材料：身份、联系方式、信息描述、获取要求。</li><li>时限：一般20个工作日。</li><li>渠道：信件、数据电文或依法口头提出。</li></ul></article>';tab("report");$("#note").textContent="Word版解读报告已生成";$("#reportBtn").innerHTML=I("download")+"下载Word";$("#reportBtn").dataset.action="download";toast("报告已生成","已生成带图文摘要与原文依据的Word版报告。");post("complete",{title:S.name+"解读报告",version:S.version,summaryCount:4,pathCount:4,termCount:5,qaCount:4})}function visual(ic,t,c){return '<div class="visual"><span class="ibox">'+I(ic)+'</span><div><b>'+t+'</b><span>'+c+'</span></div></div>'}
