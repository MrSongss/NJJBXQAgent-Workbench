<!doctype html>
<!-- 重构版本：采用问题整改后直接生成报告、问题清单和留痕记录的自动闭环。 -->
<!--
  业务场景：南京江北新区政务 AI 智能体平台—辅助文本合规审查
  端类型：PC 端（Vue 3 + Naive UI）
  研发对接说明：
  1. 将 Vue 3、Naive UI CDN 引入替换为 npm 包并接入 Vite。
  2. 将 setup() 业务逻辑和 template 拆分为 .vue 单文件组件。
  3. themeOverrides、CSS 变量、动效与数据结构可原样保留。
  4. 文件解析、文种识别、合规审查、规则依据、报告生成和审查记录由后端接口替换当前演示逻辑。
-->

<head>

  <title>辅助文本合规审查 - 江北新区政务AI智能体平台</title>
  <style>

    .app-shell { height: 100%; min-width: 1120px; display: flex; flex-direction: column; }
    .topbar {

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand-title { font-size: 18px; font-weight: 600; letter-spacing: -.2px; }
    .brand-sub { margin-top: 2px; font-size: 11px; opacity: .78; }
    .top-user { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .top-user-meta { text-align: right; }
    .top-user-meta small { display: block; margin-top: 2px; opacity: .7; }
    .user-avatar {

      height: 34px;
      border-radius: 50%;

      border: 1px solid rgba(255,255,255,.24);

    .body-shell { flex: 1; min-height: 0; display: grid; grid-template-columns: 188px minmax(0, 1fr); }
    .sidenav {
      min-height: 0;
      padding: 18px 12px;
      background: rgba(255,255,255,.94);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
    }
    .nav-caption {

      font-size: 11px;
      letter-spacing: .5px;
    }
    .nav-btn {

    .main-view { min-width: 0; min-height: 0; overflow: auto; }

    .empty-stage {

      padding: 28px;

      place-items: center;
      background:

    .empty-card {

    .agent-avatar {

    .empty-card h2 { margin: 0; color: #14365e; font-size: 25px; font-weight: 600; letter-spacing: -.5px; }
    .empty-card p { max-width: 590px; margin: 12px auto 22px; color: var(--muted); font-size: 14px; line-height: 1.8; }
    .capability-grid { margin: 28px 0 8px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: left; }
    .capability {
      padding: 14px;
      border-radius: 11px;
      border: 1px solid #e4ebf2;

    .thinking-stage { flex: 1; min-height: 560px; display: grid; place-items: center; padding: 28px; }
    .thinking-card { width: 620px; padding: 34px 38px; border-radius: 16px; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow); }
    .thinking-title { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; color: #173f6c; font-size: 18px; font-weight: 600; }
    .thinking-mini-avatar {

      height: 38px;

    }
    .thinking-row {

      padding: 13px 15px;

    .thinking-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ai-cyan); display: inline-block; animation: dot-bounce 1.2s infinite ease-in-out; }
    .thinking-dot:nth-child(2) { animation-delay: .15s; }
    .thinking-dot:nth-child(3) { animation-delay: .3s; }

    .workspace {

      min-height: 0;
      display: grid;
      grid-template-columns: minmax(520px, 1fr) 430px;

    .stale-banner {

      line-height: 2;

    .paper {
      width: min(820px, 100%);
      min-height: 900px;
      margin: 0 auto;
      padding: 68px 76px 82px;
      color: #2e3540;
      background: #fff;
      border: 1px solid #e2e8ef;
      box-shadow: 0 8px 26px rgba(35,55,78,.07);
      font-family: "FangSong", "STFangsong", "SimSun", serif;

    .doc-mark {

    .doc-mark.medium { color: #9a6700; background: #fff0c2; box-shadow: inset 0 -1px 0 #fdb022; }

    .filter-row { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }

    .report-hero {

    @media (prefers-reduced-motion: reduce) {

    }

<body>
  <div id="app">
    <div style="height:100%;display:grid;place-items:center;color:#667085;">正在加载辅助文本合规审查智能体…</div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/naive-ui/dist/index.prod.js"></script>
  <script>
    const { createApp, ref, reactive, computed, watch, nextTick } = Vue;

    const app = createApp({
      setup() {
        const themeOverrides = {
          common: {
            primaryColor: "#0E4C92",
            primaryColorHover: "#1377B5",
            primaryColorPressed: "#0A3573",
            primaryColorSuppl: "#13A8A8",
            infoColor: "#13A8A8",
            infoColorHover: "#2BBDBD",
            successColor: "#43A047",

        function detectDocType(text) {
          const content = String(text || "");
          const rules = [
            ["会议纪要", /会议纪要|会议指出|会议强调|议定事项/],
            ["请示", /请示|妥否.{0,4}请批示|特此请示/],

            ["工作总结", /工作总结|现将.{0,10}总结如下|上半年工作/],
            ["通知", /通知如下|现就.{0,12}通知|请遵照执行/]
          ];
          for (const [name, regex] of rules) {
            if (regex.test(content)) return { type: name, confidence: 96 };
          }
          return { type: "通知", confidence: 72 };
        }

        watch(pasteText, (value) => {
          if (!value.trim()) {

          detectConfidence.value = result.confidence;
          selectedDocType.value = result.type;

        function makeIssue(id, dimension, risk, title, original, suggestion, basis, position) {

        function analyzeDocument(text, docType) {
          const content = String(text || "");
          const lines = content.split(/\n+/).map(s => s.trim()).filter(Boolean);
          const result = [];
          let id = 1;
          const push = (...args) => result.push(makeIssue(String(id++), ...args));

          if (content.includes("新区安全生产专项整治要求")) {

              "推动风险隐患排查整改形成闭环",
              "内容合规规则：避免无法客观验证的绝对化结果承诺。",
              "正文第2段");
          }
          if (content.includes("于七月十五日前")) {
            push("format", "medium", "日期数字用法不规范",
              "于七月十五日前",
              "于7月15日前",
              "格式规范规则：公文中的具体日期应使用阿拉伯数字。",
              "正文第4段");
          }
          if (content.includes("立即上报")) {
            push("writing", "general", "向上行文用语不规范",
              "立即上报",
              "立即报告",
              "行文规则：向上级机关反映情况时建议使用“报告”等规范表述。",
              "正文第4段");
          }
          if (content.includes("南京江北新区综合办公室")) {
            push("content", "medium", "落款机关名称需核实",
              "南京江北新区综合办公室",
              "请使用机构名录中的规范全称",
              "制度规则库：发文机关和落款机关名称应与机构名录保持一致。",
              "落款");
          }
          if (content.includes("问题清单") && !/[附\s]*件[：:]/.test(content)) {
            push("format", "medium", "正文提及附件但缺少附件说明",
              "报送检查情况和问题清单",
              "在正文后补充“附件：安全生产检查问题清单”",
              "格式规范规则：正文涉及附件时，应在正文后标注附件名称。",
              "正文末尾");

          if (docType === "请示" && /报告如下|特此报告/.test(content)) {
            push("writing", "high", "请示与报告存在混用",
              content.match(/报告如下|特此报告/)[0],

              "正文");

            const original = content.match(/妥否.{0,4}请批示|特此请示/)[0];
            push("writing", "high", "报告中夹带请示事项",

          const hasRecipient = lines.slice(1, 4).some(line => /[：:]$/.test(line));
          if (!hasRecipient && ["通知", "请示", "报告"].includes(docType)) {
            push("format", "high", "缺少主送机关",

        function beginAnalysis(isRecheck = false) {
          phase.value = "thinking";
          currentStep.value = 2;

          const stages = [1, 2, 3, 4];
          const timer = setInterval(() => {
            analysisStage.value = stages[index];
            index += 1;
            if (index >= stages.length) {
              clearInterval(timer);
              setTimeout(() => {
                task.issues = analyzeDocument(task.text, task.type);
                savedAnalysisText.value = task.text;
                savedAnalysisDocType.value = task.type;
                resultsStale.value = false;
                staleReason.value = "";
                addLog((isRecheck ? "重新审查完成" : "完成格式规范、行文规则、内容合规审查") + "，生成" + task.issues.length + "项问题");
                phase.value = "results";
                currentStep.value = 3;
                activeDimension.value = "all";
                activeRisk.value = "all";
                message.success(isRecheck ? "重新审查完成，问题清单已更新" : "合规审查完成");
              }, 320);
            }
          }, 380);
        }

          const sourceName = sourceMode.value === "paste"

        function escapeHtml(value) {
          return String(value || "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        }

        const renderedDocument = computed(() => {
          let html = task.text.split(/\n+/).map(line => "<p>" + escapeHtml(line) + "</p>").join("");
          task.issues.forEach(issue => {
            if (!issue.original || issue.original.startsWith("未识别")) return;
            const safeOriginal = escapeHtml(issue.original);
            const css = "doc-mark " + issue.risk + " " + issue.status + (activeIssueId.value === issue.id ? " active" : "");
            html = html.replace(safeOriginal,
              '<mark class="' + css + '" data-issue-id="' + issue.id + '">' + safeOriginal + "</mark>");
          });
          return html;
        });

        function focusIssue(issue) {
          activeIssueId.value = issue.id;

        function acceptIssue(issue) {
          if (issue.status === "accepted") return;
          if (issue.original && !issue.original.startsWith("未识别") && task.text.includes(issue.original)) {
            task.text = task.text.replace(issue.original, issue.suggestion);

          issue.status = "accepted";
          addLog("采纳整改：“" + issue.title + "”");
          message.success("已采纳修改");

          if (issue.status === "ignored") return;

          if (issue.status === "accepted" && issue.original && !issue.original.startsWith("未识别") && task.text.includes(issue.suggestion)) {
            task.text = task.text.replace(issue.suggestion, issue.original);

          issue.status = "pending";
          addLog("撤销问题处理：“" + issue.title + "”");
          message.info("已恢复为待处理");

          task.issues.filter(i => i.status === "pending").forEach(issue => {

            text: task.text,
            issues: JSON.parse(JSON.stringify(task.issues)),
            logs: JSON.parse(JSON.stringify(task.logs))
          };
          records.value.unshift(record);
          persistRecord(record);
          selectedRecord.value = record;
          phase.value = "report";
          currentStep.value = 4;
          showReport.value = true;
          message.success("审查报告、问题清单和版本记录已生成");

              type: "primary",
              onClick: () => viewRecord(row)
            }, { default: () => "查看详情" })
          }
        ];

        function downloadBlob(content, fileName, mime) {
          const blob = new Blob([content], { type: mime });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = fileName;
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
        }

        function downloadReport(record) {
          const rows = (record.issues || []).map((issue, index) =>
            "<tr><td>" + (index + 1) + "</td><td>" + dimensionLabel(issue.dimension) + "</td><td>" +
            riskLabel(issue.risk) + "</td><td>" + escapeHtml(issue.title) + "</td><td>" +
            escapeHtml(issue.original) + "</td><td>" + escapeHtml(issue.suggestion) + "</td><td>" +
            statusLabel(issue.status) + "</td></tr>"
          ).join("");
          const html = '<html><head><meta charset="UTF-8"></head><body>' +
            "<h1>" + escapeHtml(record.name) + "—合规审查报告</h1>" +
            "<p>文种：" + record.type + "　版本：" + record.version + "　生成时间：" + record.time + "</p>" +
            "<p>共发现" + record.total + "项问题，采纳" + (record.accepted || 0) + "项，忽略" + (record.ignored || 0) + "项。</p>" +
            '<table border="1" cellspacing="0" cellpadding="6"><tr><th>序号</th><th>审查维度</th><th>风险</th><th>问题</th><th>原文</th><th>整改建议</th><th>处理状态</th></tr>' +
            rows + "</table><p>说明：本报告为智能预审结果，供文稿定稿前整改参考。</p></body></html>";
          downloadBlob("\ufeff" + html, record.name + "_合规审查报告_" + record.version + ".doc", "application/msword;charset=utf-8");
          message.success("审查报告已下载");
        }

        function downloadIssueList(record) {
          const head = ["序号","审查维度","风险等级","问题","原文","整改建议","审查依据","处理状态"];
          const lines = [head].concat((record.issues || []).map((issue, index) => [
            index + 1,
            dimensionLabel(issue.dimension),
            riskLabel(issue.risk),
            issue.title,
            issue.original,
            issue.suggestion,
            issue.basis,
            statusLabel(issue.status)
          ]));
          const csv = lines.map(row => row.map(cell => '"' + String(cell || "").replaceAll('"', '""') + '"').join(",")).join("\r\n");
          downloadBlob("\ufeff" + csv, record.name + "_问题清单_" + record.version + ".csv", "text/csv;charset=utf-8");
          message.success("问题清单已下载");
        }

        return {
          themeOverrides, view, phase, currentStep, showNewTask, showReport, showRecordDetail,
          sourceMode, pasteText, uploadFile, selectedDocType, detectedDocType, detectConfidence, hasInput,
          analysisStage, activeDimension, activeRisk, activeIssueId, recordKeyword, recordType,

          undoIssue, acceptAll, ignoreAll, generateResult, viewRecord, startEditing,
          cancelDocumentEdit, saveDocumentEdit, changeTaskDocType, recheckCurrentTask,
          dimensionLabel, riskLabel, statusLabel, downloadReport, downloadIssueList

          </n-message-provider>
        </n-config-provider>
      `
    });

    app.use(naive);
    app.mount("#app");
  </script>
</body>
